<style>
  /* Gabarit « sober » : couleurs, police et textes viennent de la config du créateur (injectées par le serveur). */
  :root { --font: 'Montserrat'; --r: 16px; --r-sm: 12px; --r-lg: 24px; --green: #22C55E; --violet: #A855F7; --bg:#0B0A0C;--card:#17161A;--line:#2A2930;--text:#F5F5F7;--muted:#9B9AA3;--accent:#FCD005;--accent-ink:#0B0A0C;--accent2:#FCD005;--accent3:#FCD005; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 500 16px/1.6 var(--font), system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button, input { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
  .y { color: var(--accent); }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  /* ---------- En-tête ---------- */
  .top { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; gap: 28px; padding: 14px 20px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -.03em; white-space: nowrap; }
  .logo .pp { width: 34px; height: 34px; border: 2px solid var(--accent); }
  .menu { display: flex; gap: 4px; margin-right: auto; }
  .menu a { padding: 8px 14px; border-radius: 10px; color: var(--muted); font-weight: 600; font-size: 15px; transition: color .2s; position: relative; }
  .menu a:hover { color: var(--text); }
  .menu a.on { color: var(--text); }
  .menu a.on::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--card); font-weight: 700; font-size: 15px; white-space: nowrap; transition: border-color .2s; }
  .pill:hover { border-color: var(--accent); }
  .pill small { color: var(--muted); font-size: 13px; font-weight: 600; }
  .coin { width: 1.05em; height: 1.05em; flex: none; color: var(--accent); }

  /* ---------- Boutons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: var(--r-sm); padding: 13px 22px; font-weight: 700; font-size: 15px; cursor: pointer; transition: transform .2s, border-color .2s, background .2s, box-shadow .2s; white-space: nowrap; }
  .btn:hover { border-color: color-mix(in srgb, var(--text) 35%, var(--line)); transform: translateY(-2px); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn .arr { transition: transform .2s; }
  .btn:hover .arr { transform: translateX(4px); }
  .btn.big { padding: 16px 26px; font-size: 16px; }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; font-weight: 600; }
  .link:hover { color: var(--accent); }

  /* ---------- Mise en page ---------- */
  main { max-width: 1160px; margin: 0 auto; padding: 8px 20px 72px; }
  section { margin: 96px 0; }
  .page { animation: fadeIn .5s ease; }
  @keyframes fadeIn { from { opacity: 0; } }
  .head { margin-bottom: 28px; }
  .head.center { text-align: center; }
  .head h2 { font-size: clamp(30px, 4.4vw, 46px); }
  .head p { color: var(--muted); margin: 12px 0 0; max-width: 620px; font-weight: 500; }
  .head.center p { margin-inline: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
  .muted { color: var(--muted); }
  .pp { border-radius: 50%; object-fit: cover; background: var(--card); overflow: hidden; display: grid; place-items: center; font-weight: 800; flex: none; }
  .pp img { width: 100%; height: 100%; object-fit: cover; }

  /* Apparitions au scroll (le contenu reste visible sans JS) */
  .rv { transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1), filter .8s ease; }
  .js .rv:not(.in) { opacity: 0; transform: translateY(28px); filter: blur(6px); }

  /* ---------- Accueil ---------- */
  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; margin-top: 64px; }
  .hero h1 { font-size: clamp(40px, 6vw, 72px); }
  .hero p { color: var(--muted); font-size: 18px; margin: 22px 0 32px; max-width: 520px; }
  .ctas { display: flex; gap: 12px; flex-wrap: wrap; }
  .hero .load { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .hero .load:nth-child(2) { animation-delay: .12s; } .hero .load:nth-child(3) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); filter: blur(8px); } }
  .stage { position: relative; aspect-ratio: 1; max-width: 480px; width: 100%; justify-self: center; animation: rise 1s .2s cubic-bezier(.2,.8,.2,1) both; }
  .stage .photo { position: absolute; inset: 9% 9% 9% 9%; border-radius: var(--r-lg); overflow: hidden; background: var(--card); transform: rotate(-3deg) translateZ(0); backface-visibility: hidden; outline: 1px solid transparent; isolation: isolate; box-shadow: 0 30px 80px rgba(0,0,0,.55); display: grid; place-items: center; font-size: 120px; font-weight: 800; color: var(--accent-ink); }
  .stage .photo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); border-radius: inherit; }
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 99px; font-weight: 800; font-size: 15px; white-space: nowrap; animation: float 5s ease-in-out infinite; }
  .chip.g { background: var(--green); color: #04130A; box-shadow: 0 8px 24px rgba(34,197,94,.35); }
  .chip.o { border: 1.5px solid var(--text); background: var(--bg); color: var(--text); font-weight: 700; }
  .chip.c1 { top: 4%; left: 2%; } .chip.c2 { top: 16%; right: 0; animation-delay: -1.4s; } .chip.c3 { bottom: 12%; left: -2%; animation-delay: -2.6s; } .chip.c4 { bottom: 2%; right: 8%; animation-delay: -3.6s; }
  @keyframes float { 50% { transform: translateY(-12px); } }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 36px; margin-top: 32px; } .stage { max-width: 380px; } }

  /* Nuage de mots flottants */
  .cloud { position: relative; height: 300px; max-width: 760px; margin: 0 auto; }
  .cloud .chip { font-size: 18px; }
  .cloud .chip.big { font-size: 26px; padding: 10px 22px; }
  .spark { background: linear-gradient(135deg, var(--spark1, #C026D3), var(--violet)); color: #fff; padding: 12px 22px; border-radius: 14px; font-weight: 800; font-size: clamp(17px, 2.4vw, 22px); text-align: center; box-shadow: 0 0 40px color-mix(in srgb, var(--spark1, #C026D3) 45%, transparent); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; z-index: 2; }
  .spark::before, .spark::after { content: '✦'; position: absolute; color: #fff; font-size: 18px; animation: twinkle 1.6s ease-in-out infinite; }
  .spark::before { top: -12px; left: -8px; } .spark::after { bottom: -12px; right: -8px; animation-delay: -.8s; }
  @keyframes twinkle { 50% { opacity: .2; transform: scale(.6) rotate(45deg); } }
  @media (max-width: 600px) { .cloud { height: 340px; } .cloud .chip { font-size: 15px; } .cloud .chip.big { font-size: 20px; } .spark { white-space: normal; width: 86%; } }

  .tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .tool { padding: 24px; transition: transform .3s, border-color .3s; }
  .tool:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--text) 25%, var(--line)); }
  .tool.hl { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet) inset, 0 0 30px color-mix(in srgb, var(--violet) 15%, transparent); }
  .tool .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); margin-bottom: 18px; }
  .tool.hl .ic { background: color-mix(in srgb, var(--violet) 16%, transparent); color: var(--violet); }
  .tool .ic svg { width: 22px; height: 22px; }
  .tool b { display: block; font-weight: 800; font-size: 18px; margin-bottom: 6px; }
  .tool small { color: var(--muted); font-size: 14px; font-weight: 500; }
  @media (max-width: 900px) { .tools { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { .tools { grid-template-columns: 1fr; } }

  .faq { max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
  .faq details { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 0 22px; transition: border-color .2s; }
  .faq details[open] { border-color: color-mix(in srgb, var(--text) 25%, var(--line)); }
  .faq summary { list-style: none; cursor: pointer; padding: 20px 0; font-weight: 700; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: ''; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .25s; flex: none; margin-top: -4px; }
  .faq details[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
  .faq details p { margin: 0 0 20px; color: var(--muted); }

  .final { position: relative; overflow: hidden; text-align: center; padding: 64px 24px; border-radius: var(--r-lg); }
  .final::before { content: ''; position: absolute; inset: -40%; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 45%); animation: glow 8s ease-in-out infinite; }
  @keyframes glow { 50% { transform: translate(6%, 4%) scale(1.1); } }
  .final > * { position: relative; }
  .final h2 { font-size: clamp(30px, 4.6vw, 48px); }
  .final p { color: var(--muted); margin: 14px auto 28px; max-width: 520px; }

  /* ---------- Récompenses ---------- */
  .rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .reward { padding: 26px; display: grid; gap: 16px; align-content: start; transition: transform .3s, border-color .3s; }
  .reward:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .reward .pic { aspect-ratio: 16 / 9; border-radius: var(--r-sm); overflow: hidden; }
  .reward .pic img { width: 100%; height: 100%; object-fit: cover; }
  .reward h3 { font-size: 23px; }
  .reward p { color: var(--muted); margin: -6px 0 0; font-size: 15px; }
  .price { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 800; }
  .price .coin { width: 24px; height: 24px; }
  .bar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--text) 8%, transparent); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); width: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .bar-txt { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: -8px; font-weight: 600; }
  .wallet { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 20px 24px; margin-bottom: 14px; }

  /* ---------- Classement ---------- */
  .ranks { display: grid; gap: 10px; max-width: 860px; margin: 0 auto; }
  .rank { display: grid; grid-template-columns: 40px 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; transition: transform .25s, border-color .25s; }
  .rank:hover { transform: translateX(4px); }
  .rank .n { color: var(--muted); font-weight: 800; text-align: center; font-size: 18px; }
  .rank.top .n { color: var(--accent); }
  .rank .who b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .who small { color: var(--muted); font-size: 13px; }
  .rank .v { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; white-space: nowrap; }
  .rank .v .up { color: var(--green); }
  .rank.me { border-color: var(--accent); }
  .rank .pp { width: 44px; height: 44px; font-size: 17px; }

  /* ---------- Clipper ---------- */
  .panel { padding: 24px; }
  .panel h3 { font-size: 20px; margin-bottom: 8px; }
  .panel p { color: var(--muted); margin: 0 0 16px; }
  .panel p:last-child { margin-bottom: 0; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { border: 1.5px solid var(--line); border-radius: 99px; padding: 6px 14px; font-size: 14px; font-weight: 700; }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: .92em; color: var(--accent); }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .clip { overflow: hidden; transition: transform .3s; }
  .clip:hover { transform: translateY(-4px); }
  .clip .th { aspect-ratio: 9 / 12; background: var(--bg); position: relative; }
  .clip .th img { width: 100%; height: 100%; object-fit: cover; }
  .clip .pf { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--bg) 80%, transparent); border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .clip .gain { position: absolute; right: 10px; bottom: 10px; background: var(--green); color: #04130A; border-radius: 99px; padding: 4px 11px; font-size: 13px; font-weight: 800; }
  .clip .meta { padding: 12px 14px; display: grid; gap: 2px; }
  .clip .meta b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .meta small { color: var(--muted); font-size: 13px; }

  /* ---------- Profil ---------- */
  .profile { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 880px) { .profile { grid-template-columns: 1fr; } }
  .id { padding: 30px 26px; text-align: center; display: grid; justify-items: center; gap: 6px; }
  .id .pp { width: 96px; height: 96px; font-size: 36px; margin-bottom: 10px; border: 3px solid var(--accent); }
  .id h3 { font-size: 24px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .id .lvl { color: var(--muted); font-weight: 600; }
  .id .bar { width: 100%; margin-top: 16px; }
  .id .bar-txt { width: 100%; margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { padding: 20px; min-width: 0; }
  .stat small { color: var(--muted); font-size: 14px; font-weight: 600; }
  .stat .v { font-size: clamp(24px, 2.8vw, 32px); font-weight: 800; margin-top: 4px; overflow-wrap: anywhere; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr 1fr; } }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .badge { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px 10px; text-align: center; font-size: 13px; font-weight: 700; }
  .badge .e { font-size: 26px; line-height: 1.3; }
  .badge.off { opacity: .32; }
  .badge.off .e { filter: grayscale(1); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  input[type=email], input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 13px 15px; outline: none; font-size: 15px; font-weight: 500; transition: border-color .2s; }
  input:focus { border-color: var(--accent); }
  .list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
  .list-row:first-of-type { border-top: 0; }
  .st { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; white-space: nowrap; font-weight: 700; }
  .st.delivered { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, var(--line)); }
  .switch { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 700; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch span { width: 46px; height: 27px; border-radius: 99px; background: var(--line); position: relative; transition: background .25s; flex: none; }
  .switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: var(--muted); transition: transform .25s, background .25s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(19px); background: var(--accent-ink); }
  .switch input:focus-visible + span { outline: 2px solid var(--text); outline-offset: 2px; }

  /* ---------- Divers ---------- */
  .empty { padding: 36px 22px; text-align: center; color: var(--muted); font-weight: 500; }
  .login { padding: 40px 24px; display: grid; justify-items: center; gap: 12px; text-align: center; }
  .login h3 { font-size: 26px; }
  .login p { color: var(--muted); margin: 0 0 8px; max-width: 440px; }
  footer { max-width: 1160px; margin: 0 auto; padding: 40px 20px 48px; color: var(--muted); font-size: 14px; display: grid; justify-items: center; gap: 12px; text-align: center; border-top: 1px solid var(--line); }
  footer .logo { font-size: 20px; color: var(--text); }
  .modal-bg { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.65); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; animation: fadeIn .2s; }
  .modal { width: min(460px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px; display: grid; gap: 14px; animation: pop .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(10px); } }
  .modal h3 { font-size: 23px; }
  .modal p { color: var(--muted); margin: 0; }
  .modal form { display: grid; gap: 10px; }
  .modal .actions { display: grid; gap: 8px; margin-top: 4px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 90; background: var(--card); border: 1px solid var(--line); color: var(--text); padding: 13px 20px; border-radius: var(--r-sm); max-width: calc(100% - 32px); text-align: center; font-weight: 700; animation: pop .3s ease; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
  .toast.ok { border-color: color-mix(in srgb, var(--green) 50%, var(--line)); }
  .toast.err { border-color: #7a2e2e; }
  .tabbar { display: none; }
  @media (max-width: 880px) {
    .menu { display: none; }
    .top-in { justify-content: space-between; }
    .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
    .tabbar a { display: grid; justify-items: center; gap: 3px; padding: 6px 2px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .tabbar a svg { width: 22px; height: 22px; }
    .tabbar a.on { color: var(--accent); }
    body { padding-bottom: 76px; }
    .toast { bottom: 92px; }
    section { margin: 72px 0; }
  }
  @media (max-width: 600px) { .ctas { display: grid; } .ctas .btn { width: 100%; } }
  @media (max-width: 480px) { main { padding: 8px 16px 56px; } .top-in { padding: 12px 16px; } .rewards { grid-template-columns: 1fr; } .logo { font-size: 19px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .js .rv:not(.in) { opacity: 1; transform: none; filter: none; } }

  /* ---------- Thème « pop » : multicolore, énergique, tout en douceur (dégradés accent → accent2 → accent3) ---------- */
  body.pop { --grad: linear-gradient(100deg, var(--accent), var(--accent2) 50%, var(--accent3)); --grad-loop: linear-gradient(100deg, var(--accent), var(--accent2), var(--accent3), var(--accent2), var(--accent)); --r: 22px; --r-sm: 16px; --r-lg: 30px; }
  body.pop::before { content: ''; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none; opacity: .55; filter: blur(70px);
    background: radial-gradient(28vmax 28vmax at 18% 22%, color-mix(in srgb, var(--accent) 60%, transparent), transparent 70%),
                radial-gradient(26vmax 26vmax at 82% 18%, color-mix(in srgb, var(--accent3) 55%, transparent), transparent 70%),
                radial-gradient(30vmax 30vmax at 60% 85%, color-mix(in srgb, var(--accent2) 45%, transparent), transparent 70%);
    animation: popdrift 18s ease-in-out infinite alternate; }
  @keyframes popdrift { 0% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(3vmax, -2vmax) rotate(8deg); } 100% { transform: translate(-2vmax, 2vmax) rotate(-6deg); } }
  @keyframes popshine { to { background-position: 200% center; } }
  body.pop .y { background: var(--grad-loop); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: popshine 5s linear infinite; }
  body.pop .btn { border-radius: 99px; transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s, border-color .2s, background .2s; }
  body.pop .btn:hover { transform: translateY(-3px) scale(1.03); }
  body.pop .btn:active { transform: translateY(1px) scale(.98); }
  body.pop .btn.primary { background: var(--grad-loop); background-size: 200% auto; border: 0; color: #140B33; font-weight: 800; box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 45%, transparent); animation: popshine 6s linear infinite; }
  body.pop .card { border-color: color-mix(in srgb, var(--accent3) 18%, var(--line)); transition: transform .3s cubic-bezier(.34,1.56,.64,1), border-color .3s, box-shadow .3s; }
  body.pop .card:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 16px 40px color-mix(in srgb, var(--accent) 18%, transparent); }
  body.pop .pill { border-color: color-mix(in srgb, var(--accent2) 40%, var(--line)); }
  body.pop .coin { color: var(--accent2); }
  body.pop .menu a.on::after { background: var(--grad); height: 3px; }
  body.pop .logo .pp { border: 0; padding: 2px; background: var(--grad); }
  body.pop .stage .photo { padding: 5px; background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent3), var(--accent)); box-shadow: 0 30px 90px color-mix(in srgb, var(--accent) 40%, transparent); }
  body.pop .stage .photo img { border-radius: calc(var(--r-lg) - 5px); transform: none; }
  body.pop .chip.g { background: var(--accent2); color: #1A1200; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent2) 45%, transparent); }
  body.pop .chip.o { border-color: var(--accent3); color: var(--accent3); background: color-mix(in srgb, var(--bg) 85%, transparent); }
  body.pop ::selection { background: var(--accent3); color: #000; }
  @media (prefers-reduced-motion: reduce) { body.pop::before, body.pop .y, body.pop .btn.primary { animation: none; } }

  /* ---------- Bannière du créateur en haut de l'accueil ---------- */
  .hero-banner { position: relative; width: 100vw; margin-left: calc(50% - 50vw); height: clamp(120px, 22vw, 260px); overflow: hidden; }
  .hero-banner img { width: 100%; height: 100%; object-fit: cover; animation: bannerzoom 24s ease-in-out infinite alternate; }
  .hero-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, var(--bg)); }
  @keyframes bannerzoom { from { transform: scale(1.02); } to { transform: scale(1.1) translateX(-1.5%); } }

  /* ---------- Variante « sticker » : contours noirs épais, ombres dures (style meme / autocollant) ---------- */
  body.sticker { --stk: #07030F; }
  body.sticker .hero-banner { border-bottom: 4px solid var(--stk); }
  body.sticker .hero-banner::after { background: linear-gradient(180deg, transparent 60%, color-mix(in srgb, var(--bg) 70%, transparent)); }
  body.sticker .hero { margin-top: 36px; }
  body.sticker h1 { text-shadow: 4px 4px 0 var(--stk); }
  body.sticker h2 { text-shadow: 3px 3px 0 var(--stk); }
  body.sticker .y { text-shadow: none; filter: drop-shadow(4px 4px 0 var(--stk)); }
  body.sticker .card { border: 3px solid var(--stk); box-shadow: 6px 6px 0 var(--stk); }
  body.sticker .card:hover { border-color: var(--stk); transform: translate(-2px, -3px) rotate(-.4deg); box-shadow: 9px 10px 0 var(--stk); }
  body.sticker .btn { border: 3px solid var(--stk); box-shadow: 4px 4px 0 var(--stk); }
  body.sticker .btn:hover { transform: translate(-2px, -2px) rotate(-1deg); box-shadow: 7px 7px 0 var(--stk); }
  body.sticker .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--stk); }
  body.sticker .btn.primary { border: 3px solid var(--stk); box-shadow: 5px 5px 0 var(--stk); }

function avatar(name, url) {
  if (url) return `<span class="pp"><img src="${esc(url)}" alt="" loading="lazy"></span>`;
  return `<span class="pp">${esc(String(name).trim().charAt(0).toUpperCase() || '?')}</span>`;

// ---------- Données ----------
async function api(path, opts = {}) {
  // Maquette prospect : données d'exemple, personne de connecté
  if (window.__DEMO__) { if (path === '/api/fan/public') return window.__DEMO__; throw Object.assign(new Error('Maquette : connexion désactivée'), { status: 401 }); }
  const res = await fetch(path, { method: opts.method ?? 'GET', headers: opts.body ? { 'content-type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error ?? `Erreur ${res.status}`), { status: res.status });
  return data;
}
async function loadMe() { try { ME = await api('/api/fan/me'); } catch { ME = null; } }

// « Connecter mon TikTok / Instagram » (API officielles gratuites) : prouve que le compte est au fan et compte ses vues
const OFFICIAL_HELP = { instagram: 'Ton Insta doit être en <b>compte créateur</b> (Paramètres → Type de compte → Passer à un compte professionnel → Créateur, gratuit).' };
const tiktokBlock = () => (ME?.officialLogin ?? []).map((p) => {
  const name = p === 'tiktok' ? 'TikTok' : 'Instagram';
  const acc = ME.accounts.find((a) => a.platform === p && a.connected);
  return acc
    ? `<p style="margin-top:12px">✅ <b>${name} connecté</b> (@${esc(acc.handle)}) : tes vues ${name} sont comptées automatiquement. <a href="/fan/${p}/connect" style="color:inherit;opacity:.75">Reconnecter</a></p>`
    : `<p style="margin-top:12px"><b>📱 Connecte ton ${name}</b> (1 clic, on ne publie rien) : ça prouve qu'il est à toi et c'est ce qui compte tes vues ${name}.${OFFICIAL_HELP[p] ? `<br><small>${OFFICIAL_HELP[p]}</small>` : ''}</p><a class="btn primary" href="/fan/${p}/connect">Connecter mon ${name}</a>`;
}).join('');
function toast(msg, kind = '') {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 3600);
}
function modal(html, onMount) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
  onMount?.(bg, close);
  $('input', bg)?.focus();
  return close;
}
const bar = (pct) => `<div class="bar"><i data-w="${Math.max(2, Math.min(100, pct))}"></i></div>`;
const loginCard = (title, text) => `<div class="card login rv"><h3>${hl(title)}</h3><p>${esc(text)}</p><a class="btn primary big" href="#/">Se connecter avec Discord ${ARROW}</a></div>`;

// Apparitions au scroll + remplissage des barres
const io = new IntersectionObserver((es) => es.forEach((e) => {
  if (!e.isIntersecting) return;
  e.target.classList.add('in');
  e.target.querySelectorAll('[data-w]').forEach((el) => (el.style.width = el.dataset.w + '%'));
  io.unobserve(e.target);
}), { threshold: .12 });
function observe(root) {
  root.querySelectorAll('.rv').forEach((el, i) => { el.style.transitionDelay = `${Math.min(i % 4, 3) * 80}ms`; io.observe(el); });
  // Barres hors .rv
  requestAnimationFrame(() => root.querySelectorAll('[data-w]').forEach((el) => { if (!el.closest('.rv')) el.style.width = el.dataset.w + '%'; }));
}

// ---------- Cadre ----------
const ROUTES = [['', 'Accueil'], ['recompenses', 'Récompenses'], ['clipper', 'Clipper'], ['classement', 'Classement'], ['profil', 'Profil']];
const logoHtml = () => `${creatorPic('pp')}<span>${esc(C.logoText || C.creatorName)}</span>`;
function renderChrome(route) {
  $('#logo').innerHTML = logoHtml();
  $('#menu').innerHTML = ROUTES.slice(1).map(([r, l]) => `<a href="#/${r}" class="${r === route ? 'on' : ''}">${l}</a>`).join('');
  $('#tabbar').innerHTML = ROUTES.map(([r, l]) => `<a href="#/${r}" class="${r === route ? 'on' : ''}">${icon(r)}${l}</a>`).join('');
  $('#me-slot').innerHTML = ME
    ? `<a class="pill" href="#/profil" title="Ton solde">${COIN}<span>${fmt(ME.balance)}</span><small>coins</small></a>`
    : `<a class="btn" href="#/">Connexion</a>`;
}

// ---------- Récompenses ----------
function rewardCard(i) {
  const soldOut = i.stock !== null && i.stock <= 0;
  const r = C.reward && C.reward.ref === i.ref ? C.reward : null;
  let action;
  if (!ME) action = `<a class="btn full" href="#/">Se connecter pour échanger</a>`;
  else if (soldOut) action = `<button class="btn full" disabled>Épuisé</button>`;
  else if (ME.balance >= i.price) action = `${bar(100)}<button class="btn primary full" data-buy="${i.id}">Échanger ${ARROW}</button>`;
  else action = `${bar((ME.balance / i.price) * 100)}<div class="bar-txt"><span>${fmt(ME.balance)} / ${fmt(i.price)} coins</span><span>encore ${fmt(i.price - ME.balance)}</span></div><button class="btn full" disabled>Échanger</button>`;
  return `<div class="card reward rv">
    ${i.imageUrl ? `<div class="pic"><img src="${esc(i.imageUrl)}" alt="" loading="lazy"></div>` : ''}
    <h3>${esc(i.name)}</h3>${i.description ? `<p>${esc(i.description)}</p>` : ''}
    ${r?.url ? `<a class="link" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.linkLabel)} ↗</a>` : ''}
    <div class="price">${COIN}${fmt(i.price)} coins</div>${action}</div>`;
}
const emptyShop = () => `<div class="card empty" style="grid-column:1/-1">Aucune récompense pour l'instant.</div>`;

function accountModal(after) {
  const ra = C.rewardAccount;
  modal(`<h3>${esc(ra.title)}</h3><p>${esc(ra.deliveryHint)}</p>
    <form><input type="${ra.kind === 'email' ? 'email' : 'text'}" name="v" placeholder="${esc(ra.placeholder)}" aria-label="${esc(ra.label)}" required autocomplete="${ra.kind === 'email' ? 'email' : 'off'}">
    <button class="btn primary full">Enregistrer ${ARROW}</button></form>`, (bg, close) => {
    $('form', bg).onsubmit = async (e) => {
      e.preventDefault();
      try { await saveAccount(new FormData(e.target).get('v')); close(); await loadMe(); after?.(); route(); }
      catch (err) { toast(err.message, 'err'); }
    };
  });
}
async function saveAccount(v) {
  const r = await api('/api/fan/account', { method: 'PUT', body: { value: v } });
  toast(`Enregistré : ${r.value}`, 'ok');
}
function bindBuy(root) {
  root.querySelectorAll('[data-buy]').forEach((b) => (b.onclick = () => {
    const item = ME.items.find((i) => i.id === Number(b.dataset.buy));
    if (!ME.rewardAccount?.value) return accountModal(() => b.click());
    modal(`<h3>${esc(item.name)}</h3><p>Échanger <b style="color:var(--text)">${fmt(item.price)} coins</b> contre cette récompense ?</p>
      <p>${esc(C.rewardAccount.deliveryHint)} <b style="color:var(--text)">${esc(ME.rewardAccount.value)}</b></p>
      <div class="actions"><button class="btn primary big" data-ok>Confirmer l'échange ${ARROW}</button><button class="btn" data-close>Annuler</button></div>`, (bg, close) => {
      $('[data-ok]', bg).onclick = async (e) => {
        e.target.disabled = true;
        try {
          await api('/api/fan/orders', { method: 'POST', body: { itemId: item.id } });
          close(); toast('Échange enregistré. Suis son statut dans ton profil.', 'ok');
          await refresh();
        } catch (err) { toast(err.message, 'err'); e.target.disabled = false; }
      };
    });
  }));
}

function ctaNoteMs() {
  const price = C.reward?.price;
  if (!ME || !price) return esc(C.ms.ctaNote);
  const left = Math.max(0, price - (ME.balance ?? 0));
  return left ? `Encore <b>${compact(Math.ceil(left * 1000 / PUB.pointsPer1000))} vues</b> pour ton prochain mois de ${esc(rewardShort())}` : `<b>Tu peux échanger ton mois de ${esc(rewardShort())} !</b>`;
}

function pageHome() {
  if (C.ms) return pageHomeMs();
  const lb = PUB.leaderboard.slice(0, 5);
  const rate = `+${fmt(PUB.pointsPer1000)} coins`;
  const stepIcons = ['scissors', 'send', 'chart', 'gift'];
  const tick = C.texts.ticker?.length ? C.texts.ticker.map((t) => `<span>${esc(t)}</span><i>⭐</i>`).join('') : '';
  return `${C.images?.banner ? `<div class="hero-banner" aria-hidden="true"><img src="" alt=""></div>` : ''}${tick ? `<div class="ticker" aria-hidden="true"><div>${tick}${tick}</div></div>` : ''}
  <section class="hero" style="margin-bottom:0">
    <div><h1 class="load">${hl(C.texts.heroTitle)}</h1><p class="load">${esc(C.texts.heroText)}</p>
      <div class="ctas load"><a class="btn big" href="#comment">Découvrir</a><a class="btn primary big" href="#/clipper">${esc(C.texts.heroCta)} ${ARROW}</a></div></div>
    <div class="stage" aria-hidden="true">${creatorPic('photo')}${(C.style === 'sticker' || C.style === 'ms') && C.images?.reward ? '<img class="stage-sticker" src="" alt="">' : ''}
      <span class="chip g c1">${rate}</span><span class="chip o c2">TikTok</span><span class="chip o c3">YouTube</span><span class="chip g c4">1 000 vues</span></div>
  </section>

  <section id="comment">
    <div class="head center rv"><h2>Comment ça <span class="y">marche</span></h2><p>${fmt(PUB.pointsPer1000)} coins pour 1 000 vues, tous comptes confondus. Les vues sont comptées toutes les 1 à 2 nuits.</p></div>
    <div class="tools">${C.texts.steps.map((s, k) => `<div class="card tool rv ${k === 0 ? 'hl' : ''}"><div class="ic">${icon(stepIcons[k] ?? 'chart')}</div><b>${esc(s.title)}</b><small>${esc(s.text)}</small></div>`).join('')}</div>
  </section>

  <section aria-hidden="true">
    <div class="cloud rv">
      <span class="chip o big" style="left:6%;top:6%">TikTok</span><span class="chip o" style="left:44%;top:0;animation-delay:-1s">Shorts</span>
      <span class="chip o" style="right:6%;top:12%;animation-delay:-2s">Reels</span><span class="chip o big" style="left:2%;bottom:14%;animation-delay:-3s">YouTube</span>
      <span class="chip o" style="left:40%;bottom:2%;animation-delay:-1.6s">Clips</span><span class="chip o big" style="right:4%;bottom:10%;animation-delay:-2.4s">Instagram</span>
      <span class="spark">Clippe ${esc(C.creatorName)}, gagne des coins</span>
    </div>
  </section>

  <section>
    <div class="head center rv"><h2>Top clippeurs de la <span class="y">semaine</span></h2></div>
    ${lb.length ? rankList(lb) : '<div class="card empty rv" style="max-width:860px;margin:0 auto">Pas encore de vues cette semaine. Le classement se remplit dès les premiers clips.</div>'}
  </section>

  ${C.texts.faq?.length ? `<section><div class="head center rv"><h2>Des <span class="y">questions</span> ?</h2></div>
    <div class="faq">${C.texts.faq.map((f) => `<details class="rv"><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}</div></section>` : ''}

  ${C.texts.finalTitle ? `<section><div class="card final rv"><h2>${hl(C.texts.finalTitle)}</h2><p>${esc(C.texts.finalText ?? '')}</p>
    <a class="btn primary big" href="${ME ? '#/clipper' : '#/'}">${ME ? 'Voir mes clips' : 'Se connecter avec Discord'} ${ARROW}</a></div></section>` : ''}`;
}

function pageShop() {
  const items = ME ? ME.items : PUB.items;
  return `<section style="margin-top:56px">
    <div class="head rv"><h2>Les <span class="y">${esc(C.texts.shopTitle)}</span></h2><p>${esc(C.texts.shopText)} ${fmt(PUB.pointsPer1000)} coins pour 1 000 vues.</p></div>
    ${ME ? `<div class="card wallet rv"><span class="muted" style="font-weight:600">Ton solde</span><span class="price">${COIN}${fmt(ME.balance)} coins</span></div>` : ''}
    <div class="rewards">${items.map(rewardCard).join('') || emptyShop()}</div>
    ${ME ? '' : `<div style="margin-top:14px">${loginCard('Connecte-toi pour **échanger**', 'Connecte-toi avec Discord pour voir ton solde et échanger tes coins.')}</div>`}
  </section>`;
}

function pageClip() {
  const head = `<div class="head rv"><h2>${esc(C.texts.clipTitle)} <span class="y">${esc(C.creatorName)}</span></h2><p>${esc(C.texts.clipText)}</p></div>`;
  const how = `<div class="card panel rv" style="margin-bottom:14px"><h3>Relier tes comptes</h3>
    <p>Sur le Discord, ouvre un ticket et fais <code>/inscription</code>. Renseigne tes comptes TikTok, YouTube et Instagram, et ton ${esc(C.rewardAccount.label.charAt(0).toLowerCase() + C.rewardAccount.label.slice(1))}. Seules les vues faites après l'inscription comptent.</p>
    ${PUB.discordInviteUrl ? `<a class="btn primary" href="${esc(PUB.discordInviteUrl)}" target="_blank" rel="noopener">Ouvrir le Discord ${ARROW}</a>` : ''}</div>`;
  if (!ME) return `<section style="margin-top:56px">${head}${how}${loginCard('Suis tes **clips**', 'Connecte-toi avec Discord pour voir tes clips, tes vues et tes coins.')}</section>`;
  return `<section style="margin-top:56px">${head}
    ${ME.accounts.length ? `<div class="card panel rv" style="margin-bottom:14px"><h3>Comptes suivis</h3><p>Tes vues sont mises à jour toutes les 1 à 2 nuits.</p><div class="tags">${ME.accounts.map((a) => `<span class="tag">${PLATFORM[a.platform]} · @${esc(a.handle)}</span>`).join('')}</div>${tiktokBlock()}</div>` : how}
    <div class="head rv" style="margin-top:48px"><h2>Mes <span class="y">clips</span></h2><p>${fmt(ME.clipCount)} clip(s) détecté(s).</p></div>
    <div class="clips">${ME.clips.map((c) => `<a class="card clip rv" ${c.url ? `href="${esc(c.url)}" target="_blank" rel="noopener"` : ''}>
      <div class="th">${c.thumbnail ? `<img src="${esc(c.thumbnail)}" alt="" loading="lazy">` : ''}<span class="pf">${PLATFORM[c.platform]}</span>${c.coins ? `<span class="gain">+${fmt(c.coins)} coins</span>` : ''}</div>
      <div class="meta"><b>${esc(c.title || 'Clip')}</b><small>${compact(c.views)} vues${c.counted ? '' : ' · ne rapporte pas'}</small></div></a>`).join('')
      || '<div class="card empty" style="grid-column:1/-1">Aucun clip détecté pour l\'instant. Ils apparaissent ici après la prochaine mise à jour des vues.</div>'}</div>
  </section>`;
}

function rankList(rows) {
  return `<div class="ranks">${rows.map((r) => `<div class="card rank rv ${r.rank <= 3 ? 'top' : ''} ${ME && r.name === ME.username ? 'me' : ''}"><span class="n">${r.rank}</span>${avatar(r.name, r.avatar)}
    <span class="who"><b>${esc(r.name)}</b><small>${compact(r.views)} vues</small></span><span class="v"><span class="up">▲</span>+${fmt(r.coins)} coins</span></div>`).join('')}</div>`;
}
function pageRanking() {
  const lb = PUB.leaderboard;
  return `<section style="margin-top:56px"><div class="head center rv"><h2>Le <span class="y">classement</span></h2><p>${esc(C.texts.rankingText)}${ME?.weekRank ? ` Tu es ${ME.weekRank}e.` : ''}</p></div>
    ${lb.length ? rankList(lb) : '<div class="card empty rv" style="max-width:860px;margin:0 auto">Pas encore de vues cette semaine. Poste ton premier clip pour apparaître ici.</div>'}</section>`;
}

function pageProfile() {
  if (!ME) return `<section style="margin-top:56px">${loginCard('Ton **profil**', 'Connecte-toi avec Discord pour voir tes coins, ton niveau et tes échanges.')}</section>`;
  const li = levelOf(ME.views), lvl = C.levels[li], next = C.levels[li + 1];
  const pct = next ? ((ME.views - lvl.min) / (next.min - lvl.min)) * 100 : 100;
  const platforms = new Set(ME.accounts.map((a) => a.platform)).size;
  const traded = ME.orders.filter((o) => o.status !== 'refunded').length;
  const ra = C.rewardAccount;
  const badges = [
    ['🎬', 'Premier clip', ME.clipCount >= 1], ['💯', '10 clips', ME.clipCount >= 10], ['📱', 'Multi-plateforme', platforms >= 2],
    ['👀', '10k vues', ME.views >= 1e4], ['🚀', '100k vues', ME.views >= 1e5], ['💎', '1M vues', ME.views >= 1e6],
    ['🔗', ra.badge, !!ME.rewardAccount?.value], ['🛒', 'Premier échange', traded >= 1], ['🏆', 'Top 3 semaine', !!ME.weekRank && ME.weekRank <= 3],
  ];
  return `<section style="margin-top:56px"><div class="profile">
    <div class="card id rv">${avatar(ME.username, ME.avatar)}<h3>${esc(ME.username)}</h3><div class="lvl">${lvl.emoji} ${esc(lvl.name)}</div>
      ${bar(pct)}<div class="bar-txt">${next ? `<span>Prochain : ${esc(next.name)}</span><span>encore ${compact(next.min - ME.views)} vues</span>` : '<span>Niveau maximum atteint</span>'}</div></div>
    <div style="display:grid;gap:14px;min-width:0">
      <div class="stats">
        <div class="card stat rv"><small>Coins</small><div class="v y">${fmt(ME.balance)}</div></div>
        <div class="card stat rv"><small>Vues</small><div class="v">${compact(ME.views)}</div></div>
        <div class="card stat rv"><small>Clips</small><div class="v">${fmt(ME.clipCount)}</div></div>
        <div class="card stat rv"><small>Semaine</small><div class="v">${ME.weekRank ? ME.weekRank + 'e' : '—'}</div></div>
      </div>
      <div class="card panel rv"><h3>Badges</h3><p>${badges.filter((b) => b[2]).length} / ${badges.length} débloqués</p>
        <div class="badges">${badges.map(([e, n, on]) => `<div class="badge ${on ? '' : 'off'}"><div class="e">${e}</div>${esc(n)}</div>`).join('')}</div></div>
      <div class="card panel rv"><h3>${esc(ra.title)}</h3><p>${ME.rewardAccount?.value ? `Relié : <b style="color:var(--text)">${esc(ME.rewardAccount.value)}</b>. ${esc(ra.deliveryHint)}` : esc(ra.deliveryHint)}</p>
        <form class="row" id="account"><input type="${ra.kind === 'email' ? 'email' : 'text'}" name="v" placeholder="${esc(ra.placeholder)}" aria-label="${esc(ra.label)}" value="${esc(ME.rewardAccount?.value ?? '')}" required><button class="btn">${ME.rewardAccount?.value ? 'Modifier' : 'Enregistrer'}</button></form></div>
      <div class="card panel rv"><h3>Notifications Discord</h3><p>Un message privé quand tu gagnes des coins, passes un niveau ou peux échanger une récompense. Un par jour au maximum.</p>
        <label class="switch"><input type="checkbox" id="notify" ${ME.notify ? 'checked' : ''}><span></span><b>${ME.notify ? 'Activées' : 'Désactivées'}</b></label></div>
      <div class="card panel rv"><h3>Mes échanges</h3>${ME.orders.length ? ME.orders.map((o) => `<div class="list-row"><span style="font-weight:600">${esc(o.itemName)} <span class="muted">· ${fmt(o.price)} coins</span></span><span class="st ${o.status}">${o.status === 'pending' && o.approvedAt === null ? 'En validation par le staff' : esc(C.statuses[o.status] ?? o.status)}</span></div>`).join('') : '<p>Aucun échange pour l\'instant.</p>'}</div>
      <div><button class="btn" id="logout">Se déconnecter</button></div>
    </div></div></section>`;
}

/** Bandeaux d'avis : durée calée sur la largeur réelle pour garder une vitesse constante (px/s). */
function tickers(root) {
  root.querySelectorAll('.tp-row').forEach((ul) => {
    const set = () => { if (ul.scrollWidth) ul.style.animationDuration = `${ul.scrollWidth / 4 / Number(ul.dataset.speed)}s`; };
    set(); ul.querySelectorAll('img').forEach((i) => i.addEventListener('load', set));
  });
}

/** « Ma progression » (style ms) : barre vers le prochain mois de récompense (1 M de vues), stats et classement de la semaine. */
function pageProgress() {
  const price = C.reward?.price ?? 0, per = PUB.pointsPer1000;
  const goalViews = price * 1000 / per;
  const have = ME ? Math.min(ME.balance, price) : 0;
  const pct = price ? (have / price) * 100 : 0;
  const leftViews = Math.max(0, Math.ceil((price - have) * 1000 / per));
  const ticks = [0, .25, .5, .75, 1].map((t) => `<span style="left:${t * 100}%">${t ? compact(goalViews * t) : '0'}</span>`).join('');
  const won = ME ? ME.orders.filter((o) => o.status !== 'refunded').length : 0;
  return `<section class="prog" style="margin-top:40px">
    <h1 class="ol rv" style="text-align:center">${ME ? `Allez <span class="y">${esc(ME.username)}</span> !` : 'Ma <span class="y">progression</span>'}</h1>
    <div class="card goal rv">
      <div class="goal-top">${ME ? `<b>${compact(have * 1000 / per)} vues</b>` : ''}<span>objectif : <b>${compact(goalViews)} vues</b> = ${esc(C.reward?.name ?? 'ta récompense')}</span></div>
      <div class="goal-bar"><i data-w="${Math.max(ME ? 2 : 0, pct)}"></i>${C.images?.reward ? '<img src="" alt="">' : ''}</div>
      <div class="goal-ticks">${ticks}</div>
      <p class="goal-txt">${!ME ? 'Connecte-toi pour voir ta barre (on reconnaît ton compte Discord, rien d’autre).' : leftViews ? `Encore <b>${compact(leftViews)} vues</b> et ton mois de ${esc(rewardShort())} est à toi 🔥` : `<b>Objectif atteint !</b> Échange ton mois de ${esc(rewardShort())} dans les récompenses 🎉`}</p>
      ${!ME ? `<a class="btn primary big" href="#/">Me connecter avec Discord ${ARROW}</a>` : leftViews ? '' : `<a class="btn primary big" href="#/recompenses">Échanger mon mois ${ARROW}</a>`}
    </div>
    ${ME ? `<div class="stats prog-stats">
      <div class="card stat rv"><small>Vues qui comptent</small><div class="v">${compact(ME.views)}</div></div>
      <div class="card stat rv"><small>Clips</small><div class="v">${fmt(ME.clipCount)}</div></div>
      <div class="card stat rv"><small>Classement semaine</small><div class="v">${ME.weekRank ? ME.weekRank + 'e' : '—'}</div></div>
      <div class="card stat rv"><small>Mois de ${esc(rewardShort())} gagnés</small><div class="v">${fmt(won)}</div></div>
    </div>` : ''}
    <h2 class="msh ol rv" style="margin-top:64px">Classement de la semaine</h2>
    ${PUB.leaderboard.length ? rankList(PUB.leaderboard) : '<div class="card empty rv" style="max-width:860px;margin:0 auto">Pas encore de vues cette semaine.</div>'}
  </section>`;
}

// ---------- Routeur ----------
async function refresh() { await loadMe(); route(); }
function route() {
  const r = location.hash.replace(/^#\/?/, '').split('/')[0];
  if (r === 'comment') return; // ancre de l'accueil
  const known = ROUTES.some(([k]) => k === r) || r === 'progression' ? r : '';
  renderChrome(known);
  const app = $('#app');
  app.innerHTML = `<div class="page">${{ '': pageHome, recompenses: pageShop, clipper: pageClip, classement: pageRanking, profil: pageProfile, progression: pageProgress }[known]()}</div>`;
  observe(app);
  tickers(app);
  bindBuy(app);
  const af = $('#account');
  if (af) af.onsubmit = async (e) => { e.preventDefault(); try { await saveAccount(new FormData(e.target).get('v')); await refresh(); } catch (err) { toast(err.message, 'err'); } };
  $('#notify')?.addEventListener('change', async (e) => {
    try { await api('/api/fan/notify', { method: 'PUT', body: { on: e.target.checked } }); ME.notify = e.target.checked; e.target.nextElementSibling.nextElementSibling.textContent = e.target.checked ? 'Activées' : 'Désactivées'; }
    catch (err) { toast(err.message, 'err'); e.target.checked = !e.target.checked; }
  });
  $('#logout')?.addEventListener('click', async () => { await api('/fan/logout', { method: 'POST' }).catch(() => {}); ME = null; location.hash = '#/'; route(); });
  // « Découvrir » : défilement vers la section sans changer de page
  app.querySelectorAll('a[href="#comment"]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); $('#comment')?.scrollIntoView({ behavior: 'smooth' }); }));
}

/** Retour du fan : coins gagnés depuis la dernière visite, passage de niveau. */
function welcomeBack() {
  if (!ME) return;
  const key = 'fan_' + C.id;
  const lastCoins = Number(store.get(key + '_earned') ?? NaN), lastLevel = Number(store.get(key + '_level') ?? NaN);
  const li = levelOf(ME.views);
  if (Number.isFinite(lastLevel) && li > lastLevel) toast(`Nouveau niveau : ${C.levels[li].name}`, 'ok');
  else if (Number.isFinite(lastCoins) && ME.earned > lastCoins) toast(`+${fmt(ME.earned - lastCoins)} coins depuis ta dernière visite`, 'ok');
  store.set(key + '_earned', String(ME.earned)); store.set(key + '_level', String(li));
}

async function init() {
  [PUB] = await Promise.all([api('/api/fan/public'), loadMe()]);
  C = PUB.creator;
  $('#footer').innerHTML = `<span class="logo">${logoHtml()}</span><span>© ${new Date().getFullYear()} ${esc(C.texts.footer)} · ${fmt(PUB.pointsPer1000)} coins pour 1 000 vues · vues mises à jour toutes les 1 à 2 nuits</span>`;
  if (!window.__hc) { window.__hc = true; addEventListener('hashchange', () => { if (location.hash === '#comment') return; route(); scrollTo({ top: 0 }); }); }
  route();
  const error = new URLSearchParams(location.search).get('error');
  if (error) { toast(error, 'err'); history.replaceState(null, '', location.pathname + location.hash); }
  const connected = new URLSearchParams(location.search).get('connected');
  if (connected) { toast(`${connected === 'tiktok' ? 'TikTok' : 'Instagram'} connecté ✅ Tes vues sont maintenant comptées.`, 'ok'); history.replaceState(null, '', location.pathname + location.hash); }
  welcomeBack();
}
init().catch((err) => { $('#app').innerHTML = `<div class="card empty" style="margin-top:40px">${esc(err.message)}</div>`; });
