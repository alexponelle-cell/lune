<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pluton Sales · Formation</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04020a; --bg2:#0d0620; --violet:#6a35f2; --violet2:#8b5cf6; --glow:#b89cff; --pink:#e0b3ff;
  --text:#efeaff; --muted:#9a8fbf; --line:rgba(139,92,246,.24); --card:rgba(24,12,56,.55);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 55% at 50% -8%,rgba(106,53,242,.38),transparent 70%),radial-gradient(ellipse 50% 40% at 95% 65%,rgba(139,92,246,.14),transparent 70%),radial-gradient(ellipse 45% 35% at 5% 85%,rgba(106,53,242,.12),transparent 70%),var(--bg)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hero,main{position:relative;z-index:1}

.hero{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px 40px}
h1{font-family:'Michroma','Sora',sans-serif;font-weight:400;font-size:clamp(1.9rem,7vw,4.4rem);letter-spacing:.14em;line-height:1.15;margin:0 0 18px;
  background:linear-gradient(180deg,#fff 10%,var(--glow) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(139,92,246,.55))}
.sub{max-width:520px;margin:0;color:var(--muted);font-weight:300;font-size:1.05rem}

main{max-width:1080px;margin:0 auto;padding:16px 20px 96px}
.progress{display:flex;align-items:center;gap:16px;margin-bottom:36px}
.progress .bar{flex:1;height:6px;border-radius:99px;background:rgba(139,92,246,.16);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--glow));border-radius:99px;transition:width .5s ease}
.progress span{color:var(--muted);font-size:.9rem;white-space:nowrap}
.cat{margin:0 0 40px}
.cat h2{margin:0 0 16px;font-size:1.35rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:block;border:1px solid var(--line);border-radius:18px;background:var(--card);backdrop-filter:blur(6px);overflow:hidden;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--violet2);transform:translateY(-3px)}
.card:focus-visible,.btn:focus-visible,.close:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,rgba(184,156,255,.4),transparent 45%),linear-gradient(135deg,#1c0b4d,#07031a);font-family:'Michroma',sans-serif;font-size:2rem;letter-spacing:.1em;color:var(--glow)}
.card.done .thumb{background:radial-gradient(circle at 70% 20%,rgba(184,156,255,.6),transparent 45%),linear-gradient(135deg,#3a1a9a,#10062e)}
.body{padding:16px 18px 20px}
.body h3{margin:0 0 6px;font-size:1.05rem;font-weight:600}
.body p{margin:0;color:var(--muted);font-size:.9rem}
.tag{display:inline-block;margin-top:10px;font-size:.8rem;color:var(--glow)}

.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,2,10,.88);backdrop-filter:blur(8px)}
.modal.open{display:flex}
.panel{width:min(860px,100%);max-height:100%;overflow:auto;border:1px solid var(--line);border-radius:20px;background:var(--bg2);padding:24px;box-shadow:0 0 80px rgba(106,53,242,.3)}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.panel h2{margin:0;font-size:1.2rem;font-weight:600}
.close{all:unset;cursor:pointer;padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.9rem}
.close:hover{color:var(--text);border-color:var(--violet2)}
.player{aspect-ratio:16/9;width:100%;border-radius:12px;overflow:hidden;background:#000}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.btn{all:unset;cursor:pointer;margin-top:20px;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;font-weight:600;font-size:.95rem;transition:filter .2s}
.btn:hover{filter:brightness(1.15)}
.btn.done{background:rgba(139,92,246,.18);color:var(--glow);border:1px solid var(--line)}

/* Contenu d'un module texte (script) */
.doc{max-width:68ch}
.doc h3{margin:28px 0 10px;font-family:'Michroma','Sora',sans-serif;font-weight:400;font-size:1rem;letter-spacing:.06em;color:var(--glow)}
.doc h3:first-child{margin-top:0}
.doc p{margin:0 0 10px}
.doc .line{padding-left:22px;position:relative}
.doc .line::before{content:"→";position:absolute;left:0;color:var(--violet2)}
.doc .note{border-left:2px solid var(--violet2);padding:2px 0 2px 14px;color:var(--muted);font-weight:300}
.doc mark{background:linear-gradient(transparent 55%,rgba(139,92,246,.55) 55%);color:var(--text);padding:0 2px}
.doc .kw{color:var(--pink);font-weight:600}
.doc .empty{color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center}
.doc h3.pitch{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);color:var(--pink)}
.doc .v{color:var(--glow)}
.doc .aside{color:var(--muted);font-weight:300}
[hidden]{display:none!important}
.gate{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
.gcard{width:min(420px,100%);text-align:center;border:1px solid var(--line);border-radius:22px;background:rgba(13,6,32,.62);backdrop-filter:blur(10px);padding:40px 28px;box-shadow:0 0 80px rgba(106,53,242,.25)}
.gcard h1{font-size:clamp(1.3rem,6vw,1.9rem);margin-bottom:12px}
.gcard .sub{font-size:.95rem;margin:0 auto 30px}
.glabel{display:block;text-align:left;margin-bottom:8px;color:var(--muted);font-size:.85rem}
.gcard input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(4,2,10,.7);color:var(--text);font:inherit;outline:none}
.gcard input:focus{border-color:var(--violet2);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.gcard .btn{display:block;box-sizing:border-box;width:100%;padding:14px 22px;text-align:center;margin-top:16px}
.err{min-height:1.4em;margin:12px 0 0;color:#ff9ab5;font-size:.9rem}
.logout{all:unset;cursor:pointer;position:absolute;top:16px;right:20px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.85rem}
.logout:hover{color:var(--text);border-color:var(--violet2)}
.logout:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card,.progress .bar i{transition:none}}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<section class="gate" id="gate">
  <div class="gcard">
    <h1>PLUTON SALES</h1>
    <p class="sub">La base de données pour vendre Neptune</p>
    <label class="glabel" for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="off" placeholder="Entre ton mot de passe">
    <button class="btn" id="enter">Accéder aux modules</button>
    <p class="err" id="err" role="alert"></p>
  </div>
</section>

<div id="app" hidden>
<section class="hero">
  <button class="logout" id="logout">Se déconnecter</button>
  <h1>PLUTON SALES</h1>
  <p class="sub">La base de données pour vendre Neptune</p>
</section>

<main>
  <div class="progress"><div class="bar"><i id="fill"></i></div><span id="count">0 / 0 modules</span></div>
  <div id="cats"></div>
</main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="panel">
    <header><h2 id="mTitle"></h2><button class="close" id="close">Fermer</button></header>
    <div id="mBody"></div>
    <button class="btn" id="seen"></button>
  </div>
</div>

<script>
/* ===== CONTENU =====
   Chiffré (AES-256-GCM, clé dérivée du mot de passe par PBKDF2-SHA256).
   Pour modifier : éditer content.mjs puis lancer  node build.mjs <mot de passe>  */
const PAYLOAD = /*PAYLOAD*/null;
let CATEGORIES = [];

/* ===== Fond étoilé ===== */
const cv = document.getElementById('stars'), cx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, S = [];
function initStars() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
  S = Array.from({ length: Math.round(W * H / 5200) }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .25,
    p: Math.random() * 6.28, s: Math.random() * .8 + .3,
    c: Math.random() < .28 ? '184,156,255' : '255,255,255'
  }));
}
function draw(t) {
  cx.clearRect(0, 0, W, H);
  for (const s of S) {
    const a = .3 + .7 * Math.abs(Math.sin(s.p + t * .0006 * s.s));
    cx.fillStyle = 'rgba(' + s.c + ',' + a + ')';
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
    if (!still) { s.y += s.r * .012; if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; } }
  }
  if (!still) requestAnimationFrame(draw);
}
initStars(); requestAnimationFrame(draw);
addEventListener('resize', () => { initStars(); if (still) draw(0); });

/* ===== Modules ===== */
const KEY = 'pluton-sales-vus';
let seen = [];
try { seen = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {} };
const $ = id => document.getElementById(id);
const all = () => CATEGORIES.flatMap(c => c.modules);
let current = null;

function render() {
  const root = $('cats'); root.innerHTML = '';
  CATEGORIES.forEach(c => {
    const sec = document.createElement('section'); sec.className = 'cat';
    sec.innerHTML = '<h2></h2><div class="grid"></div>';
    sec.querySelector('h2').textContent = c.name;
    const grid = sec.querySelector('.grid');
    c.modules.forEach(m => {
      const done = seen.includes(m.id);
      const b = document.createElement('button'); b.className = 'card' + (done ? ' done' : '');
      b.innerHTML = '<div class="thumb"></div><div class="body"><h3></h3><p></p><span class="tag"></span></div>';
      b.querySelector('.thumb').textContent = done ? '✓' : m.title;
      b.querySelector('h3').textContent = m.title;
      b.querySelector('p').textContent = m.desc || '';
      b.querySelector('.tag').textContent = done ? 'Terminé' : 'À faire';
      b.onclick = () => openModal(m);
      grid.appendChild(b);
    });
    root.appendChild(sec);
  });
  const n = all().filter(m => seen.includes(m.id)).length;
  $('count').textContent = n + ' / ' + all().length + ' modules';
  $('fill').style.width = (all().length ? n / all().length * 100 : 0) + '%';
}

function embed(url) {
  if (/\.(mp4|webm|mov)(\?|$)/i.test(url)) return '<video src="' + url + '" controls playsinline></video>';
  const u = url.replace('watch?v=', 'embed/').replace('youtu.be/', 'www.youtube.com/embed/').replace('vimeo.com/', 'player.vimeo.com/video/').replace('loom.com/share/', 'loom.com/embed/');
  return '<iframe src="' + u + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
}
function syncBtn() {
  const d = seen.includes(current.id), vid = !!current.url;
  $('seen').className = 'btn' + (d ? ' done' : '');
  $('seen').textContent = d ? '✓ Terminé' : (vid ? "✓ J'ai vu cette vidéo" : "✓ J'ai lu ce module");
}
function openModal(m) {
  current = m; $('mTitle').textContent = m.title;
  $('mBody').innerHTML = m.url ? '<div class="player">' + embed(m.url) + '</div>' : '<div class="doc">' + (m.html || '') + '</div>';
  syncBtn(); $('modal').classList.add('open'); $('close').focus();
}
function closeModal() { $('modal').classList.remove('open'); $('mBody').innerHTML = ''; }
$('close').onclick = closeModal;
$('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('seen').onclick = () => {
  const i = seen.indexOf(current.id); i < 0 ? seen.push(current.id) : seen.splice(i, 1);
  save(); syncBtn(); render();
};


/* ===== Accès par mot de passe ===== */
const AK = 'pluton-sales-cle';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const unb64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter }, base, 256);
}
async function decrypt(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function unlock(cats) { CATEGORIES = cats; render(); $('gate').hidden = true; $('app').hidden = false; scrollTo(0, 0); }
function lock() { try { localStorage.removeItem(AK); } catch (e) {} closeModal(); CATEGORIES = []; $('cats').innerHTML = ''; $('app').hidden = true; $('gate').hidden = false; $('pw').value = ''; $('pw').focus(); }
async function tryEnter() {
  const v = $('pw').value;
  if (!v.trim()) { $('err').textContent = 'Entre ton mot de passe.'; return; }
  if (!crypto.subtle) { $('err').textContent = 'Ce navigateur ne permet pas la vérification. Ouvre le lien dans un autre navigateur.'; return; }
  $('err').textContent = ''; $('enter').disabled = true;
  try {
    const raw = await deriveKey(v);
    let cats;
    try { cats = await decrypt(raw); } catch (e) { $('err').textContent = 'Mot de passe incorrect.'; $('pw').select(); return; }
    try { localStorage.setItem(AK, unb64(raw)); } catch (e) {}
    unlock(cats);
  } catch (e) { $('err').textContent = 'Ce navigateur ne permet pas la vérification. Ouvre le lien dans un autre navigateur.'; }
  finally { $('enter').disabled = false; }
}
$('enter').onclick = tryEnter;
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });
$('logout').onclick = lock;
(async () => {
  try { const k = localStorage.getItem(AK); if (k) unlock(await decrypt(b64(k))); }
  catch (e) { try { localStorage.removeItem(AK); } catch (_) {} }
})();
</script>
</body>
</html>
