<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P360 · Compta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#050505; --card:#0D0D0D; --card2:#121212; --line:#1F1F1F; --text:#F5F5F2; --muted:#8A8A84; --y:#FCCA09; --y2:#FFE15A; --accent:#FCCA09; --green:#FCCA09; --red:#FF5A4F; --orange:#FFB020; --blue:#E9E9E4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:500 15px/1.5 Sora, Inter, system-ui, sans-serif; min-height:100vh;
    background-image: radial-gradient(900px 420px at 85% -120px, rgba(252,202,9,.16), transparent 70%), radial-gradient(700px 380px at -10% 110%, rgba(252,202,9,.07), transparent 70%); background-attachment: fixed; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; opacity:.35; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 48px 48px; mask-image: linear-gradient(#000, transparent 70%); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 28px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(5,5,5,.78); backdrop-filter:blur(14px); z-index:5; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:17px; letter-spacing:-.01em; }
  .brand img { width:40px; height:40px; border-radius:50%; box-shadow:0 0 0 1px #2A2A2A, 0 0 24px rgba(252,202,9,.25); }
  .brand small { display:block; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0; }
  .demo { font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; border:1px solid rgba(252,202,9,.45); color:var(--y); padding:3px 10px; border-radius:99px; margin-left:4px; }
  select, input, button { font:inherit; }
  .sel { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:9px 12px; }
  nav { display:flex; gap:4px; margin:18px auto 0; padding:5px; overflow-x:auto; max-width:max-content; background:var(--card); border:1px solid var(--line); border-radius:16px; position:relative; z-index:1; }
  nav button { background:none; border:0; color:var(--muted); font-weight:600; padding:10px 16px; border-radius:12px; cursor:pointer; white-space:nowrap; transition:.2s; }
  nav button:hover { color:var(--text); }
  nav button.on { background:var(--y); color:#000; font-weight:700; box-shadow:0 6px 24px rgba(252,202,9,.25); }
  main { max-width:1180px; margin:0 auto; padding:24px 28px 70px; position:relative; z-index:1; }
  .grid { display:grid; gap:14px; }
  .kpis { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .card { background:linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--line); border-radius:20px; padding:20px; }
  .kpi small { color:var(--muted); font-weight:600; display:block; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; }
  .kpi b { font-size:30px; font-weight:800; letter-spacing:-.03em; display:block; margin:10px 0 2px; }
  .kpi span { font-size:12.5px; color:var(--muted); }
  .kpi.big { background:var(--y); border-color:var(--y); color:#000; box-shadow:0 18px 50px rgba(252,202,9,.22); }
  .kpi.big small, .kpi.big span { color:rgba(0,0,0,.65); }
  h2 { margin:0 0 4px; font-size:19px; letter-spacing:-.02em; } .sub { color:var(--muted); margin:0 0 16px; font-size:13.5px; }
  .two { grid-template-columns:1.6fr 1fr; } @media (max-width:860px){ .two { grid-template-columns:1fr; } }
  @media (max-width:560px){ .kpis { grid-template-columns:1fr 1fr; } .kpi.big { grid-column:1 / -1; } .kpi b { font-size:24px; } main { padding:18px 16px 60px; } header { padding:14px 16px; } nav { margin:14px 16px 0; max-width:none; } }
  table { width:100%; border-collapse:collapse; } th { text-align:left; color:var(--muted); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; padding:10px 12px; border-bottom:1px solid var(--line); }
  td { padding:12px; border-bottom:1px solid var(--line); vertical-align:middle; } tr:last-child td { border-bottom:0; } tbody tr { transition:.15s; } tbody tr:hover { background:rgba(255,255,255,.02); }
  .r { text-align:right; } .num { font-variant-numeric:tabular-nums; } .in { color:var(--y); } .out { color:var(--text); }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; border:1px solid transparent; }
  .c-client { background:rgba(252,202,9,.12); color:var(--y); border-color:rgba(252,202,9,.3); } .c-monteur { background:#1A1A1A; color:#F5F5F2; border-color:#2E2E2E; } .c-outil { background:#151515; color:#B9B9B2; border-color:#262626; } .c-tournage { background:#151515; color:#FFE9A3; border-color:#3A3218; } .c-check { background:rgba(255,90,79,.1); color:var(--red); border-color:rgba(255,90,79,.35); } .c-autre { background:#141414; color:var(--muted); border-color:#222; }
  .match { color:var(--muted); font-size:12.5px; display:block; margin-top:3px; }
  .btn { background:var(--y); color:#000; border:0; border-radius:12px; padding:10px 16px; font-weight:700; cursor:pointer; transition:.2s; }
  .btn:hover { background:var(--y2); transform:translateY(-1px); }
  .btn.ghost { background:transparent; border:1px solid #2C2C2C; color:var(--text); } .btn.ghost:hover { border-color:var(--y); color:var(--y); } .btn.sm { padding:7px 12px; font-size:13px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .bar { height:8px; border-radius:99px; background:#1E1E1E; overflow:hidden; } .bar i { display:block; height:100%; background:linear-gradient(90deg,#E5B400,var(--y2)); border-radius:99px; }
  .alert { display:flex; gap:10px; align-items:flex-start; padding:13px 16px; border-radius:14px; background:rgba(252,202,9,.07); border:1px solid rgba(252,202,9,.3); color:#FFE9A3; margin-bottom:16px; font-size:14px; }
  .ok { background:#0E0E0E; border-color:#262626; color:#D8D8D2; }
  .drop { display:block; border:1.5px dashed #2E2E2E; border-radius:18px; padding:30px; text-align:center; color:var(--muted); cursor:pointer; transition:.2s; }
  .drop:hover { border-color:var(--y); color:var(--text); background:rgba(252,202,9,.04); }
  .field { display:grid; gap:6px; margin:12px 0; } .field input { background:#080808; border:1px solid var(--line); color:var(--text); border-radius:12px; padding:11px 12px; }
  .lock { font-size:13px; color:var(--muted); }
  svg text { fill:var(--muted); font-size:11px; font-family:Sora, Inter, sans-serif; }
  .tag-status { font-size:12.5px; font-weight:700; } .paid { color:var(--y); } .late { color:var(--red); } .wait { color:var(--orange); }
  .hidden { display:none; }
  @media print { header, nav, .noprint { display:none !important; } body { background:#fff; color:#000; } body::before { display:none; } }
  #invoice { background:#fff; color:#111; border-radius:20px; padding:44px; max-width:760px; margin:0 auto; border-top:8px solid var(--y); }
  #invoice h1 { margin:0; font-size:30px; letter-spacing:-.02em; } #invoice table td, #invoice table th { border-color:#e5e5e5; color:#111; }
  #invoice .muted { color:#666; font-size:13px; }
  #invoice .logo { width:46px; height:46px; border-radius:50%; }
</style>
</head>

<script>
// Données d'exemple (démo) : 3 mois d'activité d'un Head of Content avec 3 clients et 4 monteurs
const CLIENTS = { 'Client Finance': 1500, 'Client Fitness': 1200, 'Client Immo': 2000 };
const MONTEURS = { Yanis: 25, Inès: 25, Tom: 30, Léa: 20 }; // € par vidéo
const RULES = [ // tri automatique : mot dans le libellé → catégorie
  { re: /client finance|finance/i, cat: 'client', who: 'Client Finance' },
  { re: /client fitness|fitness/i, cat: 'client', who: 'Client Fitness' },
  { re: /client immo|immo/i, cat: 'client', who: 'Client Immo' },
  ...Object.keys(MONTEURS).map((m) => ({ re: new RegExp(m.normalize('NFD').replace(/[̀-ͯ]/g, ''), 'i'), cat: 'monteur', who: m })),
  { re: /notion|slack|adobe|capcut|canva|google|frame/i, cat: 'outil' },
  { re: /studio|podcast|location|spot|uber|sncf/i, cat: 'tournage' },
];
const CAT = { client: ['Client', 'c-client'], monteur: ['Monteur', 'c-monteur'], outil: ['Outil', 'c-outil'], tournage: ['Tournage', 'c-tournage'], autre: ['Autre', 'c-autre'], check: ['À vérifier', 'c-check'] };
const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const fmt = (n) => n.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const MONTHS = ['2026-08', '2026-09', '2026-10'];
const mName = (m) => new Date(m + '-01').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

// Vidéos validées par monteur et par mois (viendraient du Notion / de l'outil de validation)
const VIDEOS = { '2026-08': { Yanis: 14, Inès: 12, Tom: 8, Léa: 6 }, '2026-09': { Yanis: 16, Inès: 13, Tom: 10, Léa: 9 }, '2026-10': { Yanis: 18, Inès: 15, Tom: 11, Léa: 10 } };

function seed() {
  const t = [];
  MONTHS.forEach((m, k) => {
    Object.entries(CLIENTS).forEach(([c, amt], i) => { if (!(m === '2026-10' && c === 'Client Immo')) t.push({ date: `${m}-0${3 + i}`, label: `VIR SEPA ${c.toUpperCase()} - FACT ${m.replace('-', '')}-${i + 1}`, amount: amt }); });
    Object.entries(VIDEOS[m]).forEach(([mo, n], i) => { if (!(m === '2026-10' && mo === 'Léa')) t.push({ date: `${m}-2${i}`, label: `VIR ${norm(mo).toUpperCase()} MONTAGE`, amount: -n * MONTEURS[mo] }); });
    t.push({ date: `${m}-01`, label: 'PRLV NOTION LABS', amount: -10 }, { date: `${m}-02`, label: 'PRLV ADOBE CREATIVE CLOUD', amount: -24 }, { date: `${m}-05`, label: 'PRLV SLACK TECHNOLOGIES', amount: -8 });
    t.push({ date: `${m}-1${k + 2}`, label: 'CB STUDIO PODCAST PARIS 11', amount: -45 * (2 + k) });
    if (m === '2026-10') t.push({ date: `${m}-17`, label: 'CB AMAZON MKTP', amount: -63 });
  });
  return t.map(classify);
}
function classify(t) {
  const r = RULES.find((x) => x.re.test(norm(t.label)));
  const cat = r ? r.cat : 'check';
  return { ...t, cat: (r && r.cat === 'client' && t.amount < 0) || (r && r.cat === 'monteur' && t.amount > 0) ? 'check' : cat, who: r?.who ?? null };
}
let TX = seed();
let month = '2026-10', tab = 'dash';

function stats(m) {
  const tx = TX.filter((t) => t.date.startsWith(m));
  const sum = (f) => tx.filter(f).reduce((a, t) => a + t.amount, 0);
  const ca = sum((t) => t.amount > 0 && t.cat === 'client');
  const mont = -sum((t) => t.cat === 'monteur');
  const other = -sum((t) => t.amount < 0 && t.cat !== 'monteur');
  const rate = +document.getElementById('statut').value;
  const urssaf = Math.round(ca * rate);
  return { tx, ca, mont, other, urssaf, rest: ca - mont - other - urssaf, check: tx.filter((t) => t.cat === 'check').length, rate };
}

function chart() {
  const data = MONTHS.map((m) => ({ m, ...stats(m) }));
  const max = Math.max(...data.map((d) => Math.max(d.ca, d.mont + d.other))) * 1.15;
  const W = 520, H = 200, bw = 34;
  return `<svg viewBox="0 0 ${W} ${H + 24}" width="100%">${data.map((d, i) => {
    const x = 50 + i * 160, h1 = (d.ca / max) * H, h2 = ((d.mont + d.other) / max) * H;
    return `<rect x="${x}" y="${H - h1}" width="${bw}" height="${h1}" rx="6" fill="#FCCA09"/><rect x="${x + bw + 8}" y="${H - h2}" width="${bw}" height="${h2}" rx="6" fill="#3A3A3A"/>
      <text x="${x + bw + 4}" y="${H + 18}" text-anchor="middle">${new Date(d.m + '-01').toLocaleDateString('fr-FR', { month: 'short' })}</text>`;
  }).join('')}</svg><div style="display:flex;gap:16px;font-size:13px;color:var(--muted)"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#FCCA09"></i> Encaissé</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#3A3A3A"></i> Payé (monteurs + dépenses)</span></div>`;
}

function pageDash() {
  const s = stats(month);
  const due = Object.entries(VIDEOS[month]).map(([mo, n]) => { const owed = n * MONTEURS[mo], paid = 0 - s.tx.filter((t) => t.who === mo).reduce((a, t) => a + t.amount, 0) + 0; return { mo, owed, paid }; });
  const unpaidM = due.filter((d) => d.paid < d.owed);
  const lateClients = Object.keys(CLIENTS).filter((c) => !s.tx.some((t) => t.who === c && t.amount > 0));
  return `${s.check ? `<div class="alert">⚠️ <div><b>${s.check} mouvement${s.check > 1 ? 's' : ''} à vérifier</b> : je n'ai pas reconnu le libellé. Un clic pour le ranger, et je m'en souviendrai. <a href="#" data-go="moves" style="color:inherit">Voir</a></div></div>` : `<div class="alert ok">✅ Tous les mouvements de ${mName(month)} sont rangés.</div>`}
  <div class="grid kpis">
    <div class="card kpi"><small>Encaissé</small><b class="in">${fmt(s.ca)}</b><span>factures clients payées</span></div>
    <div class="card kpi"><small>Monteurs</small><b>${fmt(s.mont)}</b><span>${Object.values(VIDEOS[month]).reduce((a, b) => a + b, 0)} vidéos validées</span></div>
    <div class="card kpi"><small>Autres dépenses</small><b>${fmt(s.other)}</b><span>outils, tournages…</span></div>
    <div class="card kpi"><small>URSSAF (estimation)</small><b>${s.rate ? fmt(s.urssaf) : '—'}</b><span>${s.rate ? `${(s.rate * 100).toFixed(1).replace('.', ',')} % du CA · à mettre de côté` : 'calcul par ton comptable'}</span></div>
    <div class="card kpi big"><small>Reste pour toi</small><b>${fmt(s.rate ? s.rest : s.ca - s.mont - s.other)}</b><span>${mName(month)}</span></div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>3 derniers mois</h2><p class="sub">Calculé tout seul depuis ta banque.</p>${chart()}</div>
    <div class="card"><h2>À faire</h2><p class="sub">Ce qui demande ton attention.</p>
      ${lateClients.map((c) => `<div class="row"><span>🧾 <b>${c}</b> n'a pas payé ${fmt(CLIENTS[c])}</span><button class="btn sm ghost" data-remind="${c}">Relancer</button></div>`).join('')}
      ${unpaidM.map((d) => `<div class="row"><span>🎬 <b>${d.mo}</b> : reste ${fmt(d.owed - d.paid)} à payer</span><button class="btn sm ghost" data-go="monteurs">Voir</button></div>`).join('')}
      ${s.rate ? `<div class="row"><span>🏛️ Déclaration URSSAF : <b>${fmt(s.ca)}</b> de CA à déclarer</span></div>` : ''}
      ${!lateClients.length && !unpaidM.length ? '<p class="sub">Rien en attente 🎉</p>' : ''}
    </div>
  </div>`;
}

function pageMoves() {
  const s = stats(month);
  const opts = (cur) => Object.entries(CAT).map(([k, [l]]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${l}</option>`).join('');
  return `<div class="row"><div><h2>Mouvements de ${mName(month)}</h2><p class="sub" style="margin:0">Rangés automatiquement. Tu peux corriger : l'outil apprend.</p></div><button class="btn ghost" id="export">⬇️ Export pour le comptable</button></div>
  <div class="card" style="padding:6px 8px;overflow-x:auto"><table><thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th class="r">Montant</th></tr></thead><tbody>
  ${s.tx.sort((a, b) => b.date.localeCompare(a.date)).map((t) => `<tr><td class="num" style="color:var(--muted)">${t.date.slice(8)}/${t.date.slice(5, 7)}</td>
    <td>${t.label}${t.who ? `<span class="match">→ ${t.cat === 'client' ? 'facture de' : t.cat === 'monteur' ? 'paiement de' : ''} ${t.who}</span>` : ''}</td>
    <td><span class="chip ${CAT[t.cat][1]}">${CAT[t.cat][0]}</span> <select class="sel noprint" data-cat="${TX.indexOf(t)}" style="padding:3px 6px;font-size:12px">${opts(t.cat)}</select></td>
    <td class="r num ${t.amount > 0 ? 'in' : 'out'}">${t.amount > 0 ? '+' : ''}${fmt(t.amount)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function pageMonteurs() {
  const s = stats(month);
  return `<h2>Monteurs · ${mName(month)}</h2><p class="sub">Vidéos validées (depuis ton process) × ton tarif = ce que tu leur dois. Les virements sont retrouvés tout seuls.</p>
  <div class="grid kpis">${Object.entries(VIDEOS[month]).map(([mo, n]) => {
    const owed = n * MONTEURS[mo], paid = 0 - s.tx.filter((t) => t.who === mo).reduce((a, t) => a + t.amount, 0) + 0, left = owed - paid;
    return `<div class="card"><div class="row" style="margin-bottom:8px"><b style="font-size:17px">🎬 ${mo}</b><span class="tag-status ${left > 0 ? 'wait' : 'paid'}">${left > 0 ? 'À payer' : 'Payé ✓'}</span></div>
      <div class="sub" style="margin-bottom:8px">${n} vidéos × ${MONTEURS[mo]} € = <b style="color:var(--text)">${fmt(owed)}</b></div>
      <div class="bar"><i style="width:${Math.min(100, (paid / owed) * 100)}%"></i></div>
      <div class="row" style="margin:10px 0 0"><span class="sub" style="margin:0">Payé ${fmt(paid)}</span>${left > 0 ? `<button class="btn sm" data-pay="${mo}" data-left="${left}">Préparer le virement</button>` : ''}</div></div>`;
  }).join('')}</div>`;
}

function pageFactures() {
  const s = stats(month);
  let i = 0;
  return `<div class="row"><div><h2>Factures clients · ${mName(month)}</h2><p class="sub" style="margin:0">Créées toutes seules chaque mois. Payées = retrouvées dans ta banque.</p></div></div>
  <div class="card" style="padding:6px 8px;overflow-x:auto"><table><thead><tr><th>N°</th><th>Client</th><th>Prestation</th><th>Statut</th><th class="r">Montant</th><th></th></tr></thead><tbody>
  ${Object.entries(CLIENTS).map(([c, amt]) => { i++; const paid = s.tx.some((t) => t.who === c && t.amount > 0); const num = `F-${month.replace('-', '')}-${i}`;
    return `<tr><td class="num">${num}</td><td><b>${c}</b></td><td style="color:var(--muted)">Head of Content · ${mName(month)}</td>
      <td><span class="tag-status ${paid ? 'paid' : 'late'}">${paid ? 'Payée ✓' : 'En attente'}</span></td><td class="r num">${fmt(amt)}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm ghost" data-inv="${c}|${num}|${amt}">Voir la facture</button>${paid ? '' : ` <button class="btn sm" data-remind="${c}">Relancer</button>`}</td></tr>`; }).join('')}
  </tbody></table></div>
  <div id="invwrap" class="hidden" style="margin-top:20px"></div>`;
}

function pageBank() {
  return `<h2>Connecter ta banque</h2><p class="sub">2 façons. Dans les 2 cas, personne ne peut toucher à ton argent.</p>
  <div class="grid two">
    <div class="card"><h2>📄 Déposer ton relevé</h2><p class="sub">Une fois par mois : dans ton appli bancaire, exporte tes opérations en CSV, puis dépose le fichier ici. 10 secondes.</p>
      <label class="drop" id="drop">⬆️ <b>Dépose ton fichier CSV</b><br><span style="font-size:13px">(essaie avec n'importe quel export de banque : ça marche déjà dans la démo)</span><input type="file" accept=".csv,text/csv" id="csv" hidden></label>
      <div id="csvres" class="sub" style="margin-top:10px"></div></div>
    <div class="card"><h2>🔑 Banque pro (Qonto…)</h2><p class="sub">Tout est automatique. Dans Qonto : Paramètres → Intégrations → <b>Clé API en lecture seule</b>, puis colle-la ici.</p>
      <div class="field"><span class="sub" style="margin:0">Identifiant</span><input placeholder="ton-entreprise-1234" disabled></div>
      <div class="field"><span class="sub" style="margin:0">Clé secrète (lecture seule)</span><input type="password" placeholder="••••••••••••" disabled></div>
      <button class="btn" disabled style="opacity:.6">Connecter (pas actif dans la démo)</button>
      <p class="lock">🔒 La clé est enregistrée chiffrée, directement dans l'outil. Personne ne la voit, et elle ne permet <b>que de lire</b> : aucun virement possible. Tu peux la supprimer quand tu veux depuis Qonto.</p></div>
  </div>`;
}

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/); const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const head = lines[0].split(sep).map((h) => norm(h.toLowerCase().replace(/"/g, '')));
  const idx = (re) => head.findIndex((h) => re.test(h));
  const iD = idx(/date/), iL = idx(/libel|label|description|intitul|operation/), iA = idx(/montant|amount|valeur/), iDeb = idx(/debit/), iCre = idx(/credit/);
  const num = (v) => parseFloat((v || '0').replace(/"/g, '').replace(/\s/g, '').replace(',', '.')) || 0;
  return lines.slice(1).map((l) => l.split(sep).map((c) => c.replace(/^"|"$/g, ''))).map((c) => {
    let d = c[iD] || ''; const m = d.match(/(\d{2})\/(\d{2})\/(\d{4})/); if (m) d = `${m[3]}-${m[2]}-${m[1]}`;
    const amount = iA >= 0 ? num(c[iA]) : num(c[iCre]) - Math.abs(num(c[iDeb]));
    return classify({ date: d.slice(0, 10), label: c[iL] || '(sans libellé)', amount });
  }).filter((t) => /^\d{4}-\d{2}-\d{2}$/.test(t.date));
}

function render() {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  document.getElementById('app').innerHTML = { dash: pageDash, moves: pageMoves, monteurs: pageMonteurs, factures: pageFactures, bank: pageBank }[tab]();
  const app = document.getElementById('app');
  app.querySelectorAll('[data-go]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); tab = a.dataset.go; render(); }));
  app.querySelectorAll('[data-cat]').forEach((s) => (s.onchange = () => { TX[+s.dataset.cat].cat = s.value; render(); }));
  app.querySelectorAll('[data-remind]').forEach((b) => (b.onclick = () => { b.textContent = 'Relance envoyée ✓'; b.disabled = true; }));
  app.querySelectorAll('[data-pay]').forEach((b) => (b.onclick = () => { navigator.clipboard?.writeText(`Virement ${b.dataset.pay} : ${b.dataset.left} € (montage ${mName(month)})`); b.textContent = 'Copié ✓ (à coller dans ta banque)'; }));
  app.querySelectorAll('[data-inv]').forEach((b) => (b.onclick = () => { const [c, n, a] = b.dataset.inv.split('|'); const w = document.getElementById('invwrap'); w.innerHTML = invoice(c, n, +a); w.classList.remove('hidden'); w.scrollIntoView({ behavior: 'smooth' }); }));
  const ex = document.getElementById('export');
  if (ex) ex.onclick = () => { const rows = [['Date', 'Libellé', 'Catégorie', 'Qui', 'Montant'], ...stats(month).tx.map((t) => [t.date, t.label, CAT[t.cat][0], t.who ?? '', String(t.amount).replace('.', ',')])]; const blob = new Blob(['﻿' + rows.map((r) => r.map((v) => `"${v}"`).join(';')).join('\n')], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `compta-${month}.csv`; a.click(); };
  const csv = document.getElementById('csv');
  if (csv) csv.onchange = async () => { const f = csv.files[0]; if (!f) return; try { const rows = parseCsv(await f.text()); if (!rows.length) throw new Error('Aucune opération reconnue'); TX = rows; const ms = [...new Set(rows.map((r) => r.date.slice(0, 7)))].sort(); month = ms.at(-1); fillMonths(ms); document.getElementById('csvres').innerHTML = `✅ <b>${rows.length} opérations</b> importées et rangées (${rows.filter((r) => r.cat === 'check').length} à vérifier). <a href="#" data-go2>Voir le tableau de bord</a>`; document.querySelector('[data-go2]').onclick = (e) => { e.preventDefault(); tab = 'dash'; render(); }; } catch (err) { document.getElementById('csvres').textContent = '❌ ' + err.message; } };
}
function fillMonths(ms) {
  const sel = document.getElementById('month');
  sel.innerHTML = ms.map((m) => `<option value="${m}" ${m === month ? 'selected' : ''}>${mName(m)}</option>`).join('');
  MONTHS.splice(0, MONTHS.length, ...ms.slice(-3));
  ms.forEach((m) => { VIDEOS[m] ??= {}; });
}
document.getElementById('tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) { tab = b.dataset.t; render(); } };
document.getElementById('month').onchange = (e) => { month = e.target.value; render(); };
document.getElementById('statut').onchange = render;
fillMonths(MONTHS.slice());
render();
</script>
