<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P360 Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F3F3F0; --card:#FFFFFF; --line:#EAEAE5; --line2:#F1F1EC; --text:#141414; --muted:#8C8C85; --soft:#F6F6F2;
    --y:#FCCA09; --y2:#FFE680; --ysoft:#FFF7D1; --ink:#111111; --ok:#2F9E63; --oksoft:#E6F5EC; --ko:#D9483B; --kosoft:#FCEBE9;
    --r:26px; --sh:0 1px 2px rgba(20,20,20,.04), 0 8px 24px rgba(20,20,20,.04);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--text); font:500 14.5px/1.5 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font:inherit; color:inherit; }
  .app { display:grid; grid-template-columns:84px 1fr; min-height:100vh; }

  /* Barre latérale */
  .side { position:sticky; top:0; z-index:25; height:100vh; display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px 0; }
  .side .logo { width:46px; height:46px; border-radius:50%; margin-bottom:18px; box-shadow:0 6px 18px rgba(0,0,0,.18); }
  .side nav { display:flex; flex-direction:column; gap:6px; background:var(--card); border-radius:30px; padding:8px; box-shadow:var(--sh); }
  .nb { position:relative; width:46px; height:46px; border-radius:50%; border:0; background:transparent; display:grid; place-items:center; cursor:pointer; color:#77776F; transition:.25s; }
  .nb:hover { background:var(--soft); color:var(--text); }
  .nb.on { background:var(--ink); color:#fff; }
  .nb svg { width:20px; height:20px; }
  .nb .tip { position:absolute; left:58px; white-space:nowrap; background:var(--ink); color:#fff; font-size:12px; font-weight:600; padding:5px 10px; border-radius:10px; opacity:0; pointer-events:none; transform:translateX(-4px); transition:.18s; z-index:30; }
  .nb:hover .tip { opacity:1; transform:none; }
  .nb .dot { position:absolute; top:9px; right:9px; width:8px; height:8px; border-radius:50%; background:var(--y); box-shadow:0 0 0 2px var(--card); }
  .side .bottom { margin-top:auto; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#2a2a2a,#555); color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px; }

  /* Haut */
  .main { padding:22px 30px 60px 10px; min-width:0; }
  .topbar { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
  .hello h1 { margin:0; font-size:26px; font-weight:800; letter-spacing:-.03em; }
  .hello p { margin:2px 0 0; color:var(--muted); font-size:13.5px; }
  .cpick { margin-left:auto; } .ask { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:99px; padding:6px 6px 6px 18px; width:min(440px,42vw); box-shadow:var(--sh); cursor:text; transition:.25s; }
  .ask:hover { box-shadow:0 0 0 4px rgba(252,202,9,.18), var(--sh); }
  .ask span { color:var(--muted); flex:1; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ask kbd { font:600 11px 'Plus Jakarta Sans'; color:var(--muted); background:var(--soft); border:1px solid var(--line); border-radius:7px; padding:2px 7px; }
  .orb { width:36px; height:36px; border-radius:50%; border:0; cursor:pointer; flex:none; background:radial-gradient(circle at 30% 30%, #FFF3B0, #FCCA09 45%, #E09B00 80%); box-shadow:0 0 0 0 rgba(252,202,9,.5); animation:pulse 2.6s infinite; display:grid; place-items:center; }
  .orb i { width:5px; height:8px; border-radius:3px; background:#111; margin:0 2px; display:inline-block; animation:blink 4s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(252,202,9,.45);} 70% { box-shadow:0 0 0 12px rgba(252,202,9,0);} 100% { box-shadow:0 0 0 0 rgba(252,202,9,0);} }
  @keyframes blink { 0%, 92%, 100% { transform:scaleY(1);} 95% { transform:scaleY(.15);} }
  .iconbtn { position:relative; width:44px; height:44px; border-radius:50%; background:var(--card); border:0; display:grid; place-items:center; box-shadow:var(--sh); cursor:pointer; }
  .iconbtn svg { width:19px; height:19px; } .iconbtn b { position:absolute; top:-2px; right:-2px; background:var(--ink); color:#fff; font-size:10.5px; min-width:18px; height:18px; border-radius:9px; display:grid; place-items:center; }
  .cpick { position:relative; } .cpbtn { display:flex; align-items:center; gap:10px; background:var(--card); border:0; border-radius:99px; padding:6px 14px 6px 6px; box-shadow:var(--sh); cursor:pointer; font-weight:700; font-size:13.5px; white-space:nowrap; transition:.2s; }
  .cpbtn:hover { box-shadow:0 0 0 4px rgba(20,20,20,.05), var(--sh); } .cpbtn .av { width:32px; height:32px; border:0; } .cpbtn svg { width:14px; height:14px; color:var(--muted); transition:.2s; }
  .cpick.open .cpbtn svg { transform:rotate(180deg); }
  .cpmenu { position:absolute; top:calc(100% + 8px); left:0; min-width:250px; background:var(--card); border-radius:20px; padding:8px; box-shadow:0 20px 50px rgba(0,0,0,.14); z-index:35; opacity:0; transform:translateY(-6px) scale(.98); pointer-events:none; transition:.2s; }
  .cpick.open .cpmenu { opacity:1; transform:none; pointer-events:auto; }
  .cpmenu button { width:100%; display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:9px 10px; border-radius:14px; cursor:pointer; text-align:left; font-weight:600; }
  .cpmenu button:hover { background:var(--soft); } .cpmenu button.on { background:var(--soft); } .cpmenu button .av { width:30px; height:30px; border:0; } .cpmenu small { display:block; color:var(--muted); font-weight:500; font-size:11.5px; } .cpmenu .ck2 { margin-left:auto; color:var(--text); }
  .demo { font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#8A6D00; background:var(--ysoft); padding:4px 10px; border-radius:99px; }

  /* Grille bento */
  .bento { display:grid; grid-template-columns:repeat(12, 1fr); gap:16px; }
  .card { background:var(--card); border-radius:var(--r); padding:22px; box-shadow:var(--sh); position:relative; overflow:hidden; transition:transform .3s, box-shadow .3s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 2px 4px rgba(20,20,20,.04), 0 18px 40px rgba(20,20,20,.07); }
  .card.dark { background:var(--ink); color:#fff; } .card.dark .muted { color:#9C9C95; }
  .card.yellow { background:var(--y); } .card.yellow .muted { color:rgba(0,0,0,.55); }
  .c3 { grid-column:span 3; } .c4 { grid-column:span 4; } .c5 { grid-column:span 5; } .c6 { grid-column:span 6; } .c7 { grid-column:span 7; } .c8 { grid-column:span 8; } .c12 { grid-column:span 12; }
  .ch { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .ch h3 { margin:0; font-size:15px; font-weight:700; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; }
  .ch .ic { width:34px; height:34px; border-radius:50%; background:var(--soft); display:grid; place-items:center; } .ch .ic svg { width:16px; height:16px; }
  .card.dark .ch .ic { background:#222; }
  .arrow { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:transparent; display:grid; place-items:center; cursor:pointer; transition:.2s; } .arrow:hover { background:var(--ink); color:#fff; border-color:var(--ink); }
  .card.dark .arrow { border-color:#333; color:#fff; } .arrow svg { width:15px; height:15px; }
  .muted { color:var(--muted); } .small { font-size:12.5px; }
  .big { font-size:38px; font-weight:800; letter-spacing:-.04em; line-height:1.05; }
  .mid { font-size:26px; font-weight:800; letter-spacing:-.03em; }
  .pill { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; }
  .pill.up { background:var(--oksoft); color:var(--ok); } .pill.down { background:var(--kosoft); color:var(--ko); } .pill.y { background:var(--ysoft); color:#8A6D00; } .pill.g { background:var(--soft); color:#5F5F58; }
  .card.dark .pill.g { background:#222; color:#bbb; }

  /* Boutons */
  .btn { border:0; border-radius:99px; padding:10px 18px; font-weight:700; cursor:pointer; background:var(--ink); color:#fff; transition:.2s; display:inline-flex; align-items:center; gap:8px; justify-content:center; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(0,0,0,.15); }
  .btn.y { background:var(--y); color:#111; } .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); } .btn.ghost:hover { border-color:var(--ink); }
  .btn.sm { padding:7px 13px; font-size:12.5px; } .btn.w { width:100%; }
  .card.dark .btn.ghost { border-color:#333; color:#fff; }
  .tabs { display:inline-flex; background:var(--card); padding:5px; border-radius:99px; gap:2px; box-shadow:var(--sh); flex-wrap:wrap; }
  .tabs button { border:0; background:transparent; padding:8px 15px; border-radius:99px; font-weight:600; font-size:13px; color:var(--muted); cursor:pointer; transition:.2s; }
  .tabs button.on { background:var(--ink); color:#fff; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .page-h { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .page-h h2 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.03em; } .page-h p { margin:3px 0 0; color:var(--muted); font-size:13.5px; }

  /* Listes */
  .li { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line2); }
  .li:last-child { border-bottom:0; } .li .grow { flex:1; min-width:0; } .li b { font-weight:700; } .li small { display:block; color:var(--muted); font-size:12px; margin-top:1px; }
  .card.dark .li { border-color:#222; }
  .thumb { width:44px; height:56px; border-radius:12px; flex:none; position:relative; overflow:hidden; display:grid; place-items:center; }
  .thumb::after { content:'▶'; font-size:11px; color:#111; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.9); display:grid; place-items:center; }
  .av { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; color:#111; flex:none; border:2px solid var(--card); }
  .avs { display:flex; } .avs .av { margin-left:-8px; } .avs .av:first-child { margin-left:0; }
  .card.dark .av { border-color:var(--ink); }
  .bar { height:7px; border-radius:99px; background:var(--soft); overflow:hidden; } .bar i { display:block; height:100%; border-radius:99px; background:var(--ink); width:0; transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
  .bar.yl i { background:var(--y); }
  .tbl { width:100%; border-collapse:collapse; } .tbl th { text-align:left; font-size:11.5px; font-weight:600; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); }
  .tbl td { padding:13px 12px; border-bottom:1px solid var(--line2); } .tbl tr:last-child td { border-bottom:0; } .tbl tbody tr { transition:.15s; } .tbl tbody tr:hover { background:#FAFAF7; }
  .r { text-align:right; } .num { font-variant-numeric:tabular-nums; }
  .tag { font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:99px; white-space:nowrap; display:inline-block; }
  .t-client { background:var(--ysoft); color:#8A6D00; } .t-monteur { background:#EEF0FF; color:#4B55C9; } .t-outil { background:var(--soft); color:#5F5F58; } .t-tournage { background:#FCEFF7; color:#B3438A; } .t-check { background:var(--kosoft); color:var(--ko); } .t-autre { background:var(--soft); color:var(--muted); }
  .sel { background:var(--card); border:1px solid var(--line); border-radius:99px; padding:7px 12px; font-size:13px; }

  /* Kanban */
  .kanban { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(232px,1fr); gap:14px; overflow-x:auto; padding:2px 2px 14px; }
  .col { background:#ECECE7; border-radius:22px; padding:12px; }
  .colh { display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px; margin:2px 4px 12px; } .colh i { width:8px; height:8px; border-radius:50%; } .colh span { margin-left:auto; color:var(--muted); font-weight:600; }
  .vc { background:var(--card); border-radius:18px; padding:10px; margin-bottom:10px; box-shadow:var(--sh); transition:.25s; } .vc:hover { transform:translateY(-2px); }
  .vc .vt { height:84px; border-radius:12px; position:relative; display:grid; place-items:center; } .vc .vt em { position:absolute; top:8px; left:8px; font-style:normal; font-size:10px; font-weight:800; background:rgba(255,255,255,.9); padding:2px 8px; border-radius:99px; }
  .vc .vt::after { content:'▶'; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.92); display:grid; place-items:center; font-size:11px; }
  .vc b { display:block; font-size:13.5px; line-height:1.3; margin:9px 2px 3px; } .vc small { display:block; color:var(--muted); font-size:12px; margin:0 2px; } .vc small.ko { color:var(--ko); } .vc small.ok { color:var(--ok); font-weight:700; }

  /* Espace client */
  .browser { background:var(--card); border-radius:28px; box-shadow:0 30px 80px rgba(20,20,20,.10); overflow:hidden; }
  .bbar { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line2); } .bbar i { width:11px; height:11px; border-radius:50%; background:#E5E5E0; } .bbar span { margin:0 auto; font-size:12px; color:var(--muted); background:var(--soft); padding:5px 16px; border-radius:99px; }
  .portal { padding:28px; } .vals { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin-top:18px; }
  .vplay { aspect-ratio:9/12; max-height:330px; width:100%; border-radius:20px; position:relative; display:grid; place-items:center; overflow:hidden; }
  .vplay::after { content:'▶'; width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,.92); display:grid; place-items:center; font-size:18px; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .vplay em { position:absolute; top:12px; left:12px; font-style:normal; font-size:11px; font-weight:800; background:rgba(255,255,255,.9); padding:3px 10px; border-radius:99px; }
  .vplay .dur { position:absolute; bottom:12px; right:12px; font-size:11px; font-weight:700; color:#fff; background:rgba(0,0,0,.45); padding:2px 8px; border-radius:99px; }
  textarea { width:100%; min-height:74px; border:1px solid var(--line); border-radius:16px; padding:12px; background:var(--soft); resize:vertical; margin:10px 0 8px; }
  .done { padding:70px 10px; text-align:center; } .done b { display:block; font-size:22px; } .done .ck { width:64px; height:64px; border-radius:50%; background:var(--y); display:grid; place-items:center; margin:0 auto 12px; font-size:28px; animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform:scale(.3); opacity:0; } }

  /* Graphiques */
  .chart path.line { fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.6s .2s cubic-bezier(.4,0,.2,1) forwards; }
  .chart path.area { opacity:0; animation:fade 1s .9s forwards; }
  .chart text { font-size:11px; fill:var(--muted); font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  @keyframes draw { to { stroke-dashoffset:0; } } @keyframes fade { to { opacity:1; } }
  .gauge .arc { transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1); }
  .bars { display:flex; align-items:flex-end; gap:8px; height:90px; } .bars div { flex:1; border-radius:10px 10px 6px 6px; background:#EDEDE8; height:0; transition:height 1s cubic-bezier(.2,.8,.2,1); position:relative; } .bars div.hi { background:var(--y); } .card.dark .bars div:not(.hi) { background:#2A2A2A; }
  .bars div span { position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:11px; color:var(--muted); }

  /* Assistant */
  .drawer { position:fixed; top:14px; right:14px; bottom:14px; width:min(420px, calc(100vw - 28px)); background:var(--card); border-radius:28px; box-shadow:0 30px 90px rgba(0,0,0,.18); z-index:50; display:flex; flex-direction:column; transform:translateX(calc(100% + 30px)); transition:transform .45s cubic-bezier(.2,.8,.2,1); }
  .drawer.open { transform:none; }
  .dh { display:flex; align-items:center; gap:12px; padding:18px 18px 14px; border-bottom:1px solid var(--line2); } .dh b { display:block; } .dh small { color:var(--muted); font-size:12px; }
  .dh .x { margin-left:auto; } .msgs { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .m { max-width:86%; padding:11px 14px; border-radius:18px; font-size:14px; line-height:1.5; animation:up .35s ease both; }
  .m.u { align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:6px; } .m.a { align-self:flex-start; background:var(--soft); border-bottom-left-radius:6px; }
  .m .res { background:var(--card); border-radius:14px; padding:12px; margin-top:10px; box-shadow:var(--sh); }
  .typing span { width:6px; height:6px; border-radius:50%; background:#aaa; display:inline-block; margin:0 2px; animation:bounce 1s infinite; } .typing span:nth-child(2) { animation-delay:.15s; } .typing span:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform:none; } 30% { transform:translateY(-5px); } }
  .sugg { display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 12px; } .sugg button { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer; } .sugg button:hover { border-color:var(--ink); }
  .din { display:flex; gap:8px; padding:12px 14px 16px; } .din input { flex:1; border:1px solid var(--line); border-radius:99px; padding:11px 16px; background:var(--soft); outline:none; } .din input:focus { border-color:var(--y); box-shadow:0 0 0 4px rgba(252,202,9,.18); }
  .veil { position:fixed; inset:0; background:rgba(20,20,20,.18); backdrop-filter:blur(2px); z-index:40; opacity:0; pointer-events:none; transition:.3s; } .veil.open { opacity:1; pointer-events:auto; }

  /* Divers */
  .drop { display:block; border:1.5px dashed #D9D9D2; border-radius:22px; padding:28px; text-align:center; cursor:pointer; transition:.2s; color:var(--muted); } .drop:hover { border-color:var(--ink); color:var(--text); background:var(--soft); }
  .field { display:grid; gap:6px; margin:12px 0; } .field input { border:1px solid var(--line); border-radius:14px; padding:11px 14px; background:var(--soft); }
  .tip2 { background:var(--ysoft); border-radius:16px; padding:12px 14px; font-size:13px; color:#5C4A00; margin-top:12px; }
  .spot { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line2); } .spot .ph { width:70px; height:70px; border-radius:16px; flex:none; }
  .conn { display:flex; align-items:center; gap:14px; } .conn .ci { width:50px; height:50px; border-radius:16px; background:var(--soft); display:grid; place-items:center; font-size:22px; flex:none; }
  .toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:99px; font-weight:600; font-size:13.5px; box-shadow:0 16px 40px rgba(0,0,0,.25); opacity:0; transition:.35s cubic-bezier(.2,.8,.2,1); z-index:60; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; }
  .toast.on { opacity:1; transform:translate(-50%, 0); } .toast b { color:var(--y); }
  .cal { display:grid; grid-template-columns:repeat(7, 1fr); gap:8px; }
  .cal .dh2 { font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding:0 6px; }
  .cal > * { min-width:0; } .day { background:var(--card); border-radius:18px; min-height:118px; padding:10px; box-shadow:var(--sh); display:flex; flex-direction:column; gap:5px; }
  .day.past { opacity:.55; } .day.today { box-shadow:0 0 0 2px var(--y), var(--sh); }
  .day .dn { font-weight:800; font-size:13px; display:flex; justify-content:space-between; } .day .dn em { font-style:normal; font-size:10.5px; font-weight:700; background:var(--y); padding:1px 7px; border-radius:99px; }
  .ev { font-size:11.5px; font-weight:600; padding:4px 8px; border-radius:9px; line-height:1.3; cursor:default; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ev.tour { background:var(--ink); color:#fff; cursor:pointer; } .ev.pub { background:var(--ysoft); color:#6B5600; } .ev.rend { background:var(--soft); color:#5F5F58; } .ev.rel { background:#EEF0FF; color:#4B55C9; } .ev.gcal { background:#E8F5EE; color:#1F7A4A; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); } .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .report { background:#fff; border-radius:24px; padding:30px; margin-top:18px; border:1px solid var(--line); }
  .kpis4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin:18px 0; } .kpis4 > div { background:var(--soft); border-radius:18px; padding:14px; }
  @media (max-width:760px) { .cal { grid-template-columns:repeat(2, 1fr); } .cal .dh2 { display:none; } .kpis4 { grid-template-columns:1fr 1fr; } }
  .hidden { display:none !important; }
  #invoice { background:#fff; border-radius:24px; padding:40px; box-shadow:0 30px 80px rgba(0,0,0,.08); max-width:760px; margin:18px auto 0; border-top:8px solid var(--y); }

  /* Animations d'entrée */
  .in { animation:up .6s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i, 0) * 60ms); }
  @keyframes up { from { opacity:0; transform:translateY(16px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } .chart path.line { stroke-dashoffset:0; } .chart path.area { opacity:1; } }

  /* Mobile */
  @media (max-width:1100px) { .c3 { grid-column:span 6; } .c4, .c5 { grid-column:span 6; } .c7, .c8 { grid-column:span 12; } }
  @media (max-width:760px) {
    .app { grid-template-columns:1fr; } .main { padding:16px 16px 100px; }
    .side { position:fixed; top:auto; bottom:10px; left:10px; right:10px; height:auto; padding:0; z-index:20; } .side .logo, .side .bottom { display:none; }
    .side nav { flex-direction:row; overflow-x:auto; border-radius:26px; box-shadow:0 10px 30px rgba(0,0,0,.12); } .nb .tip { display:none; }
    .topbar { flex-wrap:wrap; } .ask { order:3; width:100%; } .hello h1 { font-size:22px; }
    .bento > .card, .bento > div { grid-column:span 12 !important; } .big { font-size:32px; }
  }
  body.portal .side, body.portal .topbar, body.portal .page-h, body.portal #copylink, body.portal #sendrep, body.portal .portal-hide { display:none !important; }
  body.portal .bbar i, body.portal .bbar span { display:none; } body.portal .bbar { justify-content:flex-end; }
  body.portal .app { grid-template-columns:1fr; } body.portal .main { padding:24px; max-width:1100px; margin:0 auto; }
  @media print { .side, .topbar, .noprint, .drawer, .veil { display:none !important; } body { background:#fff; } .app { display:block; } }

// ================= Données (API du hub) =================

let TODAY = new Date(), month = '';
const PORTAL = window.__PORTAL__ || null;
const PAL = ['#FFE680', '#FFD3C2', '#CFD6FF', '#CFEBDD', '#E8D5FF', '#FFD6E8'];
const norm = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const fmt = (n) => Math.round(n).toLocaleString('fr-FR') + ' €';
const kFmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' M' : n >= 1e3 ? Math.round(n / 1e3) + ' k' : String(n);
const mDate = (m) => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1);
const mName = (m) => mDate(m).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
const mShort = (m) => mDate(m).toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '');
const ymOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const tint = (hex) => { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v + (255 - v) * 0.75)); return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join(''); };
const dt = (ms) => (ms ? new Date(ms) : null);
/** Met en forme l'état renvoyé par le serveur (hub complet, ou espace client). */
function load(st) {
  RAW = st; TODAY = new Date(st.now);
  const clients = st.clients ?? [st.client];
  CLIENTS = Object.fromEntries(clients.map((c) => [c.name, c.fee]));
  CCOL = Object.fromEntries(clients.map((c) => [c.name, [c.color, tint(c.color)]]));
  TOKENS = Object.fromEntries(clients.filter((c) => c.token).map((c) => [c.name, c.token]));
  CIDS = Object.fromEntries(clients.map((c) => [c.name, c.id])); MIDS = Object.fromEntries(st.monteurs.map((m) => [m.name, m.id]));
  MONTEURS = Object.fromEntries(st.monteurs.map((m) => [m.name, m.rate ?? 0]));
  MCOL = Object.fromEntries(st.monteurs.map((m, i) => [m.name, PAL[i % PAL.length]]));
  const cn = new Map(clients.map((c) => [c.id, c.name])), mn = new Map(st.monteurs.map((m) => [m.id, m.name])), tn = new Map(st.tournages.map((t) => [t.id, t.code]));
  VIDS = st.videos.map((v) => ({ id: v.id, client: cn.get(v.client_id), title: v.title, monteur: v.monteur_id ? mn.get(v.monteur_id) : '—', status: v.status, tag: v.tag ?? 'TOFU',
    due: dt(v.due_at), sentAt: dt(v.sent_at), validated: dt(v.validated_at), planned: dt(v.planned_at), published: dt(v.published_at), views: v.views ?? 0, comment: v.comment ?? '', videoUrl: v.video_url ?? null, reminded: dt(v.reminded_at), tournage: tn.get(v.tournage_id) ?? null }));
  TOURN = st.tournages.map((t) => ({ id: t.code, dbId: t.id, client: cn.get(t.client_id), date: new Date(t.date), hours: t.hours, spot: t.spot_name ? { n: t.spot_name, q: t.spot_place ?? '', p: t.spot_price ?? 0 } : null }));
  TX = (st.transactions ?? []).map((t) => ({ ...t }));
  EVENTS = (st.events ?? []).map((e) => ({ ...e, at: new Date(e.at) }));
  // Paie des monteurs = vidéos validées dans le mois × leur tarif
  VIDEOS = {};
  VIDS.forEach((v) => { if (v.validated && v.monteur !== '—') { const m = ymOf(v.validated); (VIDEOS[m] ??= {})[v.monteur] = (VIDEOS[m][v.monteur] ?? 0) + 1; } });
  const cur = ymOf(TODAY), all = [...new Set([...TX.map((t) => t.date.slice(0, 7)), cur])].filter((m) => m <= cur).sort();
  MONTHS = all.slice(-3); MONTHS.forEach((m) => (VIDEOS[m] ??= {}));
  if (!MONTHS.includes(month)) month = cur;
  HISTORY = all.slice(-6, -3).map((m) => [m, stats(m).rest]);
}
const CAT = { client: 'Client', monteur: 'Monteur', outil: 'Outil', tournage: 'Tournage', autre: 'Autre', check: 'À vérifier' };
let rate = 0.261;
function stats(m) {
  const tx = TX.filter((t) => t.date.startsWith(m));
  const sum = (f) => tx.filter(f).reduce((a, t) => a + t.amount, 0);
  const ca = sum((t) => t.amount > 0 && t.cat === 'client');
  const mont = -sum((t) => t.cat === 'monteur');
  const other = -sum((t) => t.amount < 0 && t.cat !== 'monteur');
  const fact = Object.values(CLIENTS).reduce((a, b) => a + b, 0); // facturé du mois (payé ou non)
  const urssaf = Math.round(ca * rate);
  return { tx, ca, fact, mont, other, urssaf, rest: fact - mont - other - Math.round(fact * rate), check: tx.filter((t) => t.cat === 'check').length };
}

// Vidéos (synchronisées avec l'outil de prod)
const DAY = 864e5;
const dAgo = (n, h = 18) => new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - n, h);
const dFmt = (d) => (d ? d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) : '—');
const ST = { idee: ['Idée', '#D6D6CF'], script: ['Scripting', '#C9A400'], afilmer: ['À filmer', '#FF8A5C'], filme: ['Filmé', '#8C8C85'], montage: ['En montage', '#B5B5AE'], avalider: ['À valider', '#FCCA09'], modif: ['Modif demandée', '#D9483B'], valide: ['Validé', '#2F9E63'], planifie: ['Planifié', '#7C8CFF'], publie: ['Publié', '#111111'] };
const scriptsOf = (t) => VIDS.filter((v) => v.client === t.client && v.status === 'afilmer');
const nextTourn = () => TOURN.filter((t) => inC(t.client) && t.date >= new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate())).sort((a, b) => a.date - b.date)[0];
const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function toast(msg, action, ms = 3200) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; document.body.appendChild(t);
  if (action) { const b = document.createElement('button'); b.className = 'btn sm'; b.style.marginLeft = '10px'; b.textContent = action[0]; b.onclick = () => { t.remove(); action[1](); }; t.appendChild(b); }
  requestAnimationFrame(() => t.classList.add('on')); setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 400); }, ms);
}
/** Lecteur de la vidéo à valider : mp4 lu sur place, Google Drive en aperçu, sinon lien qui s'ouvre. */
function player(v) {
  const u = v.videoUrl;
  if (!u) return `<div class="vplay" style="background:${grad(v)}"><em>${esc(v.tag)}</em><span class="dur" style="white-space:nowrap">vidéo pas encore jointe</span></div>`;
  if (/\.(mp4|mov|webm)(\?|$)/i.test(u)) return `<video src="${esc(u)}" controls playsinline preload="metadata" style="display:block;margin:0 auto;width:100%;max-width:260px;aspect-ratio:9/16;max-height:420px;border-radius:18px;background:#000"></video>`;
  const drive = u.match(/drive\.google\.com\/file\/d\/([^/?]+)/);
  if (drive) return `<iframe src="https://drive.google.com/file/d/${drive[1]}/preview" allow="autoplay" style="display:block;margin:0 auto;width:100%;max-width:260px;aspect-ratio:9/16;max-height:420px;border:0;border-radius:18px;background:#000"></iframe>`;
  return `<a class="vplay" href="${esc(u)}" target="_blank" rel="noopener" style="background:${grad(v)};text-decoration:none"><em>${esc(v.tag)}</em><span class="dur">▶ Regarder la vidéo</span></a>`;
}
const late = (v) => v.status === 'montage' && v.due && v.due < TODAY;
const waitD = (v) => (v.sentAt ? Math.round((TODAY - v.sentAt) / DAY) : 0);
const ago = (n) => (n <= 0 ? 'aujourd’hui' : n === 1 ? 'hier' : `il y a ${n} j`);
const grad = (v) => `linear-gradient(160deg, ${CCOL[v.client]?.[1] ?? '#eee'}, ${CCOL[v.client]?.[0] ?? '#ccc'})`;
const initials = (s) => s.replace('Client ', '').slice(0, 1);

function margins(m) {
  const s = stats(m);
  const mont = Object.entries(VIDEOS[m] ?? {}).reduce((a, [mo, n]) => a + n * MONTEURS[mo], 0);
  const w = {}; VIDS.forEach((v) => { if (MONTEURS[v.monteur]) w[v.client] = (w[v.client] ?? 0) + MONTEURS[v.monteur]; });
  const tot = Object.values(w).reduce((a, b) => a + b, 0) || 1;
  return Object.entries(CLIENTS).map(([c, fee]) => { const sh = (w[c] ?? 0) / tot, cm = Math.round(mont * sh), co = Math.round(s.other * sh); return { c, fee, cm, co, marge: fee - cm - co, pc: Math.round(((fee - cm - co) / fee) * 100) }; });
}
const monteurDue = (m) => { const s = stats(m); return Object.entries(VIDEOS[m] ?? {}).map(([mo, n]) => { const owed = n * MONTEURS[mo], paid = 0 - s.tx.filter((t) => t.who === mo).reduce((a, t) => a + t.amount, 0) + 0; return { mo, n, owed, paid, left: owed - paid }; }); };
const unpaidClients = (m) => { const s = stats(m); return Object.keys(CLIENTS).filter((c) => !s.tx.some((t) => t.who === c && t.amount > 0)); };
const weekReels = () => VIDS.filter((v) => v.published && TODAY - v.published < 7 * DAY).sort((a, b) => b.views - a.views);

// ================= Icônes =================
const I = {
  home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/>',
  video: '<rect x="3" y="5" width="14" height="14" rx="3"/><path d="m17 10 4-2.5v9L17 14"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.7L16.5 9.5"/>',
  chart: '<path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 4-4 3 3 5-6"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  wallet: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2"/><path d="M3 9h18"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',
  plug: '<path d="M9 3v5M15 3v5"/><path d="M7 8h10v4a5 5 0 0 1-10 0z"/><path d="M12 17v4"/>',
  arrow: '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  euro: '<path d="M17 6.5A7 7 0 1 0 17 17.5"/><path d="M4 10h9M4 14h9"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
};
const ic = (k, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const arrowBtn = (go, sub) => `<button class="arrow" data-go="${go}"${sub ? ` data-sub="${sub}"` : ''} aria-label="Ouvrir">${ic('arrow', 15)}</button>`;
const PAGES = [['home', 'Accueil', 'home'], ['videos', 'Vidéos', 'video'], ['planning', 'Planning', 'cal'], ['client', 'Espace client', 'check'], ['perfs', 'Performances', 'chart'], ['sav', 'SAV', 'chat'], ['compta', 'Compta', 'wallet'], ['spots', 'Spots tournage', 'mic'], ['team', 'Clients & monteurs', 'users'], ['connect', 'Connexions', 'plug']];
let page = 'home', sub = 'resume', cf = 'all', phase = 'all', showReport = false; // cf = client choisi dans le menu du haut
const inC = (c) => cf === 'all' || c === cf;
const vcOf = () => (cf === 'all' ? Object.keys(CLIENTS)[0] : cf);
const cLabel = () => (cf === 'all' ? 'tous clients' : cf);

// ================= Graphiques =================
/** Courbe mois par mois : axe à 0 (pas de fausse montée), montant au-dessus de chaque mois, mois choisi en jaune. */
function lineChart(points, w = 560, h = 190, hi = points.length - 1) {
  const max = Math.max(...points.map((p) => p[1]), 1) * 1.2, top = 26, base = h - 28;
  const X = (i) => 30 + (i * (w - 60)) / Math.max(1, points.length - 1), Y = (v) => base - (Math.max(0, v) / max) * (base - top);
  let d = `M${X(0)},${Y(points[0][1])}`;
  for (let i = 1; i < points.length; i++) { const x0 = X(i - 1), y0 = Y(points[i - 1][1]), x1 = X(i), y1 = Y(points[i][1]), cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const last = points.length - 1, k = (v) => (Math.abs(v) >= 1000 ? (v / 1000).toFixed(1).replace('.0', '').replace('.', ',') + ' k€' : Math.round(v) + ' €');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCCA09" stop-opacity=".35"/><stop offset="1" stop-color="#FCCA09" stop-opacity="0"/></linearGradient></defs>
    <line x1="${X(0)}" x2="${X(last)}" y1="${base}" y2="${base}" stroke="#e6e3dc"/>
    <path class="area" d="${d} L${X(last)},${base} L${X(0)},${base} Z" fill="url(#ag)"/><path class="line" d="${d}"/>
    ${points.map((p, i) => `<g style="opacity:0;animation:fade .4s ${1.2 + i * 0.05}s forwards"><circle cx="${X(i)}" cy="${Y(p[1])}" r="${i === hi ? 6 : 3.5}" fill="${i === hi ? '#FCCA09' : '#111'}" stroke="#111" stroke-width="${i === hi ? 2.5 : 0}"/>
      <text x="${X(i)}" y="${Y(p[1]) - 12}" text-anchor="middle" style="font-weight:${i === hi ? 800 : 600};fill:#111">${k(p[1])}</text></g>`).join('')}
    ${points.map((p, i) => `<text x="${X(i)}" y="${h - 6}" text-anchor="middle" style="${i === hi ? 'font-weight:700;fill:#111' : ''}">${p[0]}</text>`).join('')}</svg>`;
}
function gauge(pc, label) {
  const L = Math.PI * 80;
  return `<svg class="gauge" viewBox="0 0 200 118" width="100%" style="max-width:230px;display:block;margin:0 auto"><path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="#EFEFEA" stroke-width="16" stroke-linecap="round"/>
    <path class="arc" d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="#111" stroke-width="16" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L}" data-to="${L * (1 - pc / 100)}"/>
    <text x="100" y="88" text-anchor="middle" style="font:800 30px 'Plus Jakarta Sans',system-ui,sans-serif;fill:#141414">${pc} %</text><text x="100" y="110" text-anchor="middle" style="font:500 11px 'Plus Jakarta Sans',system-ui,sans-serif;fill:#8C8C85">${label}</text></svg>`;
}
const bars = (vals, labels, hiLast = true) => { const mx = Math.max(...vals, 1); return `<div class="bars" style="margin-bottom:22px">${vals.map((v, i) => `<div class="${hiLast && i === vals.length - 1 ? 'hi' : ''}" data-h="${Math.max(6, (v / mx) * 100)}"><span>${labels[i]}</span></div>`).join('')}</div>`; };
const count = (n, f = 'eur') => `<span data-count="${n}" data-f="${f}">0</span>`;

// ================= Pages =================
function pHome() {
  const s = stats(month), mgAll = margins(month), mg = mgAll.filter((r) => inC(r.c)), tot = mg.reduce((a, r) => ({ fee: a.fee + r.fee, m: a.m + r.marge }), { fee: 0, m: 0 });
  const one = cf !== 'all' ? mgAll.find((r) => r.c === cf) : null;
  // Montant principal : « reste pour toi » (tous clients) ou marge du client choisi

  const shareOf = one ? one.marge / mgAll.reduce((a, r) => a + r.marge, 0) : 1;

    <div class="card c8 in" style="--i:0"><div class="ch"><h3><span class="ic">${ic('euro', 16)}</span>${one ? `Marge · ${cf}` : 'Reste pour toi'} · ${mName(month)}</h3>${arrowBtn('compta')}</div>

      <div class="row" style="gap:22px">${one ? `<div><div class="muted small">Facturé</div><b class="num">${fmt(one.fee)}</b></div><div><div class="muted small">Monteurs</div><b class="num">${fmt(one.cm)}</b></div><div><div class="muted small">Autres</div><b class="num">${fmt(one.co)}</b></div>` : `<div><div class="muted small">Facturé</div><b class="num">${fmt(s.fact)}</b></div><div><div class="muted small">Monteurs</div><b class="num">${fmt(s.mont)}</b></div><div><div class="muted small">Encaissé</div><b class="num">${fmt(s.ca)}</b></div>`}</div></div>
      <div style="margin-top:10px">${lineChart(trend, 560, 190, trend.length - MONTHS.length + MONTHS.indexOf(month))}</div></div>
    <div class="card c4 in" style="--i:1"><div class="ch"><h3><span class="ic">${ic('chart', 16)}</span>${one ? 'Rentabilité' : 'Marge globale'}</h3>${arrowBtn('compta')}</div>${gauge(Math.round((tot.m / tot.fee) * 100), one ? 'de marge' : 'de ton CA')}
      ${mg.map((r) => `<div style="margin-top:12px"><div class="row small"><span>${r.c}</span><b>${r.pc} %</b></div><div class="bar yl" style="margin-top:5px"><i data-w="${r.pc}"></i></div></div>`).join('')}</div>
    <div class="card dark c4 in" style="--i:2"><div class="ch"><h3><span class="ic">${ic('check', 16)}</span>À valider par tes clients</h3>${arrowBtn('client')}</div>

      <div class="avs">${Object.keys(CLIENTS).filter(inC).map((c) => `<div class="av" style="background:${CCOL[c][0]}">${initials(c)}</div>`).join('')}</div></div>
    <div class="card c4 in" style="--i:3"><div class="ch"><h3><span class="ic">${ic('eye', 16)}</span>Vues cette semaine</h3>${arrowBtn('perfs')}</div>
      <div class="mid">${count(wkViews, 'k')}</div><p class="muted small" style="margin:2px 0 14px">${wk.length} reels publiés · ${cLabel()}</p>${bars(days.map((d) => d[1]), days.map((d) => d[0]))}</div>
    <div class="card yellow c4 in" style="--i:4"><div class="ch"><h3><span class="ic" style="background:rgba(0,0,0,.08)">${ic('chat', 16)}</span>SAV automatique</h3>${arrowBtn('sav')}</div>
      <div class="big">${hFmt(savStats().mins)}</div><p class="muted small" style="margin:4px 0 14px">gagnées pour Romain cette semaine</p><div class="row small"><span>🤖 ${savStats().auto} actions auto</span><span>⏰ ${savStats().mont} relances monteurs</span></div></div>
    <div class="card c7 in" style="--i:5"><div class="ch"><h3><span class="ic">${ic('spark', 16)}</span>À faire aujourd'hui</h3><span class="pill g">le reste est géré tout seul</span></div>
      ${modif.map((v) => `<div class="li"><div class="thumb" style="background:${grad(v)}"></div><div class="grow"><b>${v.client} demande une modif</b><small>« ${v.title} » · ${v.comment}</small></div><button class="btn sm" data-go="videos">Voir</button></div>`).join('')}
      ${unpaidClients(month).filter(inC).map((c) => `<div class="li"><div class="av" style="background:${CCOL[c][0]};width:44px;height:44px">${initials(c)}</div><div class="grow"><b>${c} n'a pas payé ${fmt(CLIENTS[c])}</b><small>Relance automatique envoyée hier</small></div><button class="btn sm ghost" data-go="compta" data-sub="factures">Facture</button></div>`).join('')}
      ${lt.slice(0, 2).map((v) => `<div class="li"><div class="thumb" style="background:${grad(v)}"></div><div class="grow"><b>Montage en retard · ${v.monteur}</b><small>« ${v.title} » · relancé sur Slack</small></div><span class="pill down">retard</span></div>`).join('')}</div>
    <div class="card c5 in" style="--i:6"><div class="ch"><h3><span class="ic">${ic('video', 16)}</span>Top reels de la semaine</h3>${arrowBtn('perfs')}</div>
      ${wk.slice(0, 4).map((v, i) => `<div class="li"><div class="thumb" style="background:${grad(v)}"></div><div class="grow"><b>${v.title}</b><small>${v.client} · ${v.tag} · ${dFmt(v.published)}</small></div><b class="num">${kFmt(v.views)}</b></div>`).join('')}</div>
    <div class="card c12 in" style="--i:7"><div class="ch"><h3><span class="ic">${ic('users', 16)}</span>Monteurs · ${mName(month)}</h3>${arrowBtn('compta', 'monteurs')}</div>
      <div class="bento" style="gap:14px">${due.length ? '' : '<p class="muted">Aucun monteur sur ce client.</p>'}${due.map((d) => `<div class="c3" style="grid-column:span 3"><div class="row"><div class="row" style="gap:10px"><div class="av" style="background:${MCOL[d.mo]};width:38px;height:38px">${d.mo[0]}</div><div><b>${d.mo}</b><div class="muted small">${d.n} vidéos · ${fmt(d.owed)}</div></div></div><span class="pill ${d.left > 0 ? 'y' : 'up'}">${d.left > 0 ? 'à payer' : 'payé'}</span></div><div class="bar" style="margin-top:12px"><i data-w="${Math.min(100, (d.paid / d.owed) * 100)}"></i></div></div>`).join('')}</div></div>
  </div>`;
}

/** Petit formulaire « Planifier » sur une vidéo validée (date + heure de publication). */
const planForm = (v) => `<div class="row" style="gap:6px;margin-top:8px;flex-wrap:nowrap"><input type="datetime-local" data-pd="${v.id}" value="${isoDay(new Date(+TODAY + DAY))}T18:00" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:5px 6px;font:inherit;font-size:12px"><button class="btn sm y" data-plan="${v.id}">Planifier</button></div>`;
function pVideos() {
  const list = VIDS.filter((v) => inC(v.client));
  const PH = { pre: ['idee', 'script', 'afilmer', 'filme'], post: ['montage', 'avalider', 'modif', 'valide', 'planifie', 'publie'] };
  const cols = phase === 'all' ? Object.keys(ST) : PH[phase];
  return `<div class="page-h"><div><h2>Toutes les vidéos</h2><p>De l'idée à la publication, synchronisé avec ton Notion. Fini les clips éparpillés.</p></div>
    <div class="tabs">${[['all', 'Tout'], ['pre', 'Tournage'], ['post', 'Post-prod']].map(([k, l]) => `<button class="${phase === k ? 'on' : ''}" data-ph="${k}">${l}</button>`).join('')}</div></div>
  <div class="kanban">${cols.map((s, k) => { const all = list.filter((v) => v.status === s), vs = s === 'publie' ? [...all].sort((a, b) => b.published - a.published).slice(0, 4) : all; return `<div class="col in" style="--i:${k}"><div class="colh"><i style="background:${ST[s][1]}"></i>${ST[s][0]}<span>${all.length}</span></div>
    ${vs.map((v) => `<div class="vc"><div class="vt" style="background:${grad(v)}"><em>${v.tag}</em></div><b>${v.title}</b><small>${v.client}${v.monteur !== '—' ? ' · ' + v.monteur : ''}</small>${s === 'afilmer' && TOURN.find((t) => t.client === v.client) ? `<small>🎬 tournage ${TOURN.find((t) => t.client === v.client).id} · ${dFmt(TOURN.find((t) => t.client === v.client).date)}</small>` : ''}
      ${late(v) ? `<small class="ko">⏰ en retard${v.reminded ? ' · monteur relancé' : ''}</small>` : ''}${s === 'avalider' ? `<small>envoyé ${ago(waitD(v))}${v.reminded ? ' · client relancé' : ''}</small>` : ''}${s === 'valide' ? planForm(v) : ''}
      ${s === 'modif' ? `<small class="ko">« ${v.comment} »</small>` : ''}${s === 'planifie' ? `<small>📅 ${dFmt(v.planned)} · 18 h</small>` : ''}${s === 'publie' ? `<small class="ok">${kFmt(v.views)} vues</small>` : ''}</div>`).join('') || '<p class="muted small" style="text-align:center">—</p>'}${all.length > vs.length ? `<p class="muted small" style="text-align:center">+ ${all.length - vs.length} autres · voir Perfs</p>` : ''}</div>`; }).join('')}</div>`;
}

function pPlanning() {
  const start = dAgo(4, 0); // lundi 19
  const days = [...Array(14)].map((_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  const V = VIDS.filter((v) => inC(v.client));
  const GCAL = (RAW.calendar?.events ?? []).map((e) => ({ ...e, start: new Date(e.start) }));
  const evs = (d) => {
    const k = isoDay(d), out = [];
    GCAL.filter((e) => isoDay(e.start) === k).forEach((e) => out.push(`<div class="ev gcal" title="${esc(e.title)}${e.place ? ' · ' + esc(e.place) : ''}">📅 ${e.allDay ? '' : e.start.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + ' '}${esc(e.title)}</div>`));
    TOURN.filter((t) => inC(t.client) && isoDay(t.date) === k).forEach((t) => out.push(`<div class="ev tour" data-tour="${t.id}">🎬 ${t.id} · ${t.client.replace('Client ', '')} · ${scriptsOf(t).length} scripts</div>`));
    V.filter((v) => (v.planned && isoDay(v.planned) === k) || (v.published && isoDay(v.published) === k)).forEach((v) => out.push(`<div class="ev pub" title="${v.title}">📲 ${v.title}</div>`));
    V.filter((v) => v.status === 'montage' && v.due && isoDay(v.due) === k).forEach((v) => out.push(`<div class="ev rend" title="${v.title}">✂️ Rendu ${v.monteur}</div>`));
    V.filter((v) => v.sentAt && isoDay(new Date(+v.sentAt + 2 * DAY)) === k).forEach((v) => out.push(`<div class="ev rel" title="${v.title}">⏰ Relance ${v.client.replace('Client ', '')}</div>`));
    return out.join('');
  };
  const t = nextTourn(), sc = t ? scriptsOf(t) : [], toPlan = V.filter((v) => v.status === 'valide');
  return `<div class="page-h"><div><h2>Planning</h2><p>Tournages, rendus des monteurs, relances et publications : tout au même endroit.</p></div>
    <div class="legend"><span><i style="background:#111"></i>Tournage</span><span><i style="background:#FFF7D1"></i>Publication</span><span><i style="background:#F6F6F2;border:1px solid #ddd"></i>Rendu montage</span><span><i style="background:#EEF0FF"></i>Relance auto</span><span><i style="background:#E8F5EE"></i>Google Agenda</span></div></div>
  <div class="bento"><div class="c12 in" style="grid-column:span 12;min-width:0"><div class="cal">${['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map((d) => `<div class="dh2">${d}</div>`).join('')}
    ${days.map((d) => `<div class="day ${d < dAgo(0, 0) ? 'past' : ''} ${isoDay(d) === isoDay(TODAY) ? 'today' : ''}"><div class="dn">${d.getDate()}${isoDay(d) === isoDay(TODAY) ? '<em>aujourd’hui</em>' : ''}</div>${evs(d)}</div>`).join('')}</div></div>
    <div class="card dark c6 in" style="--i:1">${t ? `<div class="ch"><h3><span class="ic">${ic('video', 16)}</span>Prochain tournage · ${t.id}</h3></div>
      <div class="mid">${dFmt(t.date)} · ${t.date.getHours()} h</div><p class="muted small" style="margin:4px 0 14px">${t.client} · ${t.hours} h de tournage</p>
      <div class="li" style="padding-top:0"><div class="grow"><b>📍 ${t.spot ? t.spot.n : 'Spot à trouver'}</b><small>${t.spot ? `${t.spot.q} · ${t.spot.p} €/h · ${fmt(t.spot.p * t.hours)} (déjà en compta)` : 'Budget 30-50 €/h'}</small></div>${t.spot ? '<span class="pill up">réservé</span>' : '<button class="btn sm y" data-go="spots">Trouver</button>'}</div>
      <div class="muted small" style="margin:12px 0 6px">${sc.length} scripts à filmer</div>${sc.map((v) => `<div class="small" style="padding:3px 0">• ${v.title}</div>`).join('')}
      <button class="btn y w" id="brief" style="margin-top:16px">Envoyer le brief à l'équipe</button>` : '<p class="muted">Aucun tournage prévu.</p>'}</div>
    <div class="card c6 in" style="--i:2"><div class="ch"><h3><span class="ic">${ic('cal', 16)}</span>Les 7 prochains jours</h3></div>
      ${days.filter((d) => d >= dAgo(0, 0)).slice(0, 7).map((d) => { const e = evs(d); return e ? `<div class="li" style="align-items:flex-start"><b style="width:74px;flex:none;font-size:13px">${d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' })}</b><div class="grow" style="display:flex;flex-direction:column;gap:4px">${e.replace(/class="ev /g, 'style="white-space:normal" class="ev ')}</div></div>` : ''; }).join('') || '<p class="muted">Rien de prévu.</p>'}</div>
    <div class="card c6 in" style="--i:3"><div class="ch"><h3><span class="ic">${ic('check', 16)}</span>À planifier</h3><span class="pill ${toPlan.length ? 'y' : 'g'}">${toPlan.length}</span></div>
      ${toPlan.map((v) => `<div class="li" style="flex-wrap:wrap"><div class="grow"><b>${esc(v.title)}</b><small>${esc(v.client)} · validée ${v.validated ? ago(Math.round((TODAY - v.validated) / DAY)) : ''}</small></div><div style="width:100%">${planForm(v)}</div></div>`).join('') || '<p class="muted small">Toutes les vidéos validées ont une date 👌</p>'}</div>
    <div class="card c6 in" style="--i:4"><div class="ch"><h3><span class="ic">${ic('video', 16)}</span>Nouveau tournage</h3></div>
      <div class="field"><span class="muted small">Client</span><select id="ntc" class="sel" style="width:100%">${Object.keys(CLIENTS).map((c) => `<option value="${CIDS[c]}" ${c === cf ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="row" style="gap:8px;flex-wrap:nowrap"><input id="ntd" type="datetime-local" value="${isoDay(new Date(+TODAY + 7 * DAY))}T14:00" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:8px;font:inherit"><input id="nth" type="number" min="1" max="12" value="3" style="width:70px;border:1px solid var(--line);border-radius:12px;padding:8px;font:inherit"><span class="muted small">h</span></div>
      <button class="btn y w" id="ntgo" style="margin-top:12px">Ajouter au planning</button></div></div>`;
}

function pPerfs() {
  const pub = VIDS.filter((v) => v.status === 'publie');
  if (!pub.some((v) => v.views > 0)) return `<div class="page-h"><div><h2>Performances</h2><p>Vues des reels publiés de chaque client.</p></div></div>
    <div class="card in" style="text-align:center;padding:40px"><div style="font-size:34px">📸</div><h3>Les vues arrivent bientôt</h3><p class="muted small" style="max-width:460px;margin:8px auto 0">Dès que l'Instagram de tes clients est relié (connexion officielle, un clic par client), les vues de chaque reel publié se mettent à jour toutes les nuits. ${pub.length} reel(s) publié(s) déjà repérés.</p></div>`;
  return `<div class="page-h"><div><h2>Performances</h2><p>Vues relevées chaque nuit sur l'Instagram de chaque client (connexion officielle, gratuite).</p></div></div>
  <div class="bento">${Object.keys(CLIENTS).filter(inC).map((c, k) => {
    const vs = pub.filter((v) => v.client === c).sort((a, b) => b.views - a.views), max = vs[0]?.views || 1;
    const avg = (t) => { const x = vs.filter((v) => v.tag === t); return x.length ? Math.round(x.reduce((a, v) => a + v.views, 0) / x.length) : 0; };
    const byH = {}; vs.filter((v) => v.published).forEach((v) => (byH[v.published.getHours()] ??= []).push(v.views));
    const bestH = Object.entries(byH).map(([h, a]) => [h, a.reduce((x, y) => x + y, 0) / a.length]).sort((a, b) => b[1] - a[1])[0];
    return `<div class="card c4 in" style="--i:${k}"><div class="ch"><h3><span class="av" style="background:${CCOL[c][0]};border:0">${initials(c)}</span>${c}</h3><span class="pill g">${vs.length} reels</span></div>
      <div class="big">${count(vs.reduce((a, v) => a + v.views, 0), 'k')}</div><p class="muted small" style="margin:2px 0 14px">vues sur les reels publiés · <b style="color:var(--text)">${(CLIENTS[c] / Math.max(1, vs.reduce((a, v) => a + v.views, 0) / 1000)).toFixed(2).replace('.', ',')} € / 1 000 vues</b></p>
      ${vs.slice(0, 4).map((v) => `<div style="margin-bottom:11px"><div class="row small" style="flex-wrap:nowrap"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v.title}</span><b>${kFmt(v.views)}</b></div><div class="bar" style="margin-top:5px"><i data-w="${(v.views / max) * 100}"></i></div></div>`).join('')}
      <div class="row small" style="margin-top:14px"><span class="pill g">TOFU ${kFmt(avg('TOFU'))}/vidéo</span><span class="pill y">MOFU ${kFmt(avg('MOFU'))}/vidéo</span></div>
      <div class="tip2">💡 ${avg('MOFU') > avg('TOFU') ? 'Les MOFU marchent mieux : pousse les témoignages et les cas concrets.' : 'Les TOFU tirent les vues : garde 2 TOFU pour 1 MOFU.'} Meilleure heure : <b>${bestH ? bestH[0] + ' h' : '—'}</b>.</div></div>`;
  }).join('')}</div>`;
}

function answer(q) {

  if (/valid/.test(t)) { const v = VIDS.filter((x) => x.status === 'avalider'); return [`**${v.length} vidéos** attendent une validation : ${v.map((x) => `« ${x.title} » (${x.client.replace('Client ', '')})`).join(', ')}. ${v.filter((x) => x.reminded).length} déjà relancée(s) ; les autres le seront à 48 h.`, { k: 'À valider', v: String(v.length), d: 'relance auto à 48 h' }]; }
  if (/meilleur|top|reel|vue/.test(t)) { const w = weekReels(), b = w[0]; return [`Ton meilleur reel de la semaine : **« ${b.title} »** (${b.client}) avec **${kFmt(b.views)} vues**. Au total, ${kFmt(w.reduce((a, v) => a + v.views, 0))} vues sur ${w.length} reels cette semaine.`, { k: 'Top reel', v: kFmt(b.views) + ' vues', d: b.title }]; }
  if (/monteur|virement/.test(t)) { const d = monteurDue(month), left = d.filter((x) => x.left > 0); return [left.length ? `Il te reste **${fmt(left.reduce((a, x) => a + x.left, 0))}** à payer : ${left.map((x) => `${x.mo} (${fmt(x.left)})`).join(', ')}. Les autres sont à jour.` : 'Tous tes monteurs sont payés ✅', { k: 'Dû aux monteurs', v: fmt(left.reduce((a, x) => a + x.left, 0)), d: `${mName(month)}` }]; }
  if (/retard|montage/.test(t)) { const l = VIDS.filter(late); return [`**${l.length} montages** sont en retard : ${l.map((x) => `« ${x.title} » (${x.monteur})`).join(', ')}. ${l.filter((x) => x.reminded).length ? 'Relance Slack envoyée aux monteurs concernés.' : 'Relance Slack automatique dans l’heure.'}`, null]; }

  if (/urssaf|impot|charge|taxe/.test(t)) return [`Pour ${mName(month)}, mets de côté **${fmt(s.urssaf)}** pour l'URSSAF (${String(rate * 100).replace('.', ',')} % de ${fmt(s.ca)} encaissés). C'est une estimation.`, { k: 'URSSAF estimée', v: fmt(s.urssaf), d: 'à déclarer sur ton CA' }];

const md = (s) => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

function animate(root) {
  root.querySelectorAll('[data-count]').forEach((el) => {
    const to = +el.dataset.count, f = el.dataset.f, t0 = performance.now(), D = 1100;

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return show(to);
    const step = (now) => { const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3); show(to * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);

  requestAnimationFrame(() => setTimeout(() => {
    root.querySelectorAll('[data-w]').forEach((el) => (el.style.width = el.dataset.w + '%'));
    root.querySelectorAll('[data-h]').forEach((el) => (el.style.height = el.dataset.h + '%'));

}
function bind(app) {
  document.querySelectorAll('[data-go]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); page = b.dataset.go; if (b.dataset.sub) sub = b.dataset.sub; render(); scrollTo({ top: 0, behavior: 'smooth' }); }));
  app.querySelectorAll('[data-sub2]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); sub = b.dataset.sub2; render(); }));
  app.querySelectorAll('[data-ok]').forEach((b) => (b.onclick = () => act(b, async () => {
    const v = VIDS.find((x) => x.id === +b.dataset.ok);
    await post(PORTAL ? `/api/portal/${PORTAL}/videos/${v.id}/validate` : `/api/videos/${v.id}/validate`);
    b.closest('[data-card]').innerHTML = `<div class="done"><div class="ck">✓</div><b>Validée !</b><span class="muted small">${PORTAL ? 'Merci, l’équipe est prévenue' : `Statut mis à jour · ${v.monteur} prévenu`}</span></div>`;
    toast(PORTAL ? '✓ Validée' : `✓ Validée${MONTEURS[v.monteur] ? ` · <b>+${MONTEURS[v.monteur]} €</b> dus à ${esc(v.monteur)}` : ''}`, ['Annuler', () => act(null, () => post(PORTAL ? `/api/portal/${PORTAL}/videos/${v.id}/undo` : `/api/videos/${v.id}/undo`).then(() => toast('↩️ Validation annulée')))], 15000);
  }, 1300)));
  app.querySelectorAll('[data-mod]').forEach((b) => (b.onclick = () => document.getElementById('mod-' + b.dataset.mod).classList.toggle('hidden')));
  app.querySelectorAll('[data-send]').forEach((b) => (b.onclick = () => act(b, async () => {
    const v = VIDS.find((x) => x.id === +b.dataset.send), comment = b.previousElementSibling.value.trim() || 'Petite modif demandée';
    await post(PORTAL ? `/api/portal/${PORTAL}/videos/${v.id}/modif` : `/api/videos/${v.id}/modif`, { comment });
    b.closest('[data-card]').innerHTML = `<div class="done"><div class="ck">✎</div><b>Envoyé ${PORTAL ? 'à l’équipe' : 'à ' + v.monteur}</b><span class="muted small">Ta remarque est transmise au monteur</span></div>`;
  }, 1300)));
  app.querySelectorAll('[data-plan]').forEach((b) => (b.onclick = () => act(b, async () => {
    const at = new Date(app.querySelector(`[data-pd="${b.dataset.plan}"]`).value).getTime();
    if (!at) throw new Error('Choisis une date');
    await post(`/api/videos/${b.dataset.plan}/plan`, { at }); toast(`📅 Planifiée le ${dFmt(new Date(at))}`);
  })));
  const ntgo = document.getElementById('ntgo'); if (ntgo) ntgo.onclick = () => act(ntgo, async () => {
    const date = new Date(document.getElementById('ntd').value).getTime(); if (!date) throw new Error('Choisis une date');
    await post('/api/tournages', { client_id: +document.getElementById('ntc').value, date, hours: +document.getElementById('nth').value || 2 }); toast('🎬 Tournage ajouté');
  });
  bindTeam(app);
  app.querySelectorAll('[data-ph]').forEach((b) => (b.onclick = () => { phase = b.dataset.ph; render(); }));
  const rp = document.getElementById('rep'); if (rp) rp.onclick = () => { showReport = !showReport; render(); if (showReport) setTimeout(() => document.getElementById('report')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100); };
  const sr = document.getElementById('sendrep'); if (sr) sr.onclick = () => act(sr, async () => { await post('/api/slack', { kind: 'rapport', text: `📊 Rapport de ${mName(month)} prêt pour *${vcOf()}* : ${location.origin}/c/${TOKENS[vcOf()]}` }); sr.textContent = 'Envoyé ✓'; toast(`📊 Lien du rapport de <b>${vcOf()}</b> envoyé sur Slack`); });
  const br = document.getElementById('brief'); if (br) br.onclick = () => act(br, async () => { const t = nextTourn(); await post('/api/slack', { kind: 'brief', text: `🎬 *Tournage ${t.id}* · ${t.client} · ${dFmt(t.date)} à ${t.date.getHours()} h · 📍 ${t.spot ? t.spot.n + ' (' + t.spot.q + ')' : 'lieu à confirmer'}\nScripts :\n${scriptsOf(t).map((v) => '• ' + v.title).join('\n')}` }); br.textContent = 'Brief envoyé ✓'; toast('🎬 Brief envoyé sur <b>Slack</b>'); });
  app.querySelectorAll('[data-tour]').forEach((e) => (e.onclick = () => toast(`🎬 ${e.dataset.tour} : voir le détail à droite`)));
  app.querySelectorAll('[data-book]').forEach((b) => (b.onclick = () => act(b, async () => {
    const sp = SPOTS[+b.dataset.book], t = TOURN.filter((x) => !x.spot && inC(x.client) && x.date >= TODAY).sort((a, c) => a.date - c.date)[0] ?? nextTourn();
    if (!t) throw new Error('Aucun tournage à venir');
    await post(`/api/tournages/${t.dbId}/spot`, { name: sp.n, place: sp.q, price: sp.p });
    toast(`📍 ${sp.n} réservé pour <b>${t.id}</b> · ${fmt(sp.p * t.hours)} ajoutés en compta et au planning`);
  })));
  const cl = document.getElementById('copylink'); if (cl) cl.onclick = () => { navigator.clipboard?.writeText(`${location.origin}/c/${TOKENS[vcOf()]}`); cl.textContent = 'Lien copié ✓'; toast('🔗 Lien client copié : envoie-le à ton client'); };
  app.querySelectorAll('[data-fb]').forEach((b) => (b.onclick = () => { const i = +b.dataset.fb; fbSel.has(i) ? fbSel.delete(i) : fbSel.add(i); b.classList.toggle('on'); b.style.background = fbSel.has(i) ? 'var(--ink)' : ''; b.style.color = fbSel.has(i) ? '#fff' : ''; const v = VIDS.find((x) => x.id === +document.getElementById('fbv').value); const p = document.getElementById('fbprev'); p.classList.toggle('muted', !fbSel.size); p.innerHTML = fbSel.size ? `Yo ${v.monteur} 👋 Retours sur « ${v.title} » :<br>${[...fbSel].map((k) => '• ' + FB[k]).join('<br>')}<br>Merci 🙏` : 'Clique sur des remarques…'; }));
  const fs = document.getElementById('fbsend'); if (fs) fs.onclick = () => act(fs, async () => { if (!fbSel.size) throw new Error('Choisis au moins une remarque'); await post('/api/slack', { kind: 'feedback', text: document.getElementById('fbprev').innerText }); fs.textContent = 'Envoyé sur Slack ✓'; fbSel = new Set(); });
  const ms = document.getElementById('month'); if (ms) ms.onchange = () => { month = ms.value; render(); };
  const rs = document.getElementById('rate'); if (rs) rs.onchange = () => { rate = +rs.value; render(); };
  app.querySelectorAll('[data-cat]').forEach((s) => (s.onchange = () => act(s, () => post(`/api/tx/${s.dataset.cat}`, { cat: s.value }))));
  app.querySelectorAll('[data-remind]').forEach((b) => (b.onclick = () => act(b, async () => { const c = b.dataset.remind; await post(`/api/clients/${CIDS[c]}/remind-invoice`, { month: mName(month), amount: CLIENTS[c] }); toast(`🧾 E-mail de relance envoyé à <b>${esc(c)}</b>`); })));
  app.querySelectorAll('[data-pay]').forEach((b) => (b.onclick = () => { navigator.clipboard?.writeText(`Virement ${b.dataset.pay} : ${b.dataset.left} €`); b.textContent = 'Copié ✓ · à coller dans Qonto'; }));
  app.querySelectorAll('[data-inv]').forEach((b) => (b.onclick = () => { const [c, n, a] = b.dataset.inv.split('|'); const w = document.getElementById('invwrap'); w.innerHTML = invoice(c, n, +a); w.scrollIntoView({ behavior: 'smooth' }); }));
  const ex = document.getElementById('export'); if (ex) ex.onclick = () => { const rows = [['Date', 'Libellé', 'Catégorie', 'Qui', 'Montant'], ...stats(month).tx.map((t) => [t.date, t.label, CAT[t.cat], t.who ?? '', String(t.amount).replace('.', ',')])]; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.map((r) => r.map((v) => `"${v}"`).join(';')).join('\n')], { type: 'text/csv' })); a.download = `compta-${month}.csv`; a.click(); };
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = () => act(el, fn); };
  on('qgo', async () => { const r = await post('/api/qonto', { login: document.getElementById('qlog').value, secret: document.getElementById('qsec').value }); toast(`🏦 Qonto connecté : ${r.added} mouvement(s) importé(s)`); });
  on('qsync', async () => { const r = await post('/api/qonto/sync'); toast(`🏦 ${r.added} nouveau(x) mouvement(s)`); });
  on('qoff', () => post('/api/qonto/disconnect'));
  on('ggo', async () => { const r = await post('/api/calendar', { url: document.getElementById('gurl').value }); toast(`📅 Agenda relié : ${r.events} événement(s)`); });
  on('gsync', async () => { const r = await post('/api/calendar/sync'); toast(`📅 ${r.events} événement(s)`); });
  on('goff', () => post('/api/calendar/disconnect'));
  const ngo = document.getElementById('ngo'); if (ngo) ngo.onclick = () => act(ngo, async () => { const r = await post('/api/notion/token', { token: document.getElementById('ntok').value }); toast(`✅ Notion connecté : ${r.bases} base(s), ${r.created} vidéo(s)`); });
  const nsync = document.getElementById('nsync'); if (nsync) nsync.onclick = () => act(nsync, async () => { const r = await post('/api/notion/sync'); toast(`🔄 ${r.created} nouvelle(s), ${r.updated} mise(s) à jour`); });
  const noff = document.getElementById('noff'); if (noff) noff.onclick = () => act(noff, () => post('/api/notion/disconnect'));
  const csv = document.getElementById('csv'); if (csv) csv.onchange = async () => { const f = csv.files[0]; if (!f) return; const out = document.getElementById('csvres'); out.textContent = 'Import…';
    try { const r = await fetch('/api/import', { method: 'POST', body: await f.text() }); const j = await r.json(); if (!r.ok) throw new Error(j.error); load(j.state); out.innerHTML = `✅ <b>${j.added} nouvelles opérations</b> rangées (${j.total - j.added} déjà présentes).`; setTimeout(() => { sub = 'resume'; render(); }, 1400); } catch (err) { out.textContent = '❌ ' + err.message; } };
  const sd = document.getElementById('spfile'); if (sd) sd.onchange = () => { const f = sd.files[0]; if (!f) return; if (f.type.startsWith('image/')) { const r = new FileReader(); r.onload = () => { spotImg = r.result; render(); }; r.readAsDataURL(f); } else document.getElementById('spdrop').innerHTML = `🎞 <b>${f.name}</b><br><span class="small">vidéo reçue</span>`; };
app.querySelectorAll('[data-sp]').forEach((b) => (b.onclick = () => { const q = `${document.getElementById('spq').value} ${document.getElementById('spv').value}`.trim(); open(b.dataset.sp === 'peerspace' ? `https://www.google.com/search?q=${encodeURIComponent('site:peerspace.com ' + q)}` : `https://www.google.com/search?q=${encodeURIComponent('location studio tournage ' + q)}`, '_blank', 'noopener'); }));
  const sps = document.getElementById('spsave'); if (sps) sps.onclick = () => act(sps, async () => {
    const name = document.getElementById('spn').value.trim(), price = +document.getElementById('spp').value; if (!name || !price) throw new Error('Nom et prix à l’heure');
    await post(`/api/tournages/${document.getElementById('spt').value}/spot`, { name, place: document.getElementById('spa').value.trim(), price }); toast(`📍 ${esc(name)} enregistré · ajouté en compta`);
  });
}
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/'; throw new Error('Connecte-toi'); }
  if (!r.ok) throw new Error(j.error || 'Erreur');
  if (j && (j.videos || j.state)) load(j.state ?? j);
  return j;
}
/** Lance une action : bouton désactivé pendant l'appel, message d'erreur lisible, puis réaffichage. */
async function act(el, fn, delay = 0) {
  if (el) el.disabled = true;
  try { await fn(); setTimeout(render, delay); } catch (e) { toast('❌ ' + e.message); if (el) el.disabled = false; }
}
async function boot() {
  try {
    const r = await fetch(PORTAL ? `/api/portal/${PORTAL}` : '/api/state');
    if (r.status === 401) { location.href = '/'; return; }
    const st = await r.json(); if (!r.ok) throw new Error(st.error || 'Erreur');
    load(st);
    if (PORTAL) { document.body.classList.add('portal'); page = 'client'; cf = st.client.name; }
    render();
  } catch (e) { document.getElementById('app').innerHTML = `<div class="card"><b>Impossible de charger le hub</b><p class="muted">${e.message}</p></div>`; }
}
boot();
</script>
