<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Suivi des clippers</title>
<style>
  :root {
    --bg: #f6f6f8; --panel: #ffffff; --text: #16161d; --muted: #6b6b7b; --border: #e4e4ea;
    --accent: #6d4aff; --up: #0f9d58; --down: #d93025; --flat: #8a8a99;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f14; --panel: #17171f; --text: #ededf2; --muted: #9a9aab; --border: #2a2a36;
      --accent: #9b85ff; --up: #3ecf8e; --down: #ff6b5e; --flat: #77778a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .tabs { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  tr:last-child td { border-bottom: 0; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
  .partial { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--panel); color: var(--text);
    width: min(720px, calc(100vw - 32px)); padding: 20px; }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .detail-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .spark { width: 100%; height: 90px; margin: 12px 0; }
  .spark path { fill: none; stroke: var(--accent); stroke-width: 2; }
  .spark .area { fill: color-mix(in srgb, var(--accent) 15%, transparent); stroke: none; }
  .accounts td, .accounts th { padding: 8px 10px; }
  .err { color: var(--down); font-size: 12px; }
  a { color: var(--accent); }
  .status { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
    margin-bottom: 16px; font-size: 14px; overflow-wrap: anywhere; }
  .status .line { margin: 2px 0; }
  .status .warn { color: var(--down); }
  .status details { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .status details li { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Suivi des clippers</h1>
  <p class="sub" id="updated">Chargement…</p>

  <section class="status" id="status" aria-live="polite"></section>

  <div class="controls">
    <select id="client" aria-label="Client"><option value="">Tous les clients</option></select>
    <div class="tabs" role="group" aria-label="Période">
      <button data-window="24h">24 h</button>
      <button data-window="7d">7 jours</button>
      <button data-window="30d">30 jours</button>
    </div>
  </div>

  <section class="kpis" id="kpis"></section>

  <div class="card">
    <table>
      <thead><tr>
        <th>#</th><th>Clipper</th><th>Vues période</th><th>Période d'avant</th><th>Évolution</th><th>Comptes</th><th id="rewardHead">Rémunération</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<dialog id="detail"></dialog>

<script>
const state = { window: '7d', client: '' };
try { Object.assign(state, JSON.parse(localStorage.getItem('dashboard') || '{}')); } catch {}

const fmt = (n) => n.toLocaleString('fr-FR');
const euros = (c) => (c / 100).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const arrow = { up: '▲', down: '▼', flat: '–' };

function evolution(c) {
  const pct = c.deltaPercent === null ? (c.current > 0 ? 'nouveau' : '—') : `${c.deltaPercent > 0 ? '+' : ''}${Math.round(c.deltaPercent)} %`;
  const partial = c.complete ? '' : '<span class="partial" title="Suivi commencé récemment : comparaison partielle">partiel</span>';
  return `<span class="${c.trend}">${arrow[c.trend]} ${pct}</span>${partial}`;
}

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error((await res.json()).error || res.statusText);
  return res.json();
}

const ago = (t) => {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : `il y a ${Math.round(m / 60)} h`;
};

async function renderStatus() {
  const s = await api('/api/status');
  const b = s.bot;
  const state = {
    ready: `🟢 Bot connecté${b.tag ? ` (${esc(b.tag)})` : ''}${b.guilds != null ? ` sur ${b.guilds} serveur(s)` : ''}`,
    connecting: '🟡 Bot en cours de connexion…',
    error: `🔴 Bot hors service : ${esc(b.error)}`,
    disabled: '⚪ Bot désactivé (DISCORD_TOKEN manquant)',
  }[b.state];
  const lines = [`<div class="line">${state}</div>`];
  if (b.state === 'ready' && b.messageContent === false) {
    lines.push('<div class="line warn">⚠️ « Message Content Intent » désactivé dans le Developer Portal Discord : le bot ne peut pas lire les liens du salon COMPTES.</div>');
  }
  if (b.commandsRegistered) lines.push(`<div class="line">✅ ${esc(b.commandsRegistered)}</div>`);
  if (b.lastCommand) {
    const c = b.lastCommand;
    lines.push(`<div class="line${c.ok ? '' : ' warn'}">Dernière commande : /${esc(c.name)} ${ago(c.at)} ${c.ok ? '✅' : `❌ ${esc(c.error)}`}</div>`);
  }
  if (s.lastErrors.length) {
    lines.push(`<details><summary>${s.lastErrors.length} erreur(s) récente(s)</summary><ul>${
      s.lastErrors.map((e) => `<li>${ago(e.at)} : ${esc(e.message)}</li>`).join('')}</ul></details>`);
  }
  document.getElementById('status').innerHTML = lines.join('');
}

async function loadClients() {
  const clients = await api('/api/clients');
  const sel = document.getElementById('client');
  for (const c of clients) sel.insertAdjacentHTML('beforeend', `<option value="${esc(c.slug)}">${esc(c.name)}</option>`);
  sel.value = clients.some((c) => c.slug === state.client) ? state.client : '';
  state.client = sel.value;
}

async function render() {
  try { localStorage.setItem('dashboard', JSON.stringify(state)); } catch {}
  document.querySelectorAll('[data-window]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.window === state.window));
  const q = new URLSearchParams({ window: state.window, ...(state.client && { client: state.client }) });
  const data = await api('/api/leaderboard?' + q);
  const showReward = !!data.client;
  document.getElementById('rewardHead').hidden = !showReward;

  const total = data.rows.reduce((a, r) => a + r.current, 0);
  const prev = data.rows.reduce((a, r) => a + r.previous, 0);
  const active = data.rows.filter((r) => r.current > 0).length;
  const rewards = data.rows.reduce((a, r) => a + (r.rewardCents || 0), 0);
  const pct = prev > 0 ? Math.round(((total - prev) / prev) * 100) : null;
  document.getElementById('kpis').innerHTML = [
    ['Vues sur la période', fmt(total)],
    ['vs période d\'avant', pct === null ? '—' : `<span class="${pct >= 0 ? 'up' : 'down'}">${pct > 0 ? '+' : ''}${pct} %</span>`],
    ['Clippers actifs', `${active} / ${data.rows.length}`],
    ...(showReward ? [['À verser (estim.)', euros(rewards)]] : []),
  ].map(([l, v]) => `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');

  document.getElementById('rows').innerHTML = data.rows.length
    ? data.rows.map((r, i) => `<tr data-id="${r.clipperId}">
        <td>${i + 1}</td><td>${esc(r.username)}</td>
        <td><strong>${fmt(r.current)}</strong></td><td>${fmt(r.previous)}</td>
        <td>${evolution(r)}</td><td>${r.accounts}</td>
        ${showReward ? `<td>${euros(r.rewardCents)}</td>` : ''}
      </tr>`).join('')
    : '<tr><td colspan="7" class="empty">Aucun compte suivi pour l\'instant.</td></tr>';

  document.getElementById('updated').textContent = `Mis à jour ${new Date(data.generatedAt).toLocaleString('fr-FR')}`;
}

function sparkline(values) {
  const w = 600, h = 90, max = Math.max(1, ...values);
  const pts = values.map((v, i) => [(i / Math.max(1, values.length - 1)) * w, h - 4 - (Math.max(0, v) / max) * (h - 8)]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Vues gagnées par jour sur 30 jours">
    <path class="area" d="${line}L${w},${h}L0,${h}Z"/><path d="${line}"/></svg>`;
}

async function openDetail(id) {
  const d = await api('/api/clippers/' + id);
  const dlg = document.getElementById('detail');
  const last = d.lastPostAt ? new Date(d.lastPostAt).toLocaleDateString('fr-FR') : 'jamais';
  dlg.innerHTML = `
    <div class="detail-head">
      <div><h2 style="margin:0">${esc(d.clipper.username)}</h2>
      <div class="sub" style="margin:0">Dernier post : ${last}</div></div>
      <button onclick="this.closest('dialog').close()">Fermer</button>
    </div>
    <div class="kpis" style="margin-top:16px">
      ${[['24h', '24 h'], ['7d', '7 jours'], ['30d', '30 jours']].map(([k, l]) => `
        <div class="kpi"><div class="label">${l}</div><div class="value">${fmt(d.windows[k].current)}</div>${evolution(d.windows[k])}</div>`).join('')}
    </div>
    <div class="label sub" style="margin:0">Vues gagnées par jour (30 j)</div>
    ${sparkline(d.daily)}
    <table class="accounts">
      <thead><tr><th>Plateforme</th><th>Compte</th><th>24 h</th><th>7 j</th><th>30 j</th></tr></thead>
      <tbody>${d.accounts.map((a) => `<tr>
        <td>${esc(a.platform)}</td>
        <td><a href="${esc(a.url)}" target="_blank" rel="noopener">@${esc(a.handle)}</a>${a.lastError ? `<div class="err">${esc(a.lastError)}</div>` : ''}</td>
        <td>${fmt(a.windows['24h'].current)}</td><td>${fmt(a.windows['7d'].current)}</td><td>${fmt(a.windows['30d'].current)}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  dlg.showModal();
}

document.querySelectorAll('[data-window]').forEach((b) => b.addEventListener('click', () => { state.window = b.dataset.window; render(); }));
document.getElementById('client').addEventListener('change', (e) => { state.client = e.target.value; render(); });
document.getElementById('rows').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-id]');
  if (tr) openDetail(tr.dataset.id).catch(alert);
});

renderStatus().catch(() => {});
loadClients().then(render).catch((e) => { document.getElementById('updated').textContent = 'Erreur : ' + e.message; });
setInterval(() => { render().catch(() => {}); renderStatus().catch(() => {}); }, 30_000);
</script>
</body>
</html>
