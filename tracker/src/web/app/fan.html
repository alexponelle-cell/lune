<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAFAF7">
<title>BeOne Rewards</title>
<link rel="icon" href="/fan/assets/beone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7; --card: #ffffff; --soft: #f2f1ea; --soft-2: #eae8df;
    --ink: #111111; --muted: #6e6c66; --faint: #a9a79f;
    --yellow: #ffd83d; --yellow-deep: #f5c400; --yellow-soft: #fff4c2;
    --purple: #8064ff; --purple-deep: #6446f0; --purple-soft: #ece8ff;
    --green: #1fbf6a; --green-soft: #dcf7e8; --red: #f0445c;
    --shadow: 0 2px 6px rgba(17,17,17,.04), 0 12px 32px rgba(17,17,17,.07);
    --shadow-lg: 0 4px 10px rgba(17,17,17,.05), 0 24px 60px rgba(17,17,17,.12);
    --title: 'Outfit', 'Inter', system-ui, sans-serif;
    --r: 28px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; padding-bottom: env(safe-area-inset-bottom); }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font: inherit; color: inherit; }
  ::selection { background: var(--yellow); }

  /* ---------- Nav ---------- */
  .top { position: sticky; top: 0; z-index: 40; background: rgba(250,250,247,.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px; }
  .logo { display: flex; align-items: center; gap: 10px; font: 900 20px/1 var(--title); letter-spacing: -.01em; white-space: nowrap; }
  .logo .coin { width: 34px; height: 34px; }
  .menu { display: flex; gap: 6px; }
  .menu a { padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 15px; color: var(--muted); transition: background .2s, color .2s; }
  .menu a:hover { color: var(--ink); background: var(--soft); }
  .menu a.on { color: var(--ink); background: var(--yellow); }
  .tabbar { display: none; }
  @media (max-width: 880px) {
    .menu { display: none; }
    .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 45;
      background: var(--ink); border-radius: 24px; padding: 8px; box-shadow: var(--shadow-lg); }
    .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 16px; color: #bdbbb3; font-size: 11px; font-weight: 700; }
    .tabbar a span { font-size: 22px; line-height: 1; }
    .tabbar a.on { background: var(--yellow); color: var(--ink); }
    body { padding-bottom: 96px; }
  }

  /* ---------- Coins ---------- */
  .coin { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -.2em; flex: none; }
  .coin-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--yellow); padding: 8px 14px 8px 8px; border-radius: 99px; font: 900 16px/1 var(--title); box-shadow: 0 4px 0 var(--yellow-deep); transition: transform .15s; }
  .coin-pill .coin { width: 26px; height: 26px; }
  .coin-pill:hover { transform: translateY(-2px); }
  .coin-pill small { font: 800 11px Inter, sans-serif; letter-spacing: .06em; }

  /* ---------- Boutons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 18px; padding: 16px 26px; cursor: pointer;
    font: 900 16px/1 var(--title); letter-spacing: .02em; text-transform: uppercase; background: var(--ink); color: #fff;
    box-shadow: 0 5px 0 #000; transition: transform .12s, box-shadow .12s, filter .2s; white-space: nowrap; user-select: none; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #000; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
  .btn.yellow { background: var(--yellow); color: var(--ink); box-shadow: 0 5px 0 var(--yellow-deep); }
  .btn.yellow:hover { box-shadow: 0 7px 0 var(--yellow-deep); }
  .btn.yellow:active { box-shadow: 0 1px 0 var(--yellow-deep); }
  .btn.purple { background: var(--purple); box-shadow: 0 5px 0 var(--purple-deep); }
  .btn.purple:hover { box-shadow: 0 7px 0 var(--purple-deep); }
  .btn.white { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--soft-2); }
  .btn.discord { background: #5865f2; box-shadow: 0 5px 0 #3c45b8; text-transform: none; font-size: 16px; }
  .btn.big { padding: 20px 32px; font-size: 18px; border-radius: 22px; }
  .btn.small { padding: 11px 16px; font-size: 13px; border-radius: 14px; box-shadow: 0 3px 0 #000; }
  .btn.small.white { box-shadow: 0 3px 0 var(--soft-2); }
  .btn.full { width: 100%; }
  .btn:disabled { background: var(--soft-2); color: var(--faint); box-shadow: none; cursor: not-allowed; transform: none; }

  /* ---------- Mise en page ---------- */
  main { max-width: 1240px; margin: 0 auto; padding: 10px 20px 60px; }
  .page { animation: pageIn .35s ease; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } }
  section { margin: 72px 0; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font: 800 13px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--purple); }
  h1, h2, h3 { font-family: var(--title); margin: 0; letter-spacing: -.02em; }
  h2 { font-size: clamp(34px, 5vw, 56px); font-weight: 900; line-height: 1; margin: 10px 0 12px; text-transform: uppercase; }
  .sub { color: var(--muted); font-size: 18px; margin: 0; max-width: 620px; }
  .head-row { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }
  .wiggle { transition: transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .25s; }
  .wiggle:hover { transform: translateY(-6px) rotate(-.6deg); box-shadow: var(--shadow-lg); }

  /* ---------- Hero ---------- */
  .hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; margin-top: 30px; }
  .hero h1 { font-size: clamp(46px, 6.6vw, 94px); font-weight: 900; line-height: .92; text-transform: uppercase; margin: 16px 0 22px; }
  .hero h1 .hl { background: var(--yellow); padding: 0 .12em; border-radius: .14em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hero p { font-size: 20px; color: var(--muted); margin: 0 0 32px; max-width: 520px; }
  .hero .ctas { display: flex; gap: 14px; flex-wrap: wrap; }
  .brand-tag { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: #fff; padding: 8px 14px 8px 8px; border-radius: 99px; font: 800 14px var(--title); letter-spacing: .04em; }
  .brand-tag .coin { width: 24px; height: 24px; }
  .stage { position: relative; aspect-ratio: 1 / 1; border-radius: 40px; background: radial-gradient(circle at 50% 42%, #ffe98a, var(--yellow) 60%); overflow: hidden; box-shadow: var(--shadow-lg); }
  .stage .bg-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .9; }
  .stage .rays { position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.28) 0 10deg, transparent 10deg 30deg); animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stage .beone { position: absolute; left: 21%; top: 19%; width: 58%; }
  .float { position: absolute; animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-14px) rotate(6deg); } }
  .float.c1 { top: 10%; left: 9%; width: 16%; }
  .float.c2 { top: 20%; right: 10%; width: 12%; animation-delay: -1.1s; }
  .float.c3 { bottom: 30%; left: 6%; width: 10%; animation-delay: -2s; }
  .pop-card { position: absolute; right: 5%; bottom: 12%; background: #fff; border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow-lg); font: 900 15px var(--title); display: grid; gap: 2px; animation: float 4s ease-in-out infinite; animation-delay: -.6s; }
  .pop-card small { font: 800 11px Inter, sans-serif; color: var(--purple); letter-spacing: .1em; }
  .plus { position: absolute; top: 9%; right: 30%; background: var(--green); color: #fff; font: 900 17px var(--title); padding: 8px 14px; border-radius: 99px; box-shadow: 0 4px 0 #14924f; animation: pop 2.6s ease-in-out infinite; }
  @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12) rotate(-4deg); } }
  @media (max-width: 880px) { .hero { grid-template-columns: 1fr; gap: 28px; margin-top: 10px; } .stage { max-width: 460px; width: 100%; margin: 0 auto; } }

  /* ---------- Parcours ---------- */
  .flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .flow .card { padding: 26px 22px; position: relative; }
  .flow .emo { font-size: 44px; line-height: 1; }
  .flow b { display: block; font: 900 22px/1.1 var(--title); text-transform: uppercase; margin-top: 16px; }
  .flow small { color: var(--muted); font-size: 14px; }
  .flow .card:nth-child(1) { background: var(--purple-soft); }
  .flow .card:nth-child(3) { background: var(--yellow); }
  .flow .card:not(:last-child)::after { content: '→'; position: absolute; right: -14px; top: 50%; transform: translateY(-50%); z-index: 2; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 900; }
  @media (max-width: 880px) { .flow { grid-template-columns: 1fr 1fr; } .flow .card::after { display: none; } }

  /* ---------- Récompenses ---------- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .chip { border: 0; background: var(--card); box-shadow: var(--shadow); padding: 11px 18px; border-radius: 99px; font: 800 15px var(--title); cursor: pointer; transition: transform .15s, background .2s; }
  .chip:hover { transform: translateY(-2px); }
  .chip.on { background: var(--ink); color: #fff; }
  .rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
  .reward { padding: 12px; display: flex; flex-direction: column; min-width: 0; }
  .reward .pic { aspect-ratio: 1 / 1; border-radius: 22px; display: grid; place-items: center; font-size: clamp(72px, 9vw, 110px); position: relative; overflow: hidden; }
  .reward .pic img { width: 100%; height: 100%; object-fit: cover; }
  .reward .pic .emo { transition: transform .35s cubic-bezier(.3,1.6,.5,1); filter: drop-shadow(0 12px 16px rgba(0,0,0,.15)); }
  .reward:hover .pic .emo { transform: scale(1.12) rotate(-6deg); }
  .reward .tag { position: absolute; top: 12px; left: 12px; background: #fff; border-radius: 99px; padding: 6px 12px; font: 800 12px Inter, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  .reward .tag.limited { left: auto; right: 12px; background: var(--red); color: #fff; }
  .reward .body { padding: 16px 8px 8px; display: grid; gap: 10px; }
  .reward .name { font: 900 22px/1.1 var(--title); text-transform: uppercase; }
  .reward .desc { color: var(--muted); font-size: 14px; margin-top: -4px; }
  .price { display: inline-flex; align-items: center; gap: 8px; font: 900 26px/1 var(--title); }
  .price .coin { width: 30px; height: 30px; }
  .afford { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
  .afford i { display: block; height: 100%; border-radius: inherit; background: var(--yellow); transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .afford-txt { font-size: 13px; font-weight: 700; color: var(--muted); }
  .bg-y { background: var(--yellow-soft); } .bg-p { background: var(--purple-soft); } .bg-g { background: #e3f6ff; } .bg-o { background: #ffe6dc; }

  /* ---------- Classement ---------- */
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 14px; align-items: end; max-width: 820px; margin: 0 auto 26px; }
  .podium .spot { text-align: center; display: grid; justify-items: center; gap: 8px; min-width: 0; }
  .podium .ava { width: 78px; height: 78px; }
  .podium .first .ava { width: 100px; height: 100px; }
  .podium .name { font: 900 17px var(--title); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium .block { width: 100%; border-radius: 22px 22px 10px 10px; display: grid; place-items: center; font-size: 40px; padding: 14px 6px; box-shadow: var(--shadow); }
  .podium .block small { display: block; font: 800 13px Inter, sans-serif; }
  .podium .first .block { height: 170px; background: var(--yellow); }
  .podium .second .block { height: 130px; background: #e9e9ef; }
  .podium .third .block { height: 105px; background: #f6dcc6; }
  .ranks { display: grid; gap: 10px; max-width: 820px; margin: 0 auto; }
  .rank-row { display: grid; grid-template-columns: 44px 48px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 18px 12px 12px; }
  .rank-row .n { font: 900 20px var(--title); text-align: center; color: var(--muted); }
  .rank-row .who { min-width: 0; } .rank-row .who b { display: block; font: 800 17px var(--title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-row .who small { color: var(--muted); font-weight: 600; }
  .rank-row.me { outline: 3px solid var(--purple); }
  .ava { width: 48px; height: 48px; border-radius: 16px; object-fit: cover; display: grid; place-items: center; font: 900 20px var(--title); color: #fff; flex: none; overflow: hidden; }
  .ava img { width: 100%; height: 100%; object-fit: cover; }

  /* ---------- Clipper ---------- */
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .steps .card { padding: 24px; text-align: center; }
  .steps .n { width: 44px; height: 44px; border-radius: 14px; margin: 0 auto 12px; background: var(--ink); color: #fff; display: grid; place-items: center; font: 900 20px var(--title); }
  .steps .emo { font-size: 46px; line-height: 1.1; }
  .steps b { display: block; font: 900 19px var(--title); text-transform: uppercase; margin-top: 10px; }
  @media (max-width: 880px) { .steps { grid-template-columns: 1fr 1fr; } }
  .send { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; padding: 30px; margin-top: 18px; background: var(--purple); color: #fff; }
  .send .mascot { width: 150px; }
  .send h3 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 900; text-transform: uppercase; line-height: 1; }
  .send p { opacity: .85; margin: 8px 0 18px; }
  @media (max-width: 700px) { .send { grid-template-columns: 1fr; text-align: center; } .send .mascot { width: 120px; margin: 0 auto; } }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .clip { overflow: hidden; }
  .clip .th { aspect-ratio: 9 / 12; background: linear-gradient(160deg, var(--purple-soft), var(--yellow-soft)); position: relative; display: grid; place-items: center; font-size: 48px; }
  .clip .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .clip .earn { position: absolute; right: 10px; bottom: 10px; background: var(--green); color: #fff; font: 900 15px var(--title); padding: 6px 12px; border-radius: 99px; box-shadow: 0 3px 0 #14924f; display: inline-flex; gap: 6px; align-items: center; }
  .clip .pf { position: absolute; left: 10px; top: 10px; background: #fff; border-radius: 99px; padding: 5px 10px; font: 800 12px Inter, sans-serif; }
  .clip .meta { padding: 12px 14px 14px; }
  .clip .meta b { display: block; font: 800 15px var(--title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .meta small { color: var(--muted); font-weight: 700; }
  .accounts { display: flex; gap: 8px; flex-wrap: wrap; }
  .acc { display: inline-flex; align-items: center; gap: 8px; background: var(--card); box-shadow: var(--shadow); border-radius: 99px; padding: 8px 8px 8px 14px; font-weight: 700; font-size: 14px; }
  .acc button { border: 0; background: var(--soft); border-radius: 99px; width: 26px; height: 26px; cursor: pointer; font-weight: 900; }

  /* ---------- Profil ---------- */
  .profile { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 880px) { .profile { grid-template-columns: 1fr; } }
  .id-card { padding: 28px; text-align: center; background: var(--ink); color: #fff; }
  .id-card .ava { width: 110px; height: 110px; border-radius: 32px; margin: 0 auto 14px; font-size: 44px; border: 5px solid var(--yellow); }
  .id-card h3 { font-size: 28px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .level { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; background: var(--yellow); color: var(--ink); padding: 8px 16px; border-radius: 99px; font: 900 16px var(--title); }
  .lvl-bar { margin-top: 22px; text-align: left; }
  .lvl-bar .track { height: 14px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; margin: 8px 0 6px; }
  .lvl-bar .track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--purple), var(--yellow)); border-radius: inherit; transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
  .lvl-bar small { color: #bdbbb3; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { padding: 20px; min-width: 0; }
  .stat .v { font: 900 clamp(26px, 3vw, 36px)/1.1 var(--title); margin-top: 6px; overflow-wrap: anywhere; }
  .stat small { color: var(--muted); font-weight: 700; }
  .stat.coins { background: var(--yellow); }
  .stat.coins small { color: var(--ink); }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr 1fr; } }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
  .badge { padding: 16px 10px; text-align: center; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); }
  .badge .e { font-size: 38px; line-height: 1.1; }
  .badge b { display: block; font: 800 13px/1.2 var(--title); margin-top: 6px; }
  .badge.off { background: var(--soft); box-shadow: none; }
  .badge.off .e { filter: grayscale(1); opacity: .3; }
  .badge.off b { color: var(--faint); }
  .panel { padding: 24px; }
  .panel h3 { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
  .panel p { color: var(--muted); margin: 0 0 16px; }
  .row { display: flex; gap: 10px; }
  .row > * { min-width: 0; }
  input, textarea { width: 100%; font: 600 16px Inter, sans-serif; color: var(--ink); background: var(--soft); border: 3px solid transparent; border-radius: 16px; padding: 14px 16px; outline: none; transition: border-color .2s, background .2s; }
  input:focus, textarea:focus { border-color: var(--purple); background: #fff; }
  .row input { flex: 1; width: auto; }
  .list-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-top: 2px solid var(--soft); font-weight: 700; }
  .list-row:first-of-type { border-top: 0; }
  .st { font: 800 12px Inter, sans-serif; padding: 5px 10px; border-radius: 99px; white-space: nowrap; }
  .st.pending { background: var(--yellow-soft); } .st.delivered { background: var(--green-soft); color: #0e7a42; } .st.refunded { background: var(--soft); color: var(--muted); }

  /* ---------- Bandeaux ---------- */
  .banner { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 34px 38px; border-radius: 36px; background: var(--ink); color: #fff; overflow: hidden; position: relative; }
  .banner.city { grid-template-columns: minmax(0, 560px); min-height: 320px; background: linear-gradient(90deg, rgba(8,8,20,.92) 0%, rgba(8,8,20,.7) 45%, rgba(8,8,20,0) 75%), #111 url(/fan/assets/banner.jpg) 65% center / cover; }
  @media (max-width: 700px) { .banner.city { background: linear-gradient(180deg, rgba(8,8,20,.35), rgba(8,8,20,.92) 60%), #111 url(/fan/assets/banner.jpg) 66% center / cover; min-height: 380px; align-content: end; } }
  .banner h3 { font-size: clamp(30px, 4vw, 48px); font-weight: 900; text-transform: uppercase; line-height: 1; }
  .banner p { color: #bdbbb3; margin: 10px 0 20px; font-size: 17px; }
  .banner .mascot { width: 170px; }
  @media (max-width: 700px) { .banner { grid-template-columns: 1fr; text-align: center; padding: 30px 22px; } .banner .mascot { width: 130px; margin: 0 auto; grid-row: 1; } }
  .login { padding: 40px 26px; text-align: center; display: grid; justify-items: center; gap: 10px; }
  .login .mascot { width: 150px; }
  .login h3 { font-size: 30px; font-weight: 900; text-transform: uppercase; }
  .login p { color: var(--muted); margin: 0 0 12px; max-width: 420px; }
  .empty { padding: 36px; text-align: center; color: var(--muted); font-weight: 600; }
  .empty .e { font-size: 46px; }
  .wallet-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 22px; margin-bottom: 22px; background: var(--yellow); border-radius: 26px; }
  .wallet-bar .big-coins { display: flex; align-items: center; gap: 12px; font: 900 clamp(30px, 4vw, 44px)/1 var(--title); }
  .wallet-bar .big-coins .coin { width: 52px; height: 52px; }
  .wallet-bar small { font: 800 12px Inter, sans-serif; letter-spacing: .08em; }

  footer { max-width: 1240px; margin: 0 auto; padding: 30px 20px 50px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  /* ---------- Modale, toasts, effets ---------- */

<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/"><span class="coinslot"></span><span>BEONE REWARDS</span></a>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmt = (n) => Number(n).toLocaleString('fr-FR');
const compact = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '').replace('.', ',') + ' M' : n >= 1e4 ? Math.round(n / 1e3) + ' k' : fmt(n);

];
const levelOf = (views) => { let i = 0; LEVELS.forEach((l, k) => { if (views >= l.min) i = k; }); return i; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// ---------- Visuels : pièce et mascotte ----------
let coinN = 0;
function coin(cls = 'coin') {

function mascot(prop = 'coins', cls = 'mascot') {

let PUB = null, ME = null;
async function api(path, opts = {}) {

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error ?? `Erreur ${res.status}`), { status: res.status });

async function loadMe() { try { ME = await api('/api/fan/me'); } catch { ME = null; } }

// ---------- Effets ----------
function toast(msg, kind = '') {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg; document.body.append(t);

}
function countUp(el, to, format = fmt) {
  if (reduce || to === 0) { el.textContent = format(to); return; }
  const t0 = performance.now(), dur = 1200;
  const step = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = format(Math.round(to * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function coinRain(n = 18) {
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'fx-coin'; d.innerHTML = coin('coin');

  }
}
function confetti() {
  if (reduce) return;
  const c = $('#confetti'), g = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#ffd83d', '#8064ff', '#1fbf6a', '#f0445c', '#2d9cdb'];
  const bits = Array.from({ length: 160 }, () => ({ x: innerWidth / 2, y: innerHeight * .55, vx: (Math.random() - .5) * 18, vy: -Math.random() * 18 - 6, s: Math.random() * 8 + 5, r: Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  const frame = (t) => {
    g.clearRect(0, 0, c.width, c.height);
    for (const b of bits) { b.vy += .5; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += .12; g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.fillStyle = b.c; g.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); g.restore(); }
    if (t - t0 < 2800) requestAnimationFrame(frame); else g.clearRect(0, 0, c.width, c.height);
  };
  requestAnimationFrame(frame);
}
function modal(html, onMount) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(bg);

  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('[data-close]')) close(); });

}
const io = new IntersectionObserver((es) => es.forEach((e) => {
  if (!e.isIntersecting) return;
  const el = e.target; el.classList.add('in');
  if (el.dataset.count !== undefined) countUp(el, Number(el.dataset.count), el.dataset.compact !== undefined ? compact : fmt);
  if (el.dataset.w !== undefined) el.style.width = el.dataset.w + '%';
  io.unobserve(el);
}), { threshold: .15 });
const observe = () => document.querySelectorAll('.reveal:not(.in), [data-count], [data-w]').forEach((el) => io.observe(el));

// ---------- Cadre ----------
const ROUTES = [['', 'Accueil', '🏠'], ['recompenses', 'Récompenses', '🎁'], ['clipper', 'Clipper', '🎬'], ['classement', 'Classement', '🏆'], ['profil', 'Profil', '👤']];

  return `<section>${head}${steps}
    <div class="card send reveal">${mascot('camera', 'mascot bob')}<div>${ME.accounts.length
      ? `<h3>Tes vues sont suivies 🚀</h3><p>Chaque clip posté sur ces comptes te rapporte des coins, automatiquement, plusieurs fois par jour.</p><div class="accounts">${ME.accounts.map((a) => `<span class="acc" style="padding:8px 14px">${PLATFORM[a.platform]} @${esc(a.handle)}</span>`).join('')}</div>`
      : `<h3>Presque prêt !</h3><p>L'équipe relie tes comptes TikTok, Insta ou YouTube à ton profil. Dès que c'est fait, chaque vue te rapporte des coins.</p>${PUB.discordInviteUrl ? `<a class="btn yellow big" href="${esc(PUB.discordInviteUrl)}" target="_blank" rel="noopener">Contacter l'équipe sur Discord</a>` : ''}`}</div></div>
  </section>
  <section>
    <div class="head-row reveal"><div><span class="eyebrow">📈 Tes clips</span><h2>Mes clips</h2></div><div class="coin-pill">${coin('coin')}${fmt(ME.clipCount)}<small>CLIPS</small></div></div>
    <div class="clips">${clips.map((c) => `<a class="card clip wiggle reveal" ${c.url ? `href="${esc(c.url)}" target="_blank" rel="noopener"` : ''}>
      <div class="th">${c.thumbnail ? `<img src="${esc(c.thumbnail)}" alt="" loading="lazy">` : '🎬'}<span class="pf">${PLATFORM[c.platform]}</span><span class="earn">+${fmt(c.coins)} ${coin('coin')}</span></div>
      <div class="meta"><b>${esc(c.title || 'Mon clip')}</b><small>👀 ${compact(c.views)} vues</small></div></a>`).join('')
      || '<div class="card empty reveal" style="grid-column:1/-1"><div class="e">📭</div>Pas encore de clip détecté. Tes clips apparaissent ici dès que tes comptes sont suivis.</div>'}</div>
  </section>`;
}
function podium(lb) {
  const spot = (r, cls, medal) => r ? `<div class="spot ${cls} reveal">${avatar(r.name, r.avatar)}<div class="name">${esc(r.name)}</div><div class="block"><div>${medal}<small>${compact(r.views)} vues</small><small>+${fmt(r.coins)} 🪙</small></div></div></div>` : '<div></div>';
  return `<div class="podium">${spot(lb[1], 'second', '🥈')}${spot(lb[0], 'first', '🥇')}${spot(lb[2], 'third', '🥉')}</div>`;
}
function pageRanking() {
  const lb = PUB.leaderboard;
  const myName = ME?.username;
  return `<section style="margin-top:34px">
    <div class="head-row reveal"><div><span class="eyebrow">🏆 7 derniers jours</span><h2>Classement</h2><p class="sub">Les clippeurs qui ont fait le plus de vues cette semaine.</p></div>${ME?.weekRank ? `<div class="coin-pill">🏅 Tu es #${ME.weekRank}</div>` : ''}</div>
    ${lb.length ? podium(lb) : '<div class="card empty reveal"><div class="e">🏁</div>Le classement démarre. Poste ton premier clip pour y apparaître !</div>'}
    <div class="ranks">${lb.slice(3).map((r) => `<div class="card rank-row reveal ${r.name === myName ? 'me' : ''}"><span class="n">#${r.rank}</span>${avatar(r.name, r.avatar)}<span class="who"><b>${esc(r.name)}</b><small>👀 ${compact(r.views)} vues</small></span><span class="price" style="font-size:20px">+${fmt(r.coins)} ${coin('coin')}</span></div>`).join('')}</div>
  </section>`;
}

function pageProfile() {
  if (!ME) return `<section style="margin-top:34px">${loginCard('Ton profil', 'Connecte-toi avec Discord pour voir tes coins, ton niveau et tes badges.', 'trophy')}</section>`;
  const li = levelOf(ME.views), lvl = LEVELS[li], next = LEVELS[li + 1];
  const pct = next ? Math.round(((ME.views - lvl.min) / (next.min - lvl.min)) * 100) : 100;
  const platforms = new Set(ME.accounts.map((a) => a.platform)).size;
  const delivered = ME.orders.filter((o) => o.status !== 'refunded').length;
  const badges = [
    ['🎬', 'Premier clip', ME.clipCount >= 1], ['💯', '10 clips', ME.clipCount >= 10], ['📱', 'Multi-plateforme', platforms >= 2],
    ['👀', '10k vues', ME.views >= 1e4], ['🚀', '100k vues', ME.views >= 1e5], ['💎', '1M vues', ME.views >= 1e6],
    ['🎮', 'Roblox relié', !!ME.roblox.userId], ['🛒', 'Premier échange', delivered >= 1], ['🏆', 'Top 3 semaine', !!ME.weekRank && ME.weekRank <= 3],
  ];
  return `<section style="margin-top:34px"><div class="profile">
    <div class="card id-card reveal">${avatar(ME.username, ME.avatar)}<h3>${esc(ME.username)}</h3><div class="level">${lvl.emoji} ${lvl.name}</div>
      <div class="lvl-bar">${next ? `<small>Prochain niveau : ${next.emoji} ${next.name}</small><div class="track"><i data-w="${Math.max(3, pct)}"></i></div><small>Encore ${compact(next.min - ME.views)} vues</small>` : '<small>Niveau maximum atteint 👑 Tu es dans le 1%.</small><div class="track"><i data-w="100"></i></div>'}</div>
      <div style="display:flex;gap:6px;justify-content:center;margin-top:18px;flex-wrap:wrap">${LEVELS.map((l, k) => `<span title="${l.name}" style="font-size:22px;opacity:${k <= li ? 1 : .25}">${l.emoji}</span>`).join('')}</div>
    </div>
    <div style="display:grid;gap:20px;min-width:0">
      <div class="stats">
        <div class="card stat coins reveal"><small>🪙 Coins</small><div class="v" data-count="${ME.balance}">0</div></div>
        <div class="card stat reveal"><small>👀 Vues</small><div class="v" data-count="${ME.views}" data-compact>0</div></div>
        <div class="card stat reveal"><small>🎬 Clips</small><div class="v" data-count="${ME.clipCount}">0</div></div>
        <div class="card stat reveal"><small>🏅 Semaine</small><div class="v">${ME.weekRank ? '#' + ME.weekRank : '—'}</div></div>
      </div>
      <div class="card panel reveal"><h3>Badges</h3><p>${badges.filter((b) => b[2]).length} / ${badges.length} débloqués</p>
        <div class="badges">${badges.map(([e, n, on]) => `<div class="badge ${on ? '' : 'off'}"><div class="e">${e}</div><b>${n}</b></div>`).join('')}</div></div>
      <div class="card panel reveal"><h3>🎮 Compte Roblox</h3><p>${ME.roblox.username ? `Relié à <b style="color:var(--ink)">${esc(ME.roblox.username)}</b> : tes récompenses arrivent dans le jeu.` : 'Relie-le pour recevoir tes récompenses dans le jeu.'}</p>
        <form class="row" id="roblox"><input name="username" placeholder="Ton pseudo Roblox" value="${esc(ME.roblox.username ?? '')}" required minlength="3" maxlength="20" autocomplete="off"><button class="btn purple">${ME.roblox.username ? 'Changer' : 'Relier'}</button></form></div>
      <div class="card panel reveal"><h3>📦 Mes échanges</h3>${ME.orders.length ? ME.orders.map((o) => `<div class="list-row"><span>${esc(o.itemName)} · ${fmt(o.price)} 🪙</span><span class="st ${o.status}">${STATUS[o.status]}</span></div>`).join('') : '<p style="margin:0">Aucun échange pour l\'instant. <a href="#/recompenses" style="color:var(--purple);font-weight:800">Voir les récompenses →</a></p>'}</div>
      <div><button class="btn white small" id="logout">Se déconnecter</button></div>
    </div></div></section>`;
}

// ---------- Routeur ----------
async function refresh() { await loadMe(); route(); }
function route() {
  const r = location.hash.replace(/^#\/?/, '').split('/')[0];
  const known = ROUTES.some(([k]) => k === r) ? r : '';
  renderChrome(known);
  const app = $('#app');
  app.innerHTML = `<div class="page">${{ '': pageHome, recompenses: pageShop, clipper: pageClip, classement: pageRanking, profil: pageProfile }[known]()}</div>`;
  observe();
  bindBuy(app);
  app.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { FILTER = b.dataset.f; route(); }));
  const rf = $('#roblox');
  if (rf) rf.onsubmit = async (e) => {
    e.preventDefault();
    try { const x = await api('/api/fan/roblox', { method: 'PUT', body: { username: new FormData(e.target).get('username') } }); toast(`Relié à ${x.username} ✅`, 'ok'); await refresh(); } catch (err) { toast(err.message, 'err'); }
  };
  $('#logout')?.addEventListener('click', async () => { await api('/fan/logout', { method: 'POST' }).catch(() => {}); ME = null; location.hash = '#/'; route(); });
}

/** Retour du joueur : coins gagnés depuis la dernière visite, passage de niveau. */
function celebrate() {
  if (!ME) return;
  const lastCoins = Number(store.get('bor_earned') ?? NaN), lastLevel = Number(store.get('bor_level') ?? NaN);
  const li = levelOf(ME.views);
  if (Number.isFinite(lastLevel) && li > lastLevel) {
    confetti(); coinRain(30);
    modal(`${mascot('trophy', 'mascot bob')}<h3>Niveau supérieur !</h3><p>Tu passes <b>${LEVELS[li].emoji} ${LEVELS[li].name}</b>. Continue comme ça !</p><div class="actions"><button class="btn yellow" data-close>Let's go 🔥</button></div>`);
  } else if (Number.isFinite(lastCoins) && ME.earned > lastCoins) {
    coinRain(Math.min(30, 8 + Math.round((ME.earned - lastCoins) / 20)));
    toast(`+${fmt(ME.earned - lastCoins)} coins depuis ta dernière visite 🎉`, 'ok');
  }
  store.set('bor_earned', String(ME.earned)); store.set('bor_level', String(li));
}

async function init() {
  $('#year').textContent = new Date().getFullYear();
  [PUB] = await Promise.all([api('/api/fan/public'), loadMe()]);
  addEventListener('hashchange', () => { route(); scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); });
  route();
  const error = new URLSearchParams(location.search).get('error');
  if (error) { toast(error, 'err'); history.replaceState(null, '', location.pathname + location.hash); }
  celebrate();
}
init().catch((err) => { $('#app').innerHTML = `<div class="card empty" style="margin-top:40px"><div class="e">😵</div>${esc(err.message)}</div>`; });
</script>
</body>
</html>
