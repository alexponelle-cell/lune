<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mars · Connexion</title>
<link rel="icon" href="/mars-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font: 15px/1.5 'Sora', system-ui, sans-serif; color: #FBEFEA;
    background: radial-gradient(ellipse at 50% 20%, #4A1A10 0%, #170907 55%, #0B0504 100%) fixed, #0B0504;
  }
  .card {
    width: min(380px, 100%); padding: 36px 30px 30px; border-radius: 22px; text-align: center;
    background: rgb(23 11 8 / .78); border: 1px solid #3A1E17; box-shadow: 0 30px 80px rgb(0 0 0 / .5), 0 0 0 1px rgb(255 90 54 / .05);
    backdrop-filter: blur(10px);
  }
  .logo { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 0 44px rgb(255 90 54 / .45); }
  h1 { margin: 16px 0 2px; font-size: 24px; font-weight: 800; letter-spacing: .02em; }
  p { margin: 0 0 24px; color: #D2B2A7; font-size: 13px; }
  input {
    width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid #3A1E17; background: #120806; color: #FBEFEA;
    font: inherit; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: #FF5A36; box-shadow: 0 0 0 3px rgb(255 90 54 / .2); }
  button {
    width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 12px; cursor: pointer;
    background: #FF5A36; color: #1A0500; font: 700 15px 'Sora', sans-serif; transition: background .15s, transform .1s;
  }
  button:hover { background: #FF7A5A; }
  button:active { transform: scale(.98); }
  .credit { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; align-items: center; gap: 8px; color: #8C6459; font-size: 12px; letter-spacing: .04em; }
  .credit img { width: 18px; height: 18px; border-radius: 50%; }
  .credit b { color: #D2B2A7; font-weight: 600; }
  .err { color: #FF7A86; font-size: 13px; margin: 10px 0 0; display: none; }
  .err.on { display: block; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <img class="logo" src="/mars-logo.png" alt="Mars">
    <h1>MARS</h1>
    <p>Espace staff · suivi des clippeurs</p>
    <input type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required autofocus aria-label="Mot de passe">
    <button type="submit">Se connecter</button>
    <div class="err" id="err">Mot de passe incorrect.</div>
  </form>
  <div class="credit"><img src="/neptune-logo.png" alt="">Developed by <b>Neptune</b></div>
  <script>if (location.search.includes('e=1')) document.getElementById('err').classList.add('on');</script>
</body>
</html>
