<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micka · Ton dossier business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EC;--ink:#111;--muted:#6E6A64;--line:#E6E1D8;--orange:#F07A1A;--pink:#F7B8E0;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.t{font-family:'Inter Tight',sans-serif;letter-spacing:-.035em}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.caps{font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
/* ---------- Accueil ---------- */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 0 30px}
.corner{position:absolute;top:40px;width:110px;height:110px;border:2px solid var(--ink);border-bottom:0}
.corner.l{left:68px;border-right:0;border-top-left-radius:10px}.corner.r{right:68px;border-left:0;border-top-right-radius:10px}
.logo{width:52px;height:44px;object-fit:contain;mix-blend-mode:multiply}
.hero h1{font-size:clamp(46px,8vw,96px);font-weight:800;margin-top:70px;text-align:center;line-height:1}
.hero h1 i{font-weight:800}
.reel{width:100%;margin-top:70px;perspective:1400px;overflow:hidden}
.track{display:flex;gap:28px;width:max-content;animation:slide 45s linear infinite;transform:rotateY(-6deg);padding:20px 0}
.track img{width:283px;height:340px;object-fit:cover;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.12)}
.track img:nth-child(odd){transform:translateY(-8px) rotate(-.6deg)}
@keyframes slide{to{translate:-50% 0}}
.sub{margin-top:60px;text-align:center;line-height:1.7}
.sub i{font-style:italic}
.big{font-size:clamp(52px,7vw,92px);font-weight:800;text-align:center;margin-top:20px}
.chev{margin-top:30px;width:40px;height:40px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.domain{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 20px}
.kick{color:var(--orange);font-size:13px;font-weight:700;letter-spacing:.3em;display:flex;align-items:center;gap:16px}
.kick:before,.kick:after{content:"";width:36px;height:2px;background:var(--orange)}
.domain h2{font-size:clamp(64px,11vw,150px);font-weight:800;line-height:.98;margin-top:22px;max-width:960px}
.domain p{font-size:clamp(19px,2.4vw,38px);color:#4a4742;max-width:860px;margin-top:40px;line-height:1.4}
.domain p b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:46px;max-width:900px}
.chips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px}
.cta{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:20px}
.cta .bgi{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(18px) saturate(.8);opacity:.55}
.cta:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(245,242,236,.75) 30%,var(--bg) 85%)}
.cta>*{position:relative;z-index:1}
.cta h2{font-size:clamp(40px,5.5vw,84px);font-weight:800;line-height:1.05;max-width:1050px}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:44px;padding:20px 42px;border-radius:999px;font-weight:700;font-size:17px;background:linear-gradient(180deg,#FFA36C,#F7B8E0);box-shadow:0 14px 34px rgba(240,122,26,.28);transition:transform .2s}
.pill:hover{transform:translateY(-2px) scale(1.02)}
footer{text-align:center;padding:30px;color:var(--muted);font-size:13px}
/* ---------- Parcours (mobile) ---------- */
#flow{position:fixed;inset:0;background:rgba(17,17,17,.96);display:none;justify-content:center;z-index:10}
#flow.on{display:flex}
.app{position:relative;width:100%;max-width:420px;height:100%;background:var(--bg);display:flex;flex-direction:column;padding:26px 20px 22px;overflow:hidden}
.bar{position:absolute;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--orange),#F27AC8);transition:width .5s}
.back{width:34px;height:34px;display:grid;place-items:center;margin-left:-8px}
.scr{flex:1;overflow-y:auto;padding-bottom:10px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}}
.scr h3{font-size:30px;font-weight:700;line-height:1.15;margin-top:8px}
.scr .hint{color:var(--muted);margin-top:8px}
.btn{margin-top:14px;height:58px;border-radius:999px;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(90deg,#5b5856,#111 60%);transition:opacity .2s}
.btn:disabled{background:linear-gradient(90deg,#c9c5bf,#aaa69f);cursor:default}
.chart{background:#fff;border-radius:26px;margin-top:34px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.06)}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.6s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:26px}
.opt{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #fff;border-radius:18px;padding:13px 9px;text-align:left;font-weight:600;font-size:13px;line-height:1.2;min-height:62px;box-shadow:0 1px 0 var(--line);transition:.15s}
.opt .e{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:15px}
.opt.sel{border-color:var(--orange);background:#FFF5EC}
.insp{background:#fff;border-radius:20px;padding:18px 20px;margin-top:12px;border:1.5px solid #fff}
.insp b{font-size:17px;font-weight:600}.insp p{color:var(--muted);margin-top:6px;line-height:1.5;font-size:15px}
.field{width:100%;margin-top:20px;height:62px;border-radius:16px;border:1.5px solid #9a958e;background:#F0EFED;padding:0 18px;font:inherit;font-size:17px}
.load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.frame{width:250px;padding:4px;border-radius:26px;background:linear-gradient(180deg,#F7B8E0,#FF9A4D);box-shadow:0 26px 60px rgba(255,154,77,.3)}
.frame img{display:block;width:100%;border-radius:22px}
.prog{width:140px;height:5px;border-radius:9px;background:#eee;margin-top:42px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F7B8E0,var(--orange));animation:fill 3.2s ease forwards}
@keyframes fill{to{width:100%}}
.res{background:#fff;border-radius:22px;padding:20px;margin-top:14px}
.res .caps{font-size:11px;color:var(--orange)}.res p{margin-top:8px;font-size:16px;line-height:1.45}
.res ol{margin:10px 0 0 18px;line-height:1.9;font-weight:600}
.close{position:absolute;top:18px;right:16px;font-size:22px;color:var(--muted)}
@media(max-width:440px){.opt{flex-direction:column;align-items:flex-start;padding:11px 10px;gap:6px;font-size:13.5px;min-height:78px}}
@media(max-width:700px){.corner{width:56px;height:56px;top:24px}.corner.l{left:16px}.corner.r{right:16px}.track img{width:180px;height:230px}.hero h1{margin-top:44px}.domain{padding:80px 16px}}
</style>
</head>

const DOMAINS = [['🏋️','Muscu'],['🏐','Volley-ball'],['🧵','Couture'],['💸','Achat-revente'],['❤️','Relations amoureuses'],['🍳','Cuisine'],['🎮','Jeux vidéo'],['✈️','Voyage'],['🎹','Musique / instrument'],['💻','Technologie / IA'],['👟','Mode et style'],['📈','Investissement et finance'],['♟️','Échecs'],['🚗','Voitures'],['⚽','Un autre sport'],['🤝','Vente'],['💼','Entreprise'],['📚','Études'],['✨','Briller'],['🤸','Entraînement de rue'],['💃','Danse'],['✏️','Autre']];
const IDEAS = {
  'Muscu':'Coaching pour transformer ton physique en 12 semaines','Volley-ball':'Programme pour progresser en saut et en attaque','Couture':'Formation pour créer tes propres pièces de A à Z',
  'Achat-revente':'Méthode pour trouver et revendre tes premiers produits','Relations amoureuses':'Coaching pour gagner en confiance en toi','Cuisine':'Recettes rapides et healthy pour étudiants',
  'Jeux vidéo':'Coaching pour progresser rapidement et dominer ton jeu','Voyage':'Guides pour voyager loin avec un petit budget','Musique / instrument':'Cours pour jouer tes premiers morceaux en 30 jours',
  'Technologie / IA':'Formation pour gagner du temps avec l’IA','Mode et style':'Coaching pour trouver ton style','Investissement et finance':'Méthode pour gérer et faire grandir ton argent',
  'Échecs':'Programme pour gagner 300 points Elo','Voitures':'Guide pour bien acheter sa première voiture','Un autre sport':'Programme d’entraînement personnalisé',
  'Vente':'Formation pour closer tes premiers clients','Entreprise':'Coaching pour quitter le salariat et vivre de ta passion','Études':'Méthode pour réviser 2× plus vite',
  'Briller':'Coaching pour prendre la parole avec assurance','Entraînement de rue':'Coaching pour maîtriser tes premiers éléments au poids du corps','Danse':'Cours pour apprendre les chorés du moment','Autre':'On la trouve ensemble pendant l’appel'
};
// Accueil
const track = document.getElementById('track');
track.innerHTML = [...VIDS, ...VIDS].map((s) => `<img src="${s}" alt="">`).join('');
document.getElementById('chips').innerHTML = DOMAINS.slice(0, 12).map(([e, n]) => `<span>${e} ${n}</span>`).join('');

// Parcours
let step = 0, picks = [], choix = '';
const $s = document.getElementById('screen'), $bar = document.getElementById('bar');
function openFlow() { step = 0; picks = []; choix = ''; document.getElementById('flow').classList.add('on'); render(); }
function closeFlow() { document.getElementById('flow').classList.remove('on'); }
function go(n) { step = n; render(); }
const back = (n) => `<button class="back" onclick="go(${n})"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>`;

function chart() {
  const pts = [[30, 210], [115, 200], [200, 172], [285, 120], [370, 50]];
  const lab = ['Domaine', 'Avatar', 'Profil d’optimisation', 'Contenu', 'Vente'];
  const d = 'M30 210 C 70 206, 95 203, 115 200 S 170 185, 200 172 S 255 140, 285 120 S 345 70, 370 50';
  return `<svg viewBox="0 0 400 260">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F07A1A" stop-opacity=".18"/><stop offset="1" stop-color="#F07A1A" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L370 220 L200 220 Z" fill="url(#g)" opacity=".8"/>
    <line x1="370" y1="60" x2="370" y2="220" stroke="#F07A1A" stroke-dasharray="3 5" opacity=".5"/>
    <path class="path" d="${d}" fill="none" stroke="#F07A1A" stroke-width="3" stroke-linecap="round"/>
    <rect x="40" y="152" width="78" height="26" rx="13" fill="#F5F2EC"/><text x="79" y="170" text-anchor="middle" font-size="12" font-weight="600">Aujourd’hui</text>
    <rect x="262" y="-2" width="120" height="30" rx="15" fill="#2a2a2a"/><text x="322" y="18" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">Tes 1res ventes 🚀</text>
    ${pts.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="12" fill="#fff" stroke="#F07A1A" stroke-width="2.5"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="12" font-weight="700">${i + 1}</text>
      <text x="${x + (i ? 0 : 2)}" y="${y + 30}" text-anchor="middle" font-size="9.5" letter-spacing="1.2" font-weight="${i ? 500 : 700}" fill="${i ? '#8a857e' : '#111'}">${lab[i].toUpperCase()}</text>`).join('')}
  </svg>`;
}

function render() {
  $bar.style.width = [8, 30, 55, 80, 100, 100][step] + '%';
  if (step === 0) $s.innerHTML = `<div class="scr" style="text-align:center;padding-top:30px">
      <p class="caps">Ce que dit notre plan d’action</p>
      <h3 style="margin-top:14px">Vois à quelle vitesse tu peux faire tes premières ventes</h3>
      <div class="chart">${chart()}</div></div>
    <button class="btn" onclick="go(1)">Continuer</button>`;
  if (step === 1) {
    $s.innerHTML = `${back(0)}<div class="scr"><h3>Les domaines que je kiffe sont…</h3><p class="hint">Sélectionne jusqu’à 3.</p>
      <div class="grid">${DOMAINS.map(([e, n]) => `<button class="opt ${picks.includes(n) ? 'sel' : ''}" onclick="pick('${n.replace(/'/g, "\\'")}')"><span class="e">${e}</span>${n}</button>`).join('')}</div></div>
      <button class="btn" ${picks.length ? '' : 'disabled'} onclick="go(2)">Suivant</button>`;
  }
  if (step === 2) {
    $s.innerHTML = `${back(1)}<div class="scr"><p class="caps" style="margin-top:6px">${picks.length} inspiration${picks.length > 1 ? 's' : ''} pour toi</p>
      ${picks.map((n) => `<div class="insp"><b>${n}</b><p>Idée de produit : ${IDEAS[n]}</p></div>`).join('')}
      <h3 style="margin-top:38px">Maintenant, tranche</h3><p class="hint">Écris le domaine dans lequel tu veux te lancer</p>
      <input class="field" id="dom" placeholder="remplir…" value="${choix}" oninput="choix=this.value;document.getElementById('ok').disabled=!this.value.trim()"></div>
      <button class="btn" id="ok" ${choix.trim() ? '' : 'disabled'} onclick="go(3)">Confirmer</button>`;
  }
  if (step === 3) {
    $s.innerHTML = `<div class="load"><div class="frame"><img src="${MICKA}" alt="Micka"></div><div class="prog"><i></i></div>
      <h3 style="margin-top:34px;font-size:27px">On construit ton dossier</h3><p class="hint">On relit tes réponses…</p></div>`;
    setTimeout(() => step === 3 && go(4), 3300);
  }
  if (step === 4) {
    const dom = choix.trim() || picks[0];
    $s.innerHTML = `<div class="scr"><p class="caps" style="margin-top:6px">Ton dossier business</p>
      <h3>${dom.replace(/</g, '&lt;')}, <i>c’est parti.</i></h3>
      <div class="res"><span class="caps">Ton domaine</span><p>${dom.replace(/</g, '&lt;')}</p></div>
      <div class="res"><span class="caps">Ton plan en 5 étapes</span><ol><li>Domaine ✅</li><li>Avatar</li><li>Profil d’optimisation</li><li>Contenu</li><li>Vente</li></ol></div>
      <div class="res"><span class="caps">Prochaine étape</span><p>On définit ton avatar ensemble avec Micka.</p></div></div>
      <button class="btn" onclick="closeFlow()">Réserver mon appel</button>`;
  }
}
function pick(n) {
  if (picks.includes(n)) picks = picks.filter((x) => x !== n);
  else if (picks.length < 3) picks.push(n);
  const sc = $s.querySelector('.scr').scrollTop; render(); $s.querySelector('.scr').scrollTop = sc;
}
</script>
